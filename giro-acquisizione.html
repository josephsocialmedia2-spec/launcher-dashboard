<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070907"><title>F1 — Giro Acquisizione</title><style>:root{--bg:#070907;--p:#101510;--line:#2a342c;--txt:#fff;--mut:#aeb7b0;--g:#39f28a;--amber:#f4c95d;--red:#ff7777}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#050705,#0b110c);color:var(--txt);font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 12px 100px}.ey{color:var(--g);font-size:10px;font-weight:900;letter-spacing:.15em}h1{margin:5px 0 6px;font-size:clamp(28px,8vw,46px)}.lead{color:var(--mut);font-size:13px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.stat b{display:block;color:var(--g);font-size:24px}.stop{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:10px}.place{font-size:19px;font-weight:900}.addr{font-size:16px;margin-top:4px}.score{color:var(--g);font-size:10px;font-weight:900}.info{margin-top:10px;padding:10px;border-radius:10px;background:#0c120e;border:1px solid #203025;font-size:12px;line-height:1.55}.label{display:block;color:var(--mut);font-size:9px;font-weight:900;letter-spacing:.08em;margin-top:8px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}.btn{border:1px solid #35513d;background:#172319;color:#fff;padding:11px 8px;border-radius:10px;text-align:center;text-decoration:none;font-size:11px;font-weight:900}.btn.main{background:var(--g);color:#07100a}.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--mut)}.foot{position:fixed;left:0;right:0;bottom:0;background:#070907f3;border-top:1px solid var(--line);padding:8px}.footin{max-width:920px;margin:auto;display:flex;gap:7px;justify-content:center}.foot a{padding:10px;border-radius:9px;background:#171d18;color:#fff;text-decoration:none;font-size:10px;font-weight:900}@media(max-width:650px){.summary{grid-template-columns:1fr 1fr 1fr}.top{display:block}.actions{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="ey">F1 IMMOBILIARE · GIRO DA SELLER RADAR UNICO</div><h1>GIRO ACQUISIZIONE</h1><p class="lead">Questa schermata non usa più il presidio bisettimanale come sorgente principale. Mostra solo gli elementi del Seller Radar con indirizzo operativo e azione <b>VAI IN ZONA</b>.</p><div class="summary"><div class="stat"><b id="tot">0</b>fermate</div><div class="stat"><b id="high">0</b>score ≥ 60</div><div class="stat"><b id="other">0</b>altre</div></div><section id="list"><div class="empty">Carico il giro...</div></section></main><div class="foot"><div class="footin"><a href="oggi.html">OGGI</a><a href="telefonate-oggi.html">TELEFONATE</a><a href="crm.html">CRM</a></div></div><script>const DATA='https://josephsocialmedia2-spec.github.io/immobili-in-zona/seller_radar_auto/data/giro_acquisizione.csv';function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i];if(q){if(x==='"'&&t[i+1]==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===','){r.push(c);c=''}else if(x==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(x!=='\r')c+=x}if(c||r.length){r.push(c);rows.push(r)}if(rows.length<2)return[];let h=rows.shift();return rows.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k.trim(),(x[i]||'').trim()]))) }function maps(r){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((r.DOVE_ANDRE||'')+', '+(r.COMUNE||'')+', TO, Italia')}function card(r){return `<article class="stop"><div class="top"><div><div class="place">${esc(r.COMUNE)}</div><div class="addr">${esc(r.DOVE_ANDRE)}</div></div><span class="score">score ${esc(r.SCORE)}</span></div><div class="info"><span class="label">COSA CERCO</span>${esc(r.COSA_CERCO)}<span class="label">PREZZO</span>${esc(r.PREZZO||'PREZZO DA VERIFICARE')}<span class="label">SELLER SIGNAL</span>${esc(r.SELLER_SIGNAL||'NON DETERMINATO')}<span class="label">FONTE</span>${esc(r.FONTE)}</div><div class="actions"><a class="btn main" target="_blank" href="${maps(r)}">MAPPA</a>${r.URL?`<a class="btn" target="_blank" href="${esc(r.URL)}">FONTE</a>`:'<span></span>'}</div></article>`}async function load(){try{let t=await fetch(DATA+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()),data=parseCSV(t);let route=data.filter(r=>/VAI IN ZONA/i.test(r.AZIONE||'')&&!/DA VERIFICARE/i.test(r.DOVE_ANDRE||''));route.sort((a,b)=>(+b.SCORE||0)-(+a.SCORE||0));tot.textContent=route.length;high.textContent=route.filter(r=>(+r.SCORE||0)>=60).length;other.textContent=route.filter(r=>(+r.SCORE||0)<60).length;list.innerHTML=route.length?route.map(card).join(''):'<div class="empty">Nessuna fermata operativa disponibile dal Seller Radar.</div>'}catch(e){list.innerHTML='<div class="empty">Impossibile caricare il giro dal Seller Radar.</div>'}}load();</script></body></html>
