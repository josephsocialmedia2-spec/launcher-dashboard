<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ripristino F1</title><style>body{margin:0;background:#070907;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}b{color:#39f28a;font-size:24px}p{color:#aeb7b0}</style></head><body><div><b>Ripristino gestionale F1</b><p id="s">Pulizia cache in corso...</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch(e){}document.getElementById('s').textContent='Ripristino completato. Riapro il gestionale...';setTimeout(()=>location.replace('./index.html?v=20260820-3'),700)})();</script></body></html>
