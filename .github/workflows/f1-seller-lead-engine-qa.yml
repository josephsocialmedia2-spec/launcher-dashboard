name: F1 Seller Lead Engine QA
on:
  push:
    branches: [main]
    paths:
      - 'seller-lead-engine.html'
      - 'seller-lead-engine.js'
      - 'config/seller-lead-engine.json'
      - 'scripts/seller_lead_engine.py'
      - 'data/seller-lead-engine-public.json'
      - 'data/postiz-outbox.json'
      - 'data/communication-outbox.json'
      - 'tests/test_seller_lead_engine.py'
      - 'tests/seller-lead-engine.spec.js'
      - 'docs/FOLLOWUP_RULES.md'
      - 'docs/F1_SELLER_LEAD_ENGINE_INTEGRATION.md'
      - '.github/workflows/f1-seller-lead-engine-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'seller-lead-engine.html'
      - 'seller-lead-engine.js'
      - 'config/seller-lead-engine.json'
      - 'scripts/seller_lead_engine.py'
      - 'data/seller-lead-engine-public.json'
      - 'data/postiz-outbox.json'
      - 'data/communication-outbox.json'
      - 'tests/test_seller_lead_engine.py'
      - 'tests/seller-lead-engine.spec.js'
      - 'docs/FOLLOWUP_RULES.md'
      - 'docs/F1_SELLER_LEAD_ENGINE_INTEGRATION.md'
      - '.github/workflows/f1-seller-lead-engine-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m py_compile scripts/seller_lead_engine.py
          python -m json.tool config/seller-lead-engine.json >/dev/null
          python -m unittest tests/test_seller_lead_engine.py -v
          python scripts/seller_lead_engine.py
          python -m json.tool data/seller-lead-engine-public.json >/dev/null
          python -m json.tool data/postiz-outbox.json >/dev/null
          python -m json.tool data/communication-outbox.json >/dev/null
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install
          npx playwright install --with-deps chromium
          node --check seller-lead-engine.js
          npx playwright test tests/seller-lead-engine.spec.js --project=desktop-chromium --project=mobile-chromium
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/seller-lead-engine.html?qa=$RANDOM" -o /tmp/seller.html               && curl -fsSL --max-time 20 "$base/seller-lead-engine.js?qa=$RANDOM" -o /tmp/seller.js               && curl -fsSL --max-time 20 "$base/data/seller-lead-engine-public.json?qa=$RANDOM" -o /tmp/feed.json               && curl -fsSL --max-time 20 "$base/data/communication-outbox.json?qa=$RANDOM" -o /tmp/comms.json               && grep -q 'F1 SELLER LEAD ENGINE' /tmp/seller.html               && grep -q 'COMUNICAZIONI' /tmp/seller.html               && grep -q 'communication_scheduler' /tmp/feed.json               && grep -q '"status": "QUEUE_READY"' /tmp/comms.json               && grep -q 'https://www.agentpricing.com/j.malafronte' /tmp/seller.html; then
                ok=1
                break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS F1 Seller Lead Engine live GitHub Pages'
