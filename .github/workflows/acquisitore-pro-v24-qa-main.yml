name: Acquisitore Pro v24 QA Main

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'qa-results-main/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run regression suite and capture JSON
        shell: bash
        run: |
          mkdir -p qa-results-main
          set +e
          npx playwright test tests/acquisitore-pro-v24.spec.js --reporter=json > qa-results-main/report.json
          code=$?
          echo "$code" > qa-results-main/exit-code.txt
          exit 0
      - name: Summarize failures
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync('qa-results-main/report.json','utf8')); } catch {}
          const failures = [];
          function walkSuite(s) {
            for (const spec of s.specs || []) {
              for (const t of spec.tests || []) {
                for (const r of t.results || []) {
                  if (r.status && !['passed','skipped'].includes(r.status)) {
                    failures.push({title:[...(s.titlePath||[]),spec.title].filter(Boolean).join(' > '),project:t.projectName||'',status:r.status,error:(r.errors?.[0]?.message||r.error?.message||'').slice(0,1800)});
                  }
                }
              }
            }
            for (const child of s.suites || []) walkSuite(child);
          }
          for (const s of report.suites || []) walkSuite(s);
          const exitCode = Number((fs.existsSync('qa-results-main/exit-code.txt') ? fs.readFileSync('qa-results-main/exit-code.txt','utf8') : '99').trim());
          fs.writeFileSync('qa-results-main/summary.json',JSON.stringify({generatedAt:new Date().toISOString(),exitCode,stats:report.stats||null,failures},null,2));
          NODE
      - name: Commit QA results
        if: always()
        shell: bash
        run: |
          git config user.name "acquisitore-pro-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- qa-results-main/report.json qa-results-main/summary.json qa-results-main/exit-code.txt
          if ! git diff --cached --quiet; then
            git commit -m "qa: store latest Acquisitore Pro v24 main test results"
            git push origin HEAD:main
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisitore-pro-v24-playwright-main
          path: |
            qa-results-main/
            test-results/
          if-no-files-found: ignore
      - name: Set workflow result
        if: always()
        shell: bash
        run: exit "$(cat qa-results-main/exit-code.txt 2>/dev/null || echo 1)"
