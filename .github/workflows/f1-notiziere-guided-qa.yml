name: F1 Notiziere Guided QA

on:
  push:
    branches: [ main ]
    paths:
      - 'f1-notiziere-engine.js'
      - 'notiziere-civico.html'
      - 'notiziere-civico.js'
      - 'territory-mobile.html'
      - 'funzionario-notiziere.html'
      - 'ricerca-territoriale.html'
      - 'ricerca-territoriale.js'
      - 'f1-dashboard-auth-guard.js'
      - 'f1-tour-admin-dashboard.js'
      - 'f1-staff-access-panel.js'
      - 'assegna-giro.html'
      - 'assegna-giro.js'
      - 'f1-notiziere-assistant-bridge.js'
      - 'f1-notiziere-crm-mode.js'
      - 'crm-territory-handoff.js'
      - 'giro-acquisizione.html'
      - 'supabase-migrations/20260917_f1_territory_mobile_operating_system_v2.sql'
      - 'supabase-migrations/20260916_f1_tour_assignment_admin.sql'
      - 'supabase-migrations/20260916_f1_staff_dashboard_access_log.sql'
      - 'tests/notiziere-guided.spec.js'
      - 'tests/tour-assignment.spec.js'
      - 'tests/staff-access-panel.spec.js'
      - '.github/workflows/f1-notiziere-guided-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-notiziere-guided-qa
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Guided Notiziere + F1 Territory + assegnazione giro + accessi dashboard
        run: npx playwright test tests/notiziere-guided.spec.js tests/tour-assignment.spec.js tests/staff-access-panel.spec.js --config=playwright.config.js --reporter=line
