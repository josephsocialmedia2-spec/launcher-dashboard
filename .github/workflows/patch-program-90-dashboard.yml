name: Patch Program 90 dashboard
on:
  push:
    paths:
      - '.github/workflows/patch-program-90-dashboard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''.p90-widget{border:2px solid #39f28a;border-radius:18px;padding:18px;background:radial-gradient(circle at top right,#17412755,transparent 42%),linear-gradient(145deg,#0d1810,#102817);margin-bottom:24px}.p90-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.p90-widget h2{margin:4px 0 5px;font-size:26px}.p90-widget p{margin:0;color:#bed0c1;font-size:11px;line-height:1.5}.p90-open{display:inline-flex;padding:11px 13px;border-radius:9px;background:#39f28a;color:#07100a;text-decoration:none;font-size:10px;font-weight:900;white-space:nowrap}.p90-progress{height:11px;border:1px solid #35513d;border-radius:999px;background:#07100a;overflow:hidden;margin:11px 0}.p90-progress>div{height:100%;width:0;background:linear-gradient(90deg,#39f28a,#f4c95d)}.p90-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.p90-stats div{padding:9px;text-align:center;border:1px solid #2c4031;border-radius:10px;background:#0b120d}.p90-stats b{display:block;color:#39f28a;font-size:18px}.p90-stats span{display:block;color:#aeb7b0;font-size:7px;font-weight:900}@media(max-width:800px){.p90-top{display:block}.p90-open{margin-top:10px;width:100%;justify-content:center}.p90-stats{grid-template-columns:1fr 1fr}}'''
          if '.p90-widget{' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          block='''<section class="p90-widget" id="program90Widget">\n  <div class="p90-top"><div><div class="ey">ROUTINE OPERATIVA · 90 GIORNI</div><h2>PROGRAMMA 90 GIORNI</h2><p id="p90Stage">Caricamento giornata operativa…</p></div><a class="p90-open" href="program-90.html">APRI PROGRAMMA DI OGGI →</a></div>\n  <div class="p90-progress"><div id="p90Progress"></div></div>\n  <div class="p90-stats"><div><b id="p90Day">— / 90</b><span>GIORNO</span></div><div><b id="p90Completed">0 / 4</b><span>ATTIVITÀ COMPLETATE</span></div><div><b id="p90Time">0m / 6h 30m</b><span>TEMPO PRODUTTIVO</span></div><div><b id="p90Prospecting">0 / 20</b><span>CONTATTI PROSPECTING</span></div><div><b id="p90Preview">0 / 5–7</b><span>PREVIEW IMMOBILI</span></div><div><b id="p90Followup">0 / 10</b><span>FOLLOW-UP</span></div></div>\n</section>\n'''
          if 'id="program90Widget"' not in s:
              marker='<section class="mp-widget" id="marketPreviewWidget">'
              if marker not in s: raise SystemExit('Market Preview marker not found')
              s=s.replace(marker,block+marker,1)
          tag='<script src="program-90-widget.js?v=20260913-p90-1"></script>\n'
          if 'program-90-widget.js' not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'id="program90Widget"' index.html
          grep -q 'GIORNO' index.html
          grep -q 'program-90-widget.js?v=20260913-p90-1' index.html
      - name: Commit dashboard
        run: |
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Program 90 days dashboard card'
          git push