name: F1 Unified CRM QA

on:
  push:
    branches:
      - main
      - 'perf/**'
    paths:
      - 'crm.html'
      - 'crm-auth-guard.js'
      - 'crm-unified-app.js'
      - 'crm-import-app.js'
      - 'f1-acquisition-data.js'
      - 'market-listing-ui.js'
      - 'market-interest-engine.js'
      - 'supabase-sync.js'
      - 'supabase-migrations/20260915_f1_crm_paginated_lead_page.sql'
      - 'supabase-migrations/20260915_f1_crm_phase2_runtime_queries.sql'
      - 'f1-opportunity-crm.js'
      - 'f1-opportunity-crm-ui.js'
      - 'f1-opportunity-crm-ui-v2.js'
      - 'f1-os-mobile.html'
      - 'gestione-app.html'
      - 'system-registry.json'
      - 'tests/unified-crm.spec.js'
      - 'tests/crm-phase2.spec.js'
      - '.github/workflows/f1-unified-crm-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static CRM validation
        shell: bash
        run: |
          set -euo pipefail
          node --check f1-acquisition-data.js
          node --check supabase-sync.js
          node --check crm-auth-guard.js
          node --check crm-unified-app.js
          node --check crm-import-app.js
          node --check market-listing-ui.js
          node --check market-interest-engine.js
          node --check f1-opportunity-crm.js
          node --check f1-opportunity-crm-ui-v2.js
          node --check tests/unified-crm.spec.js
          node --check tests/crm-phase2.spec.js
          grep -q 'F1 ACQUISITION ENGINE · CRM UNIFICATO' crm.html
          grep -q 'LEAD · INTERAZIONI · TASK' crm.html
          grep -q 'SALVA NEL CRM' f1-opportunity-crm-ui-v2.js
          grep -q 'CRM legacy disattivato' supabase-sync.js
          grep -q 'READ_ONLY_CACHE' system-registry.json
          grep -q "F1_BOOT_START" crm-auth-guard.js
          grep -q "COUNT_KPI" crm-auth-guard.js
          grep -q "LOAD_FIRST_50" crm-auth-guard.js
          grep -q "LOAD_VISIBLE_TASKS" crm-auth-guard.js
          grep -q "DETAIL_LOAD" crm-auth-guard.js
          grep -q "INTERACTIONS_LOAD" crm-auth-guard.js
          grep -q "DOSSIER_LOAD" crm-auth-guard.js
          grep -q "console.table" crm-auth-guard.js
          grep -q "rpc/f1_crm_kpis" f1-acquisition-data.js
          grep -q "rpc/f1_crm_lead_page_v2" f1-acquisition-data.js
          grep -q "rpc/f1_crm_visible_tasks" f1-acquisition-data.js
          grep -q "pullInteractionsForLead" f1-acquisition-data.js
          grep -q "method:'PATCH'" f1-acquisition-data.js
          grep -q "PAGE_SIZE=50" crm-unified-app.js
          grep -q "SEARCH_DEBOUNCE_MS=300" crm-unified-app.js
          grep -q "tasksByLead:new Map" crm-unified-app.js
          grep -q "updateLeadCard" crm-unified-app.js
          grep -q "applyUpdatedLead" crm-unified-app.js
          grep -q "loadXlsxLibrary" crm-import-app.js
          grep -q "DOSSIER_LOAD_START" market-interest-engine.js
          grep -q "applyUpdatedLead" market-listing-ui.js
          ! grep -q 'xlsx.full.min.js.*</script>' crm.html
          grep -q "create or replace function public.f1_crm_kpis" supabase-migrations/20260915_f1_crm_phase2_runtime_queries.sql
          grep -q "create or replace function public.f1_crm_visible_tasks" supabase-migrations/20260915_f1_crm_phase2_runtime_queries.sql
          grep -q "create or replace function public.f1_crm_lead_page_v2" supabase-migrations/20260915_f1_crm_phase2_runtime_queries.sql
          ! grep -q "f1OSStateV3" f1-os-mobile.html
          ! grep -q "f1CRMContacts.*contatti" gestione-app.html
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: CRM functional and Phase 2 QA
        run: npx playwright test tests/unified-crm.spec.js tests/crm-phase2.spec.js --project=desktop-chromium
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crm-phase2-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
      - name: Live GitHub Pages smoke
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/crm.html?qa=$RANDOM" -o /tmp/crm.html \
              && curl -fsSL --max-time 20 "$base/crm-auth-guard.js?qa=$RANDOM" -o /tmp/guard.js \
              && curl -fsSL --max-time 20 "$base/crm-unified-app.js?qa=$RANDOM" -o /tmp/app.js \
              && curl -fsSL --max-time 20 "$base/f1-acquisition-data.js?qa=$RANDOM" -o /tmp/data.js \
              && curl -fsSL --max-time 20 "$base/crm-import-app.js?qa=$RANDOM" -o /tmp/import.js \
              && grep -q 'CRM UNIFICATO' /tmp/crm.html \
              && grep -q 'COUNT_KPI' /tmp/guard.js \
              && grep -q 'SEARCH_DEBOUNCE_MS=300' /tmp/app.js \
              && grep -q 'rpc/f1_crm_lead_page_v2' /tmp/data.js \
              && grep -q 'loadXlsxLibrary' /tmp/import.js \
              && ! grep -q 'xlsx.full.min.js.*</script>' /tmp/crm.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS unified CRM Phase 2 deployed'
