name: F1 Network News Navigation Fix
on:
  push:
    paths:
      - '.github/workflows/f1-network-news-navigation-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add network to news and return navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Fondo Ricostruzione Rete -> Modulo Notizie
          p=Path('network-reconstruction.html')
          s=p.read_text()
          marker='</main>\n<footer><a href="index.html">DASHBOARD</a><a href="network-reconstruction.html">RETE 250</a><a href="crm.html">CRM COMMERCIALE</a></footer>'
          panel='''<section class="panel" id="networkNewsNav" style="margin-top:18px;text-align:center"><div class="ey">NOTIZIA IMMOBILIARE EMERSA DALLA RETE?</div><h2 style="margin:6px 0 10px">REGISTRALA PRIMA DI PROSEGUIRE</h2><div class="actions" style="justify-content:center"><a id="addNewsFromNetwork" class="btn" href="funzionario-notiziere.html?from=network#newsForm">+ AGGIUNGI NOTIZIA</a></div></section>\n</main>\n<footer><a href="index.html">DASHBOARD</a><a href="network-reconstruction.html">RETE 250</a><a href="crm.html">CRM COMMERCIALE</a></footer>'''
          if 'id="addNewsFromNetwork"' not in s:
              if marker not in s:
                  raise SystemExit('network footer marker not found')
              s=s.replace(marker,panel,1)
          p.write_text(s)

          # 2) Modulo Notizie -> ritorno a Ricostruzione Rete
          p=Path('funzionario-notiziere.html')
          s=p.read_text()
          marker='<div id="newsList" class="list" style="max-height:220px;margin-top:7px"></div></section></aside>'
          replacement='<div id="newsList" class="list" style="max-height:220px;margin-top:7px"></div><div class="actions" style="margin-top:12px"><a id="backToNetworkReconstruction" class="btn" href="network-reconstruction.html">← RITORNA A RICOSTRUZIONE RETE</a></div></section></aside>'
          if 'id="backToNetworkReconstruction"' not in s:
              if marker not in s:
                  raise SystemExit('news module marker not found')
              s=s.replace(marker,replacement,1)

          # Se l'utente arriva dal modulo rete con sessione scaduta, preserva query + anchor nel ritorno login.
          old="location.replace('setup-cloud.html?return='+encodeURIComponent('funzionario-notiziere.html'))"
          new="location.replace('setup-cloud.html?return='+encodeURIComponent('funzionario-notiziere.html'+location.search+location.hash))"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify navigation contract
        run: |
          set -euxo pipefail
          grep -q 'id="addNewsFromNetwork"' network-reconstruction.html
          grep -q 'href="funzionario-notiziere.html?from=network#newsForm"' network-reconstruction.html
          grep -q 'id="newsForm"' funzionario-notiziere.html
          grep -q 'id="backToNetworkReconstruction"' funzionario-notiziere.html
          grep -q 'href="network-reconstruction.html"' funzionario-notiziere.html
          grep -q "funzionario-notiziere.html'+location.search+location.hash" funzionario-notiziere.html
      - name: Commit navigation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add network-reconstruction.html funzionario-notiziere.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add network to news round-trip navigation'
          git push origin HEAD:main
