name: F1 Sync Current Radar Fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f1-sync-current-radar-fast.yml'

permissions:
  contents: write

concurrency:
  group: f1-sync-current-radar-fast
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load current Seller Radar without blocking on OSM enrichment
        env:
          F1_NEIGHBORHOOD_RADIUS: '500'
          F1_NEIGHBORHOOD_MAX_ENRICH: '0'
        run: python scripts/neighborhood_intelligence.py

      - name: Build Territory Control
        run: python scripts/territory_orchestrator.py

      - name: Validate current output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=json.loads(Path('data/neighborhood_intelligence.json').read_text(encoding='utf-8'))
          t=json.loads(Path('data/territory_operations.json').read_text(encoding='utf-8'))
          assert n['signals_count'] > 0
          assert t['summary']['signals_total'] > 0
          assert not any(c.get('side') == 'FUORI_LISTA' for c in t['communes'])
          print('PASS FAST LAUNCHER SYNC', n['generated_at'], t['generated_at'])
          PY

      - name: Publish current launcher data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-neighborhood-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/neighborhood_intelligence.json data/neighborhood_seen.json data/territory_operations.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Refresh launcher from current Seller Radar'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
