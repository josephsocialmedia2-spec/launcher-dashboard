name: F1 Market Preview QA
on:
  push:
    paths:
      - 'index.html'
      - 'market-preview.html'
      - 'market-preview*.js'
      - 'tests/market-preview.spec.js'
      - '.github/workflows/f1-market-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: |
          set -e
          for f in market-preview*.js tests/market-preview.spec.js; do node --check "$f"; done
          grep -q 'id="marketPreviewWidget"' index.html
          grep -q 'CONTROLLO DUPLICATI' market-preview.html
          grep -q 'F1-006' script-data-2.js
          grep -q 'F1-007' script-data-2.js
          grep -q 'MARKET_PREVIEW_PRICE_CHANGED' market-preview-preview.js
          grep -q 'M.appendEvent' market-preview-preview.js
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Market Preview E2E
        run: npx playwright test tests/market-preview.spec.js --project=desktop-chromium
      - name: CRM regression
        run: npx playwright test tests/crm-full-e2e.spec.js tests/crm-excel-import.spec.js --project=desktop-chromium
      - name: Live Pages smoke
        run: |
          set -e
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          for i in $(seq 1 60); do
            if curl -fsSL "$base/index.html?qa=$RANDOM" -o /tmp/i && curl -fsSL "$base/market-preview.html?qa=$RANDOM" -o /tmp/m && grep -q 'id="marketPreviewWidget"' /tmp/i && grep -q 'CONTROLLO DUPLICATI' /tmp/m; then exit 0; fi
            sleep 5
          done
          exit 1