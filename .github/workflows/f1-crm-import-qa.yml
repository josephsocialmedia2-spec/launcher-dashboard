name: F1 CRM Cloud Contract QA

on:
  push:
    paths:
      - 'crm.html'
      - 'crm-auth-guard.js'
      - 'crm-import-app.js'
      - 'crm-unified-app.js'
      - 'f1-acquisition-data.js'
      - 'f1-acquisition-core.js'
      - 'supabase-config.js'
      - 'supabase-sync.js'
      - 'setup-cloud.html'
      - 'f1-opportunity-crm.js'
      - 'f1-opportunity-crm-ui-v2.js'
      - 'tests/crm-excel-import.spec.js'
      - 'tests/cloud-auth.spec.js'
      - 'tests/crm-full-e2e.spec.js'
      - 'tests/unified-crm.spec.js'
      - 'package.json'
      - '.github/workflows/f1-crm-import-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static CRM cloud contract validation
        shell: bash
        run: |
          set -euo pipefail
          node --check crm-auth-guard.js
          node --check crm-import-app.js
          node --check supabase-sync.js
          node --check f1-acquisition-data.js
          node --check tests/crm-excel-import.spec.js
          node --check tests/cloud-auth.spec.js
          node --check tests/crm-full-e2e.spec.js
          node --check tests/unified-crm.spec.js
          grep -q 'CARICA CONTATTI EXCEL' crm.html
          grep -q 'CONFERMA E IMPORTA' crm.html
          grep -q 'crm_import_log' crm-import-app.js
          grep -q 'function ensureCloud()' crm-import-app.js
          grep -q 'loadXlsxLibrary' crm-import-app.js
          ! grep -q 'xlsx.full.min.js.*</script>' crm.html
          grep -q 'signInWithPassword' supabase-sync.js
          grep -q 'ensureSession' supabase-sync.js
          grep -q "authBase()+'user'" supabase-sync.js
          grep -q 'ACCESSO CRM RICHIESTO' crm-auth-guard.js
          grep -q 'ACCEDI AL CRM' crm-auth-guard.js
          grep -q "url: 'https://nqnmlsmeiynxbdojeyjt.supabase.co'" supabase-config.js
          grep -q "anonKey: 'sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu'" supabase-config.js
          grep -q 'crm-auth-guard.js?v=' crm.html
          grep -q 'f1-acquisition-data.js?v=' crm.html
          grep -q 'async function pullKpis(){requireCloud();' f1-acquisition-data.js
          grep -q 'async function pullVisibleTasks(leadIds=' f1-acquisition-data.js
          grep -q 'rpc/f1_crm_lead_page_v2' f1-acquisition-data.js
          grep -q 'async function pullLeads(){requireCloud();' f1-acquisition-data.js
          grep -q 'async function pullTasks(){requireCloud();' f1-acquisition-data.js
          grep -q 'async function pullInteractions(){requireCloud();' f1-acquisition-data.js
          grep -q 'privateData=cloud?await Promise.all' f1-acquisition-data.js
          if grep -q "url: localStorage.getItem('f1SupabaseUrl')" supabase-config.js; then
            echo 'Legacy browser backend override forbidden for canonical CRM'
            exit 1
          fi
          if grep -q 'if(!cloudReady())return Core().localLeads()' f1-acquisition-data.js \
            || grep -q 'if(!cloudReady())return Core().localTasks()' f1-acquisition-data.js \
            || grep -q 'if(!cloudReady())return localInteractions()' f1-acquisition-data.js; then
            echo 'Local CRM fallback is forbidden: Supabase must remain the only CRM source of truth'
            exit 1
          fi
          if grep -R -E 'service_role|sb_secret_|sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY|api\.openai\.com' crm.html crm-auth-guard.js crm-import-app.js supabase-sync.js setup-cloud.html; then
            echo 'Public secret credential/API reference forbidden'
            exit 1
          fi
      - name: Supabase HTTP and CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          base='https://nqnmlsmeiynxbdojeyjt.supabase.co'
          key='sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu'
          origin='https://josephsocialmedia2-spec.github.io'
          code=$(curl -sS --max-time 20 -o /tmp/auth-health.json -w '%{http_code}' "$base/auth/v1/health" -H "apikey: $key")
          test "$code" = '200'
          cors_code=$(curl -sS --max-time 20 -D /tmp/cors.headers -o /tmp/cors.body -w '%{http_code}' -X OPTIONS "$base/rest/v1/leads?select=lead_id&limit=1" \
            -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: apikey,authorization')
          case "$cors_code" in 200|204) ;; *) echo "Unexpected CORS HTTP $cors_code"; cat /tmp/cors.headers; exit 1;; esac
          tr -d '\r' < /tmp/cors.headers | grep -Eqi '^access-control-allow-origin: (\*|https://josephsocialmedia2-spec\.github\.io)$'
          echo "PASS Supabase HTTP health=$code CORS=$cors_code"
      - name: Install QA dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Supabase authentication and refresh persistence E2E
        run: npx playwright test tests/cloud-auth.spec.js --project=desktop-chromium
      - name: Full authenticated CRM browser E2E
        run: npx playwright test tests/crm-full-e2e.spec.js --project=desktop-chromium
      - name: Unified CRM opportunity graph and deduplication E2E
        run: npx playwright test tests/unified-crm.spec.js --project=desktop-chromium
      - name: Excel import into unified CRM E2E
        run: npx playwright test tests/crm-excel-import.spec.js --project=desktop-chromium
      - name: Live GitHub Pages smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/crm.html?qa=$RANDOM" -o /tmp/crm.html \
              && curl -fsSL --max-time 20 "$base/crm-auth-guard.js?qa=$RANDOM" -o /tmp/guard.js \
              && curl -fsSL --max-time 20 "$base/supabase-config.js?qa=$RANDOM" -o /tmp/config.js \
              && curl -fsSL --max-time 20 "$base/supabase-sync.js?qa=$RANDOM" -o /tmp/sync.js \
              && curl -fsSL --max-time 20 "$base/f1-acquisition-data.js?qa=$RANDOM" -o /tmp/data.js \
              && curl -fsSL --max-time 20 "$base/crm-import-app.js?qa=$RANDOM" -o /tmp/import.js \
              && curl -fsSL --max-time 20 "$base/setup-cloud.html?qa=$RANDOM" -o /tmp/setup.html \
              && grep -q 'CARICA CONTATTI EXCEL' /tmp/crm.html \
              && grep -q 'crm-auth-guard.js?v=' /tmp/crm.html \
              && ! grep -q 'xlsx.full.min.js.*</script>' /tmp/crm.html \
              && grep -q 'ACCESSO CRM RICHIESTO' /tmp/guard.js \
              && grep -q "url: 'https://nqnmlsmeiynxbdojeyjt.supabase.co'" /tmp/config.js \
              && grep -q 'ensureSession' /tmp/sync.js \
              && grep -q 'ACCESSO SUPABASE NEGATO' /tmp/data.js \
              && grep -q 'async function pullKpis(){requireCloud();' /tmp/data.js \
              && grep -q 'async function pullVisibleTasks(leadIds=' /tmp/data.js \
              && grep -q 'rpc/f1_crm_lead_page_v2' /tmp/data.js \
              && grep -q 'loadXlsxLibrary' /tmp/import.js \
              && grep -q 'ACCEDI AL CRM' /tmp/setup.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS canonical CRM cloud authentication and live deployment'
