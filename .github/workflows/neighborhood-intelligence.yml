name: F1 Seller Radar Nightly Intelligence

on:
  workflow_dispatch:
  push:
    branches: [f1-territory-crm-directive]
    paths:
      - '.github/workflows/neighborhood-intelligence.yml'
      - 'scripts/neighborhood_intelligence_v4.py'
      - 'scripts/territory_orchestrator.py'
      - 'scripts/territory_config.py'
      - 'config/territory.json'
  schedule:
    # 02:17 Europe/Rome. Due finestre UTC gestiscono CET/CEST; il gate sceglie solo le 02 locali.
    - cron: '17 0 * * *'
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: f1-seller-radar-nightly
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Gate 02 Europe/Rome
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(TZ=Europe/Rome date +%H)" = "02" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build dynamic Seller Radar intelligence
        if: steps.gate.outputs.run == 'true'
        env:
          F1_NEIGHBORHOOD_HALF_SIDE: '1000'
          F1_NEIGHBORHOOD_MAX_ENRICH: '0'
        run: python scripts/neighborhood_intelligence_v4.py

      - name: Build territorial operations
        if: steps.gate.outputs.run == 'true'
        run: python scripts/territory_orchestrator.py

      - name: Validate outputs
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scripts/territory_config.py scripts/neighborhood_intelligence_v4.py scripts/territory_orchestrator.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/territory.json').read_text(encoding='utf-8'))
          n=json.loads(Path('data/neighborhood_intelligence.json').read_text(encoding='utf-8'))
          assert cfg['seller_radar']['mode']=='DYNAMIC_WORK_COMMUNE'
          assert cfg['seller_radar']['microzone']['shape']=='SQUARE'
          assert cfg['seller_radar']['microzone']['half_side_m']==1000
          assert n['seller_radar_mode']=='DYNAMIC_WORK_COMMUNE'
          assert n['microzone_shape']=='SQUARE'
          assert n['microzone_half_side_m']==1000
          assert isinstance(n.get('commune_cache'),list) and n['commune_cache']
          assert n.get('reference_span',{}).get('endpoint_a')
          assert n.get('reference_span',{}).get('endpoint_b')
          for s in n.get('signals',[]):
              assert 'queries' in s
              if s.get('enrichment_status')=='ENRICHED':
                  assert s.get('microzone_square',{}).get('half_side_m')==1000
                  assert isinstance(s.get('streets'),list)
          print('PASS Seller Radar nightly intelligence v4')
          PY

      - name: Commit refreshed intelligence
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/neighborhood_intelligence.json data/neighborhood_seen.json data/territory_operations.json data/territory_geocache.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "f1-seller-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/neighborhood_intelligence.json data/neighborhood_seen.json data/territory_operations.json data/territory_geocache.json
          git commit -m "Refresh nightly Seller Radar intelligence"
          git fetch origin f1-territory-crm-directive
          git rebase origin/f1-territory-crm-directive
          git push origin HEAD:f1-territory-crm-directive
