name: F1 Neighborhood Intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/neighborhood-intelligence.yml'
      - 'scripts/neighborhood_intelligence.py'
      - 'scripts/territory_orchestrator.py'
      - 'scripts/territory_config.py'
      - 'config/territory.json'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: f1-neighborhood-intelligence
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build neighborhood intelligence
        env:
          F1_NEIGHBORHOOD_RADIUS: '500'
          F1_NEIGHBORHOOD_MAX_ENRICH: '12'
        run: python scripts/neighborhood_intelligence.py

      - name: Build territorial operations
        run: python scripts/territory_orchestrator.py

      - name: Validate operational outputs
        run: |
          python -m py_compile scripts/territory_config.py scripts/neighborhood_intelligence.py scripts/territory_orchestrator.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/territory.json').read_text(encoding='utf-8'))
          n=json.loads(Path('data/neighborhood_intelligence.json').read_text(encoding='utf-8'))
          out=json.loads(Path('data/territory_operations.json').read_text(encoding='utf-8'))
          hub=cfg['reference_hub']
          assert n['reference_hub'] == hub
          assert out['reference_hub'] == hub
          assert out['policy'] == cfg['policy']
          assert out['ordering'] == 'DISTANZA_LINEA_ARIA_DAL_REFERENCE_HUB'
          assert out['excluded_policy'] == 'ALL_FUORI_LISTA'
          assert out['summary']['signals_total'] >= 1
          assert out['communes']
          assert any(c.get('is_hub') and c.get('comune') == hub for c in out['communes'])
          assert all(c.get('side') in {'SINISTRA','DESTRA','CENTRO'} for c in out['communes'])
          assert not any(c.get('side') == 'FUORI_LISTA' for c in out['communes'])
          print('PASS territory architecture | hub=',hub,'| FUORI_LISTA=0')
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/neighborhood_intelligence.json data/neighborhood_seen.json data/territory_operations.json data/territory_geocache.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "f1-neighborhood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/neighborhood_intelligence.json data/neighborhood_seen.json data/territory_operations.json data/territory_geocache.json
          git commit -m "Refresh neighborhood and configured territory intelligence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
