name: F1 Neighborhood Intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/neighborhood-intelligence.yml'
      - 'scripts/neighborhood_intelligence.py'
      - 'scripts/territory_orchestrator.py'
      - 'config/territory.json'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: f1-neighborhood-intelligence
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build neighborhood intelligence
        env:
          F1_NEIGHBORHOOD_RADIUS: '500'
          F1_NEIGHBORHOOD_MAX_ENRICH: '12'
        run: python scripts/neighborhood_intelligence.py

      - name: Build territorial operations
        run: python scripts/territory_orchestrator.py

      - name: Validate operational outputs
        run: |
          python -m py_compile scripts/neighborhood_intelligence.py scripts/territory_orchestrator.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/territory.json').read_text(encoding='utf-8'))
          out=json.loads(Path('data/territory_operations.json').read_text(encoding='utf-8'))
          assert len(cfg['sinistra']) == 16
          assert len(cfg['destra']) == 24
          assert out['configured_comuni']['total'] == 40
          assert out['policy'] == 'FASCIA_CONTINUA'
          assert out['summary']['signals_total'] >= 1
          assert out['communes']
          print('PASS territorial architecture')
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/neighborhood_intelligence.json data/neighborhood_seen.json data/territory_operations.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "f1-neighborhood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/neighborhood_intelligence.json data/neighborhood_seen.json data/territory_operations.json
          git commit -m "Refresh neighborhood and territorial intelligence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
