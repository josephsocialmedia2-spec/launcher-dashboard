name: F1 Staff Onboarding QA

on:
  push:
    branches: [main]
    paths:
      - 'setup-cloud.html'
      - 'supabase-sync.js'
      - 'funzionario-notiziere.html'
      - 'primo-accesso-notiziere.html'
      - 'accessi-ufficio.html'
      - 'accessi-ufficio.js'
      - 'f1-staff-data.js'
      - 'titolare-funzionari.html'
      - 'supabase/functions/f1-staff-admin/index.ts'
      - 'tests/cloud-auth.spec.js'
      - '.github/workflows/f1-staff-onboarding-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone auth JavaScript
        run: node --check supabase-sync.js
      - name: Extract and check inline onboarding JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('setup-cloud.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit('No inline JavaScript found in setup-cloud.html')
          Path('/tmp/setup-cloud-inline.js').write_text('\n'.join(inline), encoding='utf-8')
          print('inline scripts:', len(inline))
          PY
          node --check /tmp/setup-cloud-inline.js
      - name: Verify Anastasia onboarding contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "ANASTASIA_LOGIN='anastasia@gmail.com'" setup-cloud.html
          grep -Fq 'funzionario-notiziere.html' setup-cloud.html
          grep -Fq 'Il vecchio flusso di auto-registrazione è stato disattivato' primo-accesso-notiziere.html
          grep -Fq 'action==="set_email"' supabase/functions/f1-staff-admin/index.ts
          ! grep -Fq 'LOGIN_ALIASES' supabase-sync.js
          ! grep -RFq 'joseph.socialmedia2+f1.' setup-cloud.html supabase-sync.js primo-accesso-notiziere.html tests/cloud-auth.spec.js
          echo 'F1 staff onboarding contract: PASS'
      - name: Verify irreversible access removal
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ELIMINA ACCESSO' accessi-ufficio.js
          grep -Fq 'ELIMINA ACCESSO' titolare-funzionari.html
          grep -Fq "action:'delete'" accessi-ufficio.js
          grep -Fq 'action==="delete"||action==="disable"' supabase/functions/f1-staff-admin/index.ts
          grep -Fq '.eq("status","ACTIVE")' supabase/functions/f1-staff-admin/index.ts
          grep -Fq 'status=eq.ACTIVE' f1-staff-data.js
          ! grep -Fq 'RIATTIVA' accessi-ufficio.js
          ! grep -Fq 'RIABILITA' titolare-funzionari.html
          echo 'F1 irreversible access removal: PASS'
