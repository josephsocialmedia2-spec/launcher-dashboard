name: F1 Notizie Transfer QA

on:
  workflow_dispatch:
  push:
    paths:
      - "albero-fonti-notizie.html"
      - "f1-tree-cloud.js"
      - "telefonate-oggi.html"
      - "tests/news-work-panel-removed.spec.js"
      - "tests/daily-contact-outreach.spec.js"
      - "f1-contact-outreach.js"
      - "f1-tree-network-engine.js"
      - "tests/relational-tree-redesign.spec.js"
      - "tests/editable-relationship-edges.spec.js"
      - "f1-relational-tree.css"
      - "f1-relational-tree.js"
      - ".github/workflows/f1-notizie-richiamo-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica pannello rimosso e trasferimento Notizia preservato
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          tree=Path('albero-fonti-notizie.html').read_text(encoding='utf-8')
          calls=Path('telefonate-oggi.html').read_text(encoding='utf-8')
          cloud=Path('f1-tree-cloud.js').read_text(encoding='utf-8')

          forbidden_tree=[
            'id="notizie"',
            'id="newsWorkbenchList"',
            'id="newsDueSummary"',
            'id="importNewsFile"',
            'F1 NOTIZIE · LAVORAZIONE E RICHIAMI',
            'Notizie da lavorare',
            'IMPORTA NOTIZIE JSON',
            'Nessuna notizia da lavorare',
            '100 Telefonate',
            'function renderNewsWorkbench',
            'function importNewsData',
            'function markNewsWorked',
            'function markNewsRecallDone',
            'function saveNewsNote',
            'id="networkKpis"',
            'id="metrics"',
            'id="dailyTarget"',
            'id="dailyProgress"',
            'id="todayContacts"',
            'id="journey"',
            'id="chronologyGraph"',
            'id="tree"',
            'Albero verticale delle relazioni',
            'Obiettivo giornaliero contatti',
            'Catena operativa'
          ]
          present=[x for x in forbidden_tree if x in tree]
          if present:
              raise SystemExit('FAIL pannello Notizie da lavorare ancora presente: '+', '.join(present))

          required_tree=[
            'RICERCA TERRITORIALE → FONTI DI NOTIZIE',
            "Apri la dashboard, cerca segnali territoriali e poi registra qui ogni nominativo come nodo dell'albero.",
            'onclick="openNewsDashboard()"',
            "const NEWS_TRANSFER_KEY='f1_news_transfer_queue_v1'",
            'function consumeIncomingNewsQueue',
            'function normalizeNewsItem',
            'function ensurePersonForNews',
            'id="sourceGrid"',
            'id="dailyOutreachPanel"',
            'id="dailyOutreachGrid"',
            'CONTATTI DI OGGI',
            'function applyDailyOutreachData',
            'id="relationshipTree"',
            'id="relationshipEdges"',
            'id="edgeEditorModal"',
            'ALBERO RELAZIONALE',
            'f1-relational-tree.js'
          ]
          required_calls=[
            'data-news-task',
            "newsSent?'NOTIZIA ✓':'NOTIZIA'",
            'function sendCardToNews',
            'f1_news_transfer_queue_v1'
          ]
          required_cloud=[
            'newsNextRecall:p.newsNextRecall',
            'newsInbox:(db.newsInbox||[]).slice(0,500)',
            'db.newsInbox=Array.isArray(g.newsInbox)'
          ]
          missing=[x for x in required_tree if x not in tree]
          missing += [x for x in required_calls if x not in calls]
          missing += [x for x in required_cloud if x not in cloud]
          if missing:
              raise SystemExit('FAIL funzioni Notizie da preservare mancanti: '+', '.join(missing))

          scripts=re.findall(r'<script>(.*?)</script>', tree, flags=re.S|re.I)
          Path('/tmp/albero-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          scripts2=re.findall(r'<script>(.*?)</script>', calls, flags=re.S|re.I)
          Path('/tmp/telefonate-inline.js').write_text('\n'.join(scripts2), encoding='utf-8')
          print('PASS pannello rimosso; navigazione, albero e trasferimento NOTIZIA preservati')
          PY

          node --check /tmp/albero-inline.js
          node --check /tmp/telefonate-inline.js
          node --check f1-tree-cloud.js

      - name: Verifica pagina GitHub Pages pubblicata
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            echo "Published Fonti di Notizie check $i/60"
            if curl -fsSL --max-time 20 "$base/albero-fonti-notizie.html?qa=$RANDOM" -o /tmp/albero-live               && grep -Fq 'RICERCA TERRITORIALE → FONTI DI NOTIZIE' /tmp/albero-live               && grep -Fq '>NOTIZIE</button>' /tmp/albero-live               && grep -Fq 'id="dailyOutreachPanel"' /tmp/albero-live               && grep -Fq 'CONTATTI DI OGGI' /tmp/albero-live               && grep -Fq 'id="relationshipTree"' /tmp/albero-live               && grep -Fq 'ALBERO RELAZIONALE' /tmp/albero-live               && grep -Fq 'f1-relational-tree.js' /tmp/albero-live               && grep -Fq 'id="mnemonicPanel"' /tmp/albero-live               && ! grep -Fq 'F1 NOTIZIE · LAVORAZIONE E RICHIAMI' /tmp/albero-live               && ! grep -Fq 'Notizie da lavorare' /tmp/albero-live               && ! grep -Fq 'IMPORTA NOTIZIE JSON' /tmp/albero-live               && ! grep -Fq 'Nessuna notizia da lavorare' /tmp/albero-live               && ! grep -Fq 'class="news-workbench"' /tmp/albero-live               && ! grep -Fq 'id="networkKpis"' /tmp/albero-live               && ! grep -Fq 'id="chronologyGraph"' /tmp/albero-live               && ! grep -Fq 'Albero verticale delle relazioni' /tmp/albero-live; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS pannello Notizie da lavorare assente dalla pagina pubblicata'
