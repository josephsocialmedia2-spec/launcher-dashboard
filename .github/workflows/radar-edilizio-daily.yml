name: F1 Radar Edilizio Continuous
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    branches: [ main ]
    paths:
      - 'scripts/radar_edilizio_scan.py'
      - 'scripts/radar_seed_history.py'
      - 'data/radar_sources.json'
      - 'data/radar_history_seed.json'
      - 'tests/test_radar_edilizio.py'
      - 'radar-edilizio.html'
      - 'seller-radar-unico.html'
      - 'oggi.html'
      - 'pwa.js'
      - 'sw.js'
      - '.github/workflows/radar-edilizio-daily.yml'
permissions:
  contents: write
concurrency:
  group: f1-radar-edilizio-continuous
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Seed verified history
        run: python scripts/radar_seed_history.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_radar_edilizio.py' -v
      - name: JavaScript syntax checks
        run: |
          node --check pwa.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('radar-edilizio.html','seller-radar-unico.html'):
              html=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>', html, re.S|re.I)
              assert scripts, f'inline script not found: {name}'
              out='/tmp/'+name.replace('.html','.js')
              Path(out).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/radar-edilizio.js
          node --check /tmp/seller-radar-unico.js
      - name: Public GitHub Pages smoke test
        run: |
          BASE='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          curl --fail --location --retry 5 --retry-delay 5 "$BASE/radar-edilizio.html" -o /tmp/radar.html
          grep -q 'RADAR EDILIZIO F1' /tmp/radar.html
          curl --fail --location --retry 5 --retry-delay 5 "$BASE/data/radar_edilizio.json" -o /tmp/radar.json
          python -m json.tool /tmp/radar.json >/dev/null
          curl --fail --location --retry 5 --retry-delay 5 "$BASE/oggi.html" -o /tmp/oggi.html
          grep -q 'OGGI COSA FACCIO' /tmp/oggi.html
          curl --fail --location --retry 5 --retry-delay 5 "$BASE/seller-radar-unico.html" -o /tmp/seller.html
          grep -q 'SELLER RADAR' /tmp/seller.html
      - name: Continuous scan
        run: python scripts/radar_edilizio_scan.py
      - name: Second pass deduplication test
        run: |
          cp data/radar_edilizio.json /tmp/before.json
          python scripts/radar_edilizio_scan.py
          python - <<'PY'
          import json
          a=json.load(open('/tmp/before.json'))
          b=json.load(open('data/radar_edilizio.json'))
          au=[x.get('source_url') for x in a['opportunities']]
          bu=[x.get('source_url') for x in b['opportunities']]
          assert len(bu)==len(set(bu)), 'duplicate source_url detected'
          assert len(bu) >= len(au), 'records unexpectedly removed'
          print('DEDUP PASS',len(bu))
          PY
      - name: Commit scan state/results safely
        run: |
          git config user.name 'f1-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/radar_edilizio.json data/radar_seen.json data/radar_scan_log.json || true
          git diff --cached --quiet && exit 0
          git commit -m 'Radar edilizio: aggiornamento automatico'
          git pull --rebase origin main
          git push origin main
