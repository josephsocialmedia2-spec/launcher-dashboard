name: F1 Approval Center QA

on:
  push:
    branches: [main]
    paths:
      - 'centrale-risultati.html'
      - 'centrale-risultati.js'
      - 'centrale-cloud.js'
      - 'centrale-seller-bridge.js'
      - 'seller-radar-cloud-archive.js'
      - 'seller-radar-unico.html'
      - 'sw.js'
      - 'scripts/neighborhood_intelligence_v4.py'
      - '.github/workflows/neighborhood-intelligence.yml'
      - 'supabase-migrations/20260919_f1_approval_center_cloud_v1.sql'
      - 'tests/centrale-risultati.spec.js'
      - '.github/workflows/f1-approval-center-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: npm install
      - name: JavaScript syntax
        run: |
          node --check centrale-cloud.js
          node --check centrale-risultati.js
          node --check centrale-seller-bridge.js
          node --check seller-radar-cloud-archive.js
      - name: Python syntax
        run: python -m py_compile scripts/neighborhood_intelligence_v4.py
      - name: Approval Center regression tests
        run: npx playwright test tests/centrale-risultati.spec.js
