name: QA APRI CENTRALE E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'qa/apri-centrale-e2e-20260831'
    paths:
      - '.github/workflows/qa-apri-centrale-e2e.yml'
      - 'oggi.html'
      - 'package.json'

jobs:
  apri-centrale-e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Checkout motore Centrale
        uses: actions/checkout@v4
        with:
          repository: josephsocialmedia2-spec/immobili-in-zona
          ref: main
          path: deps/immobili-in-zona

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Genera dati di prova Centrale e smoke HTTP
        shell: powershell
        run: |
          python deps/immobili-in-zona/windows_valle_susa/test_centrale_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Smoke Centrale fallito.' }

      - name: Installa server persistente e verifica restart
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File deps/immobili-in-zona/windows_valle_susa/ensure_centrale_server.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Setup server persistente fallito.' }
          $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8766/health' -TimeoutSec 3
          if ($r.StatusCode -ne 200 -or $r.Content.Trim() -ne 'OK') { throw 'Health Centrale non OK.' }

      - name: Setup Node e Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze browser
        shell: powershell
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install fallito.' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Installazione Chromium Playwright fallita.' }

      - name: Test HTTP pagina pubblica OGGI COSA FACCIO
        shell: powershell
        run: |
          $url = 'https://josephsocialmedia2-spec.github.io/launcher-dashboard/oggi.html'
          $r = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 20
          if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode) su $url" }
          if ($r.Content -notmatch 'OGGI COSA FACCIO') { throw 'Pagina pubblica inattesa.' }
          if ($r.Content -notmatch 'http://127\.0\.0\.1:8766/') { throw 'Link APRI CENTRALE non presente nella pagina pubblica.' }
          Write-Host 'PASS: pagina pubblica HTTP 200 e link Centrale presente.'

      - name: Clic reale APRI CENTRALE da GitHub Pages
        shell: powershell
        run: |
          @'
          const { chromium } = require('@playwright/test');
          (async() => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            await page.goto('https://josephsocialmedia2-spec.github.io/launcher-dashboard/oggi.html', {waitUntil:'domcontentloaded', timeout:30000});
            if (!(await page.locator('body').innerText()).includes('OGGI COSA FACCIO')) throw new Error('Titolo OGGI COSA FACCIO assente');
            const button = page.getByRole('link', {name:/APRI CENTRALE SUL PC/i});
            if (await button.count() !== 1) throw new Error(`Pulsante Centrale trovato ${await button.count()} volte`);
            await Promise.all([
              page.waitForURL('http://127.0.0.1:8766/', {timeout:15000}),
              button.click()
            ]);
            await page.waitForLoadState('domcontentloaded');
            const body = await page.locator('body').innerText();
            if (!body.includes('F1 CENTRALE TELEFONATE GUIDATE')) throw new Error('Destinazione Centrale errata');
            const response = await page.request.get('http://127.0.0.1:8766/health');
            if (response.status() !== 200 || (await response.text()).trim() !== 'OK') throw new Error('Health-check browser fallito');
            if (errors.length) throw new Error('Errori browser: ' + errors.join(' | '));
            console.log('PASS: click reale da GitHub Pages -> localhost, pagina attesa e /health OK.');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          '@ | Set-Content -Encoding UTF8 qa_apri_centrale.js
          node qa_apri_centrale.js

      - name: Restart servizio e ripeti il click reale
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File deps/immobili-in-zona/windows_valle_susa/ensure_centrale_server.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Restart verificato fallito.' }
          node qa_apri_centrale.js

      - name: Verifica task AtLogOn
        shell: powershell
        run: |
          $task = Get-ScheduledTask -TaskName 'F1 Centrale Server' -ErrorAction Stop
          if ($task.Triggers.Count -lt 1) { throw 'Task senza trigger.' }
          $xml = Export-ScheduledTask -TaskName 'F1 Centrale Server'
          if ($xml -notmatch '<LogonTrigger>') { throw 'Trigger AtLogOn non trovato.' }
          Write-Host 'PASS: autostart AtLogOn registrato.'

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Stop-ScheduledTask -TaskName 'F1 Centrale Server' -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'F1 Centrale Server' -Confirm:$false -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'f1_mobile_server\.py' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
