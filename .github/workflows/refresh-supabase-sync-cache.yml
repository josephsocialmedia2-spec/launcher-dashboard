name: Refresh Supabase Sync Cache

on:
  push:
    paths:
      - '.github/workflows/refresh-supabase-sync-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version Supabase sync script references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              n=s.replace('src="supabase-sync.js"','src="supabase-sync.js?v=20260913-auth1"')
              if n!=s:
                  p.write_text(n,encoding='utf-8')
                  changed.append(str(p))
          print('UPDATED', *changed, sep='\n')
          if not changed:
              raise SystemExit('No unversioned supabase-sync.js references found')
          PY
          grep -q 'supabase-sync.js?v=20260913-auth1' crm.html
      - name: Commit cache refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Refresh Supabase auth script cache'
          git push
