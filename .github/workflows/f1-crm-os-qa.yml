name: F1 CRM OS QA

on:
  push:
    paths:
      - 'f1-crm-os.html'
      - 'f1-crm-os.js'
      - 'config/crm-os.json'
      - 'tests/crm-os.spec.js'
      - 'supabase-migrations/20260913_f1_crm_os_contact_roles.sql'
      - '.github/workflows/f1-crm-os-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static CRM OS contract
        shell: bash
        run: |
          set -euo pipefail
          node --check f1-crm-os.js
          node --check tests/crm-os.spec.js
          node -e "JSON.parse(require('fs').readFileSync('config/crm-os.json','utf8'))"
          grep -q 'F1 CRM OS' f1-crm-os.html
          grep -q 'AGENDA OPERATIVA' f1-crm-os.html
          grep -q 'SCHEDA CONTATTO 360' f1-crm-os.js
          grep -q 'POSSIBILE DUPLICATO' f1-crm-os.js
          grep -q 'newContactProfile' config/crm-os.json
          grep -q 'f1_contact_roles' supabase-migrations/20260913_f1_crm_os_contact_roles.sql
          ! grep -q 'service_role' f1-crm-os.html
          ! grep -q 'service_role' f1-crm-os.js
          ! grep -q 'localStorage' f1-crm-os.html
          ! grep -q 'localStorage' f1-crm-os.js
          test -f crm.html
          test -f oggi.html
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: CRM OS desktop QA
        run: npx playwright test tests/crm-os.spec.js --project=desktop-chromium
      - name: CRM OS mobile QA
        run: npx playwright test tests/crm-os.spec.js --project=mobile-chromium
      - name: Existing unified CRM regression
        run: npx playwright test tests/unified-crm.spec.js --project=desktop-chromium
      - name: Published GitHub Pages smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/f1-crm-os.html?qa=$RANDOM" -o /tmp/os.html \
              && curl -fsSL --max-time 20 "$base/f1-crm-os.js?qa=$RANDOM" -o /tmp/os.js \
              && curl -fsSL --max-time 20 "$base/config/crm-os.json?qa=$RANDOM" -o /tmp/os.json \
              && curl -fsSL --max-time 20 "$base/crm.html?qa=$RANDOM" -o /tmp/crm.html \
              && curl -fsSL --max-time 20 "$base/oggi.html?qa=$RANDOM" -o /tmp/oggi.html \
              && grep -qi 'Postazione Operativa' /tmp/os.html \
              && grep -q 'POSSIBILE DUPLICATO' /tmp/os.js \
              && grep -q 'newContactProfile' /tmp/os.json \
              && grep -q 'CRM UNIFICATO' /tmp/crm.html \
              && grep -q 'OGGI' /tmp/oggi.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://josephsocialmedia2-spec.github.io/launcher-dashboard';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[];
            const badResponses=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            page.on('response',r=>{
              if(r.url().startsWith(base) && r.status()>=400) badResponses.push(`${r.status()} ${r.url()}`);
            });
            for (const path of ['f1-crm-os.html','crm.html','oggi.html']) {
              const response=await page.goto(`${base}/${path}?qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response || response.status()>=400) throw new Error(`HTTP ${response?.status()} on ${path}`);
              await page.waitForTimeout(1200);
              if(path==='f1-crm-os.html' && !/f1-crm-os\.html|setup-cloud\.html/.test(page.url())) throw new Error(`Unexpected CRM OS navigation: ${page.url()}`);
              await page.reload({waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(500);
            }
            if(badResponses.length) throw new Error('Published asset errors: '+badResponses.join(' | '));
            if(pageErrors.length) throw new Error('Blocking browser errors: '+pageErrors.join(' | '));
            await browser.close();
            console.log('PASS published browser smoke: pages load, direct refresh works, no blocking page errors/4xx assets');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo 'PASS F1 CRM OS published with classic CRM fallback'
