name: F1 Microzone Directory QA

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-bridge/f1_microzone_directory.py"
      - "windows-bridge/INSTALLA_MOTORE_MICROZONA.bat"
      - ".github/workflows/f1-microzone-directory-qa.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile windows-bridge/f1_microzone_directory.py
