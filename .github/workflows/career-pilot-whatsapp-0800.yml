name: CareerPilot WhatsApp 08:00

on:
  workflow_dispatch:
  schedule:
    # GitHub cron usa UTC. Le due finestre coprono ora legale/solare italiana.
    # Il gate esegue davvero l'invio solo quando a Roma sono le 08:00.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: career-pilot-whatsapp-0800
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verifica orario italiano
        id: time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Rome date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Notifica CareerPilot autorizzata."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Trigger UTC di compensazione ignorato: a Roma non sono le 08:00."
          fi

      - uses: actions/checkout@v4
        if: steps.time_gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.time_gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: career-pilot/requirements.txt

      - name: Installa dipendenze
        if: steps.time_gate.outputs.run == 'true'
        run: pip install -r career-pilot/requirements.txt

      - name: Invia report WhatsApp delle 08:00
        if: steps.time_gate.outputs.run == 'true'
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_GRAPH_VERSION: ${{ secrets.WA_GRAPH_VERSION }}
        run: python career-pilot/engine/notify_digest.py

      - name: Registra notifica inviata
        if: steps.time_gate.outputs.run == 'true' && success()
        run: |
          git config user.name "CareerPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add career-pilot/data/jobs.json career-pilot/data/notification_state.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento da registrare"
          else
            git commit -m "CareerPilot: registra notifica WhatsApp 08:00"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
