name: Acquisitore Pro v25 QA

on:
  push:
    branches: ['release/acquisitore-pro-v25-final']
    paths-ignore:
      - 'qa-results-v25/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run v25 regression and capture JSON
        shell: bash
        run: |
          mkdir -p qa-results-v25
          set +e
          npx playwright test tests/acquisitore-pro-v25.spec.js --config=playwright.v25.config.js --reporter=json > qa-results-v25/report.json
          code=$?
          echo "$code" > qa-results-v25/exit-code.txt
          exit 0
      - name: Summarize failures
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync('qa-results-v25/report.json','utf8')); } catch {}
          const failures = [];
          let passed = 0, failed = 0, skipped = 0;
          function walkSuite(s) {
            for (const spec of s.specs || []) {
              for (const t of spec.tests || []) {
                for (const r of t.results || []) {
                  if (r.status === 'passed') passed++;
                  else if (r.status === 'skipped') skipped++;
                  else if (r.status) {
                    failed++;
                    failures.push({title:[...(s.titlePath||[]),spec.title].filter(Boolean).join(' > '),project:t.projectName||'',status:r.status,error:(r.errors?.[0]?.message||r.error?.message||'').slice(0,2400)});
                  }
                }
              }
            }
            for (const child of s.suites || []) walkSuite(child);
          }
          for (const s of report.suites || []) walkSuite(s);
          const exitCode = Number((fs.existsSync('qa-results-v25/exit-code.txt') ? fs.readFileSync('qa-results-v25/exit-code.txt','utf8') : '99').trim());
          fs.writeFileSync('qa-results-v25/summary.json',JSON.stringify({generatedAt:new Date().toISOString(),exitCode,passed,failed,skipped,stats:report.stats||null,failures},null,2));
          NODE
      - name: Commit QA results to release branch
        if: always()
        shell: bash
        run: |
          git config user.name "acquisitore-pro-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- qa-results-v25/report.json qa-results-v25/summary.json qa-results-v25/exit-code.txt
          if ! git diff --cached --quiet; then
            git commit -m "qa: store Acquisitore Pro v25 regression results"
            git push origin HEAD:release/acquisitore-pro-v25-final
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisitore-pro-v25-playwright
          path: |
            qa-results-v25/
            test-results/
          if-no-files-found: ignore
      - name: Set workflow result
        if: always()
        shell: bash
        run: exit "$(cat qa-results-v25/exit-code.txt 2>/dev/null || echo 1)"
