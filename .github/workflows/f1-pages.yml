name: Deploy F1 Immobiliare to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout F1 main
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload F1 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy F1 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
