name: F1 Google Dork Companion QA
on:
  push:
    branches:
      - main
      - 'perf/**'
    paths:
      - 'market-interest-core.js'
      - 'market-interest-engine.js'
      - 'market-listing-ui.js'
      - 'f1-acquisition-data.js'
      - 'crm-unified-app.js'
      - 'crm.html'
      - 'chrome-companion/**'
      - 'supabase-migrations/20260914_f1_google_dork_research_engine.sql'
      - '.github/workflows/f1-google-dork-companion-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check market-interest-core.js
          node --check market-interest-engine.js
          node --check market-listing-ui.js
          node --check f1-acquisition-data.js
          node --check crm-unified-app.js
          node --check chrome-companion/service-worker.js
          node --check chrome-companion/f1-session-bridge.js
          node -e "JSON.parse(require('fs').readFileSync('chrome-companion/manifest.json','utf8')); console.log('manifest OK')"
      - name: Dynamic Google Dork contract
        run: |
          node - <<'NODE'
          const assert=require('assert'),C=require('./market-interest-core.js');
          const seed={advertiser_name:'Mario Rossi',street:'Via Test',street_number:'12',municipality:'Comune Prova',reference_code:'REF-7788',external_listing_id:'998877',property_type_normalized:'Trilocale'};
          const q=C.buildQueries(seed,{maxQueries:28});
          const text=q.map(x=>x.query).join('\n');
          assert(q.length>10 && q.length<=28);
          assert(text.includes('"Mario Rossi" immobiliare'));
          assert(text.includes('"Mario Rossi" "Comune Prova"'));
          assert(text.includes('"Via Test 12" "Comune Prova"'));
          assert(text.includes('"REF-7788"'));
          assert(text.includes('site:immobiliare.it "Via Test" "Comune Prova"'));
          assert(text.includes('site:linkedin.com'));
          assert(text.includes('"Via Test" "Comune Prova" geometra'));
          const cascade=C.buildAgencyQueries(seed,'Agenzia Test','agenziatest.it').map(x=>x.query).join('\n');
          assert(cascade.includes('"Agenzia Test" "Comune Prova"'));
          assert(cascade.includes('site:agenziatest.it "Mario Rossi"'));
          assert.equal(C.normalizePhone('+39 333 123 4567'),'3331234567');
          assert.equal(C.canonicalUrl('https://example.it/x?utm_source=a#z'),'https://example.it/x');
          console.log('dork contract OK');
          NODE
          ! grep -Ei 'Fabio Panero|Villar Dora|Borgata Cordonatto' market-interest-core.js chrome-companion/service-worker.js
      - name: Research performance contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('market-listing-ui.js').read_text()
          eng=Path('market-interest-engine.js').read_text()
          data=Path('f1-acquisition-data.js').read_text()
          crm=Path('crm-unified-app.js').read_text()
          install=ui.split('function install(){',1)[1].split("window.F1MarketSignalNormalizer",1)[0]
          assert 'loadResearch()' not in install, 'Research engine still starts from CRM boot'
          assert 'setInterval(load,15000)' not in eng, 'Massive 15s polling still present'
          assert 'new MutationObserver' not in eng, 'Global Research MutationObserver still present'
          assert 'pullLeads()' not in eng, 'Research engine still downloads all leads'
          assert "list.addEventListener('click',delegatedClick)" in ui, 'MI INTERESSA is not event delegated'
          assert "research_jobs?id=eq." in eng, 'Research polling is not job-targeted'
          assert 'async function pullLead(leadId)' in data, 'Targeted lead fetch missing'
          update=data.split('async function updateLead(leadId,patch)',1)[1].split('function localInteractions',1)[0]
          assert "method:'PATCH'" in update and 'pullLeads()' not in update and 'pullLead(' not in update, 'updateLead is not a single-record PATCH'
          assert 'async function pullInteractionsForLead(leadId' in data, 'Lead interaction lazy loader missing'
          assert 'applyUpdatedLead' in crm, 'Targeted CRM card update missing'
          assert "f1-crm-rendered" in crm, 'Explicit CRM render event missing'
          assert 'DOSSIER_LOAD_START' in eng, 'Dossier timing/lazy instrumentation missing'
          print('research performance contract OK')
          PY
      - name: Supabase queue contract
        run: |
          MIG='supabase-migrations/20260914_f1_google_dork_research_engine.sql'
          grep -q 'create table if not exists public.research_jobs' "$MIG"
          grep -q 'create table if not exists public.research_results' "$MIG"
          grep -q 'create table if not exists public.research_entities' "$MIG"
          grep -q 'GOOGLE_VERIFICATION_REQUIRED' "$MIG"
          grep -q 'enable row level security' "$MIG"
          grep -q 'auth.uid()' "$MIG"
      - name: CRM MI INTERESSA contract
        run: |
          grep -q 'market-interest-core.js?v=20260915-research2' market-listing-ui.js
          grep -q 'market-interest-engine.js?v=20260915-research3' market-listing-ui.js
          grep -q '★ MI INTERESSA' market-listing-ui.js
          grep -q '★ RICERCA IN CORSO' market-interest-engine.js
          grep -q '★ DOSSIER PRONTO' market-interest-engine.js
          grep -q '★ VERIFICA RICHIESTA' market-interest-engine.js
          grep -q 'ESPORTA RICERCA CSV' market-interest-engine.js
          grep -q "priority:'P1'" market-interest-engine.js
          grep -q 'research_jobs' market-interest-engine.js
          grep -q 'research_results' market-interest-engine.js
          grep -q 'research_entities' market-interest-engine.js
          grep -q 'market-listing-ui.js?v=20260915-market6' crm.html
      - name: Chrome Companion contract
        run: |
          grep -q '"manifest_version": 3' chrome-companion/manifest.json
          grep -q 'service-worker.js' chrome-companion/manifest.json
          grep -q "active:false" chrome-companion/service-worker.js
          grep -q 'GOOGLE_VERIFICATION_REQUIRED' chrome-companion/service-worker.js
          grep -q 'research_results' chrome-companion/service-worker.js
          grep -q 'research_entities' chrome-companion/service-worker.js
          grep -q 'completed_queries' chrome-companion/service-worker.js
          grep -q 'classification.*COMPETITOR_LISTING' chrome-companion/service-worker.js
          ! grep -Ei 'serpapi|brave[ _-]?search|customsearch|googleapis\.com/customsearch' market-interest-core.js market-interest-engine.js chrome-companion/service-worker.js
      - name: Published Pages smoke
        if: github.ref == 'refs/heads/main'
        run: |
          ok=0
          for i in $(seq 1 60); do
            CRM=$(curl -fsSL 'https://josephsocialmedia2-spec.github.io/launcher-dashboard/crm.html?phase2=1' || true)
            UI=$(curl -fsSL 'https://josephsocialmedia2-spec.github.io/launcher-dashboard/market-listing-ui.js?phase2=1' || true)
            CORE=$(curl -fsSL 'https://josephsocialmedia2-spec.github.io/launcher-dashboard/market-interest-core.js?phase2=1' || true)
            ENG=$(curl -fsSL 'https://josephsocialmedia2-spec.github.io/launcher-dashboard/market-interest-engine.js?phase2=1' || true)
            MAN=$(curl -fsSL 'https://josephsocialmedia2-spec.github.io/launcher-dashboard/chrome-companion/manifest.json?phase2=1' || true)
            if echo "$CRM" | grep -q 'market-listing-ui.js?v=20260915-market6' && echo "$UI" | grep -q '20260915-market6' && echo "$CORE" | grep -q 'F1MarketInterestCore' && echo "$ENG" | grep -q '20260915-research3' && echo "$MAN" | grep -q 'F1 Chrome Companion'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
