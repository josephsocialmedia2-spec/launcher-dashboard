name: F1 Relationship Engine QA

on:
  push:
    paths:
      - 'index.html'
      - 'clienti-passati-coi.html'
      - 'clienti-passati-coi.js'
      - 'clienti-passati-coi-referrals.js'
      - 'tests/relationship-engine.spec.js'
      - '.github/workflows/f1-relationship-engine-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static relationship engine validation
        shell: bash
        run: |
          set -euo pipefail
          node --check clienti-passati-coi.js
          node --check clienti-passati-coi-referrals.js
          node --check tests/relationship-engine.spec.js
          grep -q 'clienti-passati-coi.html' index.html
          grep -q 'CLIENTI PASSATI + CENTRO DI INFLUENZA' clienti-passati-coi.html
          grep -q 'CONTATTI DA FARE OGGI' clienti-passati-coi.html
          grep -q 'CONTATTI OGGI' clienti-passati-coi.html
          grep -q 'SEGNALAZIONE — CLIENTE PASSATO / CENTRO DI INFLUENZA' clienti-passati-coi-referrals.js
          grep -q 'PAST_CLIENT_COI_DAILY' clienti-passati-coi.js
          grep -q 'NON_CONTATTARE' clienti-passati-coi.js
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Full Lead Interaction Task Referral dedupe QA
        run: npx playwright test tests/relationship-engine.spec.js --project=desktop-chromium
      - name: Live GitHub Pages smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/index.html?qa=$RANDOM" -o /tmp/index.html \
              && curl -fsSL --max-time 20 "$base/clienti-passati-coi.html?qa=$RANDOM" -o /tmp/rel.html \
              && curl -fsSL --max-time 20 "$base/clienti-passati-coi.js?qa=$RANDOM" -o /tmp/rel.js \
              && curl -fsSL --max-time 20 "$base/clienti-passati-coi-referrals.js?qa=$RANDOM" -o /tmp/ref.js \
              && grep -q 'clienti-passati-coi.html' /tmp/index.html \
              && grep -q 'CONTATTI DA FARE OGGI' /tmp/rel.html \
              && grep -q 'PAST_CLIENT_COI_DAILY' /tmp/rel.js \
              && grep -q 'CENTRO DI INFLUENZA' /tmp/ref.js; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS relationship engine deployed'
