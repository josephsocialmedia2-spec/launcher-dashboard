          ls -lh assets/f1-marketing-magazine
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/f1-marketing-magazine
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "assets: add F1 marketing magazine graphics"
          git push
