name: F1 Network 250 QA
on:
  push:
    paths:
      - 'index.html'
      - 'network-reconstruction.html'
      - 'network-reconstruction.js'
      - 'network-reconstruction-widget.js'
      - 'network-250-sources.js'
      - 'network-250-data-*.js'
      - 'tests/network-reconstruction.spec.js'
      - '.github/workflows/f1-network-250-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Network 250 contract
        run: |
          set -ex
          node --check network-250-sources.js
          for f in network-250-data-*.js; do node --check "$f"; done
          node --check network-reconstruction.js
          node --check network-reconstruction-widget.js
          node --check tests/network-reconstruction.spec.js
          node - <<'NODE'
          global.window={};
          require('./network-250-sources.js');
          const rows=window.F1_NETWORK_250;
          if(!Array.isArray(rows)||rows.length!==250) throw new Error('Catalogo Network 250 incompleto');
          const ids=new Set(rows.map(x=>x.id));
          if(ids.size!==250||Math.min(...ids)!==1||Math.max(...ids)!==250) throw new Error('ID fonti non validi');
          const byId=id=>rows.find(x=>x.id===id);
          if(byId(1)?.check!=='Tutti i contatti salvati, inclusi quelli senza cognome') throw new Error('Dettaglio fonte 1 non canonico');
          if(byId(120)?.check!=='Solo contatti professionali non sensibili') throw new Error('Cautela fonte 120 assente');
          if(byId(195)?.name!=="Centri per l'impiego") throw new Error('Fonte 195 non canonica');
          if(byId(238)?.check!=='Solo ricordo relazionale, senza annotare dati sensibili') throw new Error('Cautela fonte 238 assente');
          if(byId(250)?.people!=='Espansione sistematica della sfera') throw new Error('Dettaglio fonte 250 non canonico');
          if(rows.some(x=>!x.name||!x.check||!x.people||!x.macro)) throw new Error('Una o più fonti non hanno tutti i campi operativi');
          NODE
          grep -q 'id="network250Widget"' index.html
          grep -q 'RICOSTRUZIONE RETE 250' index.html
          grep -q 'network-reconstruction-widget.js' index.html
          grep -q 'AVVIA RICOSTRUZIONE RETE' network-reconstruction.html
          grep -q 'DA CONTROLLARE' network-reconstruction.html
          grep -q 'NON DISPONIBILE' network-reconstruction.html
          grep -q 'POTENZIALE VENDITORE' network-reconstruction.html
          grep -q 'CONTATTO DA RIATTIVARE' network-reconstruction.html
          grep -q 'network_contacts' network-reconstruction.js
          grep -q 'network_contact_sources' network-reconstruction.js
          grep -q 'network_source_progress' network-reconstruction.js
          grep -q 'network_reconstruction_state' network-reconstruction.js
          grep -q 'duplicateOf' network-reconstruction.js
          ! grep -q 'localStorage' network-reconstruction.js
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Network 250 E2E
        run: npx playwright test tests/network-reconstruction.spec.js --project=desktop-chromium
      - name: Existing dashboard regressions
        run: npx playwright test tests/program-90-goals-reset.spec.js tests/market-preview.spec.js --project=desktop-chromium
      - name: Published GitHub Pages smoke
        run: |
          set -e
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          deployed=0
          for i in $(seq 1 72); do
            if curl -fsSL "$base/index.html?qa=$RANDOM" -o /tmp/index \
              && curl -fsSL "$base/network-reconstruction.html?qa=$RANDOM" -o /tmp/net \
              && curl -fsSL "$base/network-reconstruction.js?qa=$RANDOM" -o /tmp/netjs \
              && curl -fsSL "$base/network-250-sources.js?qa=$RANDOM" -o /tmp/sources \
              && curl -fsSL "$base/network-250-data-1.js?qa=$RANDOM" -o /tmp/data1 \
              && curl -fsSL "$base/network-250-data-5.js?qa=$RANDOM" -o /tmp/data5 \
              && curl -fsSL "$base/network-250-data-8.js?qa=$RANDOM" -o /tmp/data8 \
              && curl -fsSL "$base/network-250-data-10.js?qa=$RANDOM" -o /tmp/data10 \
              && curl -fsSL "$base/network-reconstruction-widget.js?qa=$RANDOM" -o /tmp/widget \
              && grep -q 'id="network250Widget"' /tmp/index \
              && grep -q 'AVVIA RICOSTRUZIONE RETE' /tmp/net \
              && grep -q 'network_contacts' /tmp/netjs \
              && grep -q 'Catalogo Network 250 specifico incompleto' /tmp/sources \
              && grep -q 'Tutti i contatti salvati, inclusi quelli senza cognome' /tmp/data1 \
              && grep -q 'Solo contatti professionali non sensibili' /tmp/data5 \
              && grep -q "Centri per l'impiego" /tmp/data8 \
              && grep -q 'Solo ricordo relazionale, senza annotare dati sensibili' /tmp/data10 \
              && grep -q 'Espansione sistematica della sfera' /tmp/data10 \
              && grep -q 'netSourcesDone' /tmp/widget; then
              deployed=1
              break
            fi
            sleep 5
          done
          test "$deployed" = 1
          echo 'PASS Network 250 canonical detailed catalog published'
