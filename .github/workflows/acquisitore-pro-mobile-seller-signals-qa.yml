name: Acquisitore Pro Mobile Seller Signal QA

on:
  push:
    branches: [ acquisitore-pro-v26-operatore-zona ]
    paths:
      - 'acquisitore-pro-mobile/**'
      - 'tests/acquisitore-pro-mobile-seller-signals-local.spec.js'
      - 'tests/acquisitore-pro-mobile-susa-10km.spec.js'
      - '.github/workflows/acquisitore-pro-mobile-seller-signals-qa.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test Vai in Zona Seller Signal + perimetro Susa 10 km desktop and Pixel 7
        run: npx playwright test tests/acquisitore-pro-mobile-seller-signals-local.spec.js tests/acquisitore-pro-mobile-susa-10km.spec.js --config=playwright.v25.config.js --reporter=line
