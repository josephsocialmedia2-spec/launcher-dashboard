name: UGC Avatar HF Logs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ugc-avatar-hf-logs.yml'
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Hugging Face client
        run: pip install "huggingface_hub>=1.0,<2"
      - name: Fetch Space runtime and logs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id="realmediajo/ugc-avatar-studio"
          api=HfApi(token=os.environ["HF_TOKEN"])

          runtime=api.get_space_runtime(repo_id)
          print("=== RUNTIME ===")
          print("stage:", getattr(runtime,"stage",None))
          print("hardware:", getattr(runtime,"hardware",None))
          print("requested_hardware:", getattr(runtime,"requested_hardware",None))
          print("raw:", getattr(runtime,"raw",None))

          print("=== BUILD LOGS ===")
          try:
              for line in api.fetch_space_logs(repo_id=repo_id, build=True, follow=False):
                  print(line, end="" if str(line).endswith("\n") else "\n")
          except Exception as exc:
              print("BUILD_LOG_ERROR",repr(exc))

          print("=== RUN LOGS ===")
          try:
              for line in api.fetch_space_logs(repo_id=repo_id, build=False, follow=False):
                  print(line, end="" if str(line).endswith("\n") else "\n")
          except Exception as exc:
              print("RUN_LOG_ERROR",repr(exc))
          PY
