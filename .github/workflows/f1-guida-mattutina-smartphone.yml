name: F1 Guida Mattutina Smartphone

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/f1-guida-mattutina-smartphone.yml"
  schedule:
    # 08:00 Europe/Rome: due slot UTC, il gate sceglie quello corretto con CET/CEST.
    - cron: "0 6,7 * * *"

permissions:
  contents: read
  issues: write

jobs:
  guida-mattino:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate 08:00 ora italiana
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Rome date +%H)
          if [ "$HOUR" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Invia promemoria su GitHub Mobile
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DATA=$(TZ=Europe/Rome date '+%d/%m/%Y')
          cat > /tmp/morning.md <<EOF
          ## F1 — cosa faccio oggi — $DATA

          Apri dal telefono: **https://josephsocialmedia2-spec.github.io/launcher-dashboard/oggi.html**

          1. **Calendar** — controlla appuntamenti e richiami già fissati.
          2. **Giro Acquisizione** — mentre sei fuori usa questa sola schermata: https://josephsocialmedia2-spec.github.io/launcher-dashboard/giro-acquisizione.html
             - mappa, immobile/segnale, fonte e motivo;
             - premi ARRIVATO / TROVATO / NON TROVATO / CARTELLO / FOTO / VOLANTINO.
          3. **Al rientro: Telefonate di oggi** — numeri collegati alle vie lavorate, motivo della chiamata e apertura suggerita: https://josephsocialmedia2-spec.github.io/launcher-dashboard/telefonate-oggi.html
          4. **Brief** — solo se hai un appuntamento: https://josephsocialmedia2-spec.github.io/immobili-in-zona/seller_radar_auto/appointment_brief.html

          **Non devi aprire Radar, Seller o CRM:** lavorano dietro le quinte.
          EOF
          gh issue comment 18 --repo josephsocialmedia2-spec/launcher-dashboard --body-file /tmp/morning.md
