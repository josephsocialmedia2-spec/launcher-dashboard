name: F1 Guided Workspace Integrator
on:
  push:
    paths:
      - 'f1-guided-workspace.js'
      - 'f1-territory-guard.js'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate guided workspace source
        run: |
          node --check f1-guided-workspace.js
          node --check f1-ai-guide.js
          node --check f1-operational-procedures.js
          if [ -f f1-territory-guard.js ]; then node --check f1-territory-guard.js; fi
          test -f f1-guided-workspace.css
          grep -q 'AVVIA E APRI' f1-guided-workspace.js
          grep -q 'MODALITÀ GUIDATA' f1-guided-workspace.js
          grep -q 'ORDINE OPERATIVO' f1-ai-guide.js
          grep -q 'PRIMI 30 GIORNI' f1-operational-procedures.js
      - name: Verify territorial guard
        if: ${{ hashFiles('f1-territory-guard.js') != '' }}
        run: |
          node - <<'NODE'
          global.window=global;
          const profile={role:'FUNZIONARIO',assigned_territory:{comune:'Villar Dora'}};
          const leads=[
            {lead_id:'collegno',comune:'Collegno',via:'Via Torino 47'},
            {lead_id:'villar',comune:'Villar Dora',via:'Via Roma 1'}
          ];
          window.F1StaffData={
            ready:()=>true,
            me:async()=>profile,
            tasks:async()=>[
              {task_id:'t1',lead_id:'collegno',status:'OPEN'},
              {task_id:'t2',lead_id:'villar',status:'OPEN'},
              {task_id:'t3',lead_id:'collegno',status:'OPEN',territory_override:true}
            ],
            ownLeads:async()=>leads,
            news:async()=>[],
            rest:async()=>[]
          };
          require('./f1-territory-guard.js');
          (async()=>{
            const filteredLeads=await F1StaffData.ownLeads('u',500);
            if(filteredLeads.length!==1||filteredLeads[0].comune!=='Villar Dora')throw new Error('Filtro lead territorio non applicato');
            const filteredTasks=await F1StaffData.tasks('u');
            const ids=filteredTasks.map(x=>x.task_id);
            if(ids.includes('t1'))throw new Error('Task Collegno non filtrato');
            if(!ids.includes('t2'))throw new Error('Task Villar Dora rimosso');
            if(!ids.includes('t3'))throw new Error('Override territoriale esplicito non rispettato');
            console.log('territory-guard OK',ids.join(','));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Integrate guide5 into dashboard and regression QA
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          h=index.read_text()
          h=h.replace('f1-guided-workspace.css?v=20260914-guide4','f1-guided-workspace.css?v=20260914-guide5')
          h=h.replace('f1-guided-workspace.css?v=20260914-guide3','f1-guided-workspace.css?v=20260914-guide5')
          h=h.replace('f1-ai-guide.js?v=20260914-guide2','f1-ai-guide.js?v=20260914-guide5')
          h=h.replace('f1-guided-workspace.js?v=20260914-guide4','f1-guided-workspace.js?v=20260914-guide5')
          h=h.replace('f1-guided-workspace.js?v=20260914-guide3','f1-guided-workspace.js?v=20260914-guide5')
          proc='<script src="f1-operational-procedures.js?v=20260914-docops1"></script>'
          guide='<script src="f1-ai-guide.js?v=20260914-guide5"></script>'
          if proc not in h:
              h=h.replace(guide,proc+'\n'+guide)
          guard='<script src="f1-territory-guard.js?v=20260914-territory1"></script>'
          staff='<script src="f1-staff-data.js?v=20260914-staff"></script>'
          if Path('f1-territory-guard.js').exists() and guard not in h:
              h=h.replace(staff,staff+'\n'+guard)
          index.write_text(h)

          spec=Path('tests/daily-command-panel.spec.js')
          s=spec.read_text()
          old="for(const id of ['#f1AiWhere','#f1AiWho','#f1AiObjective','#f1AiDuration','#f1AiCompletion','#f1AiNext'])await expect(page.locator(id)).not.toHaveText('—');"
          new="for(const id of ['#f1AiWhere','#f1AiWho','#f1AiZone','#f1AiExecute','#f1AiRegister','#f1AiObjective','#f1AiDuration','#f1AiCompletion','#f1AiNext'])await expect(page.locator(id)).not.toHaveText('—');"
          s=s.replace(old,new)
          if "ordine operativo espone APRI CERCA ZONA ESEGUI REGISTRA" not in s:
              marker="  test('nuovo funzionario apre il modulo senza perdere la guida'"
              block="""  test('ordine operativo espone APRI CERCA ZONA ESEGUI REGISTRA',async({browser})=>{\n    const context=await browser.newContext({timezoneId:'Europe/Rome',viewport:{width:1440,height:1000}});const page=await context.newPage();await openAt(page,'2026-09-13T09:40:00+02:00');\n    await expect(page.locator('#f1AIGuide')).toContainText('ORDINE OPERATIVO');\n    for(const text of ['APRI','CERCA','ZONA','ESEGUI','REGISTRA','TERMINA QUANDO'])await expect(page.locator('#f1AIGuide')).toContainText(text);\n    await expect(page.locator('#f1AiNext')).toContainText(/PROSSIMO ORDINE|NON PASSARE/);await context.close();\n  });\n\n"""
              s=s.replace(marker,block+marker)
          spec.write_text(s)
          PY
          node --check tests/daily-command-panel.spec.js
          grep -q 'f1-operational-procedures.js?v=20260914-docops1' index.html
          grep -q 'f1-ai-guide.js?v=20260914-guide5' index.html
          grep -q 'f1-guided-workspace.css?v=20260914-guide5' index.html
          grep -q 'f1-guided-workspace.js?v=20260914-guide5' index.html
          if [ -f f1-territory-guard.js ]; then grep -q 'f1-territory-guard.js?v=20260914-territory1' index.html; fi
          grep -q 'nuovo funzionario apre il modulo senza perdere la guida' tests/daily-command-panel.spec.js
      - name: Commit dashboard integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/daily-command-panel.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate F1 guide territorial guard'
          git push origin HEAD:main
