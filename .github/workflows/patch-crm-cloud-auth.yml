name: Patch canonical CRM cloud auth

on:
  push:
    paths:
      - '.github/workflows/patch-crm-cloud-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CRM authentication contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cfg=Path('supabase-config.js')
          s=cfg.read_text(encoding='utf-8')
          old="""window.F1_SUPABASE = {\n  url: localStorage.getItem('f1SupabaseUrl') || 'https://nqnmlsmeiynxbdojeyjt.supabase.co',\n  anonKey: localStorage.getItem('f1SupabaseAnonKey') || 'sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu',\n  table: 'contacts',\n  visitsTable: 'field_visits'\n};"""
          new="""window.F1_SUPABASE = {\n  // Backend canonico del CRM UNIFICATO. Non è sovrascrivibile da vecchi valori browser.\n  url: 'https://nqnmlsmeiynxbdojeyjt.supabase.co',\n  anonKey: 'sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu',\n  table: 'contacts',\n  visitsTable: 'field_visits'\n};"""
          if old not in s: raise SystemExit('supabase-config canonical block not found')
          cfg.write_text(s.replace(old,new,1),encoding='utf-8')

          data=Path('f1-acquisition-data.js')
          s=data.read_text(encoding='utf-8')
          old="""async function rest(path,opt={}){const url=CFG().url.replace(/\\/$/,'')+'/rest/v1/'+path,res=await fetch(url,{...opt,headers:{...(await headers(opt.prefer)),...(opt.headers||{})}});if(!res.ok)throw new Error(`Supabase ${res.status}: ${await res.text()}`);const text=await res.text();return text?JSON.parse(text):null}"""
          new="""async function rest(path,opt={}){const url=CFG().url.replace(/\\/$/,'')+'/rest/v1/'+path,res=await fetch(url,{...opt,headers:{...(await headers(opt.prefer)),...(opt.headers||{})}});if(res.status===401){window.F1Sync?.clearSession?.();const e=new Error('ACCESSO CRM RICHIESTO');e.code='AUTH_REQUIRED';throw e}if(res.status===403)throw new Error('ACCESSO SUPABASE NEGATO: verifica permessi RLS');if(!res.ok)throw new Error(`Supabase ${res.status}: ${await res.text()}`);const text=await res.text();return text?JSON.parse(text):null}"""
          if old not in s: raise SystemExit('f1-acquisition-data rest block not found')
          data.write_text(s.replace(old,new,1),encoding='utf-8')

          crm=Path('crm.html')
          s=crm.read_text(encoding='utf-8')
          s=s.replace('href="setup-cloud.html">ACCESSO</a>','href="setup-cloud.html?return=crm.html">ACCESSO</a>')
          s=s.replace('<b>CRM unico:</b> Supabase è la source of truth per Lead, Interazioni e Task. localStorage è solo cache di lettura/offline e non accetta nuovi record CRM. Eventuali vecchi contatti browser vengono migrati nel CRM unificato solo dopo autenticazione e verifica.','<b>CRM unico:</b> Supabase è l’unica source of truth per Lead, Interazioni e Task. Il browser non viene utilizzato come CRM alternativo. Le funzioni operative sono disponibili esclusivamente con sessione cloud verificata.')
          old='<script src="supabase-config.js"></script><script src="supabase-sync.js?v=20260913-auth1"></script><script src="f1-acquisition-core.js"></script><script src="f1-acquisition-data.js?v=20260913-1147"></script><script src="crm-unified-app.js"></script>'
          new='<script src="supabase-config.js?v=20260913-auth2"></script><script src="supabase-sync.js?v=20260913-auth2"></script><script src="f1-acquisition-core.js"></script><script src="f1-acquisition-data.js?v=20260913-auth2"></script><script src="crm-auth-guard.js?v=20260913-auth2"></script><script src="crm-unified-app.js?v=20260913-auth2"></script>'
          if old not in s: raise SystemExit('crm script chain not found')
          crm.write_text(s.replace(old,new,1),encoding='utf-8')

          setup=Path('setup-cloud.html')
          s=setup.read_text(encoding='utf-8')
          import re
          s=re.sub(r'src="supabase-config\.js(?:\?[^\"]*)?"','src="supabase-config.js?v=20260913-auth2"',s)
          s=re.sub(r'src="supabase-sync\.js(?:\?[^\"]*)?"','src="supabase-sync.js?v=20260913-auth2"',s)
          setup.write_text(s,encoding='utf-8')
          PY
          node --check supabase-sync.js
          node --check crm-auth-guard.js
          node --check f1-acquisition-data.js
          grep -q "url: 'https://nqnmlsmeiynxbdojeyjt.supabase.co'" supabase-config.js
          grep -q 'crm-auth-guard.js?v=20260913-auth2' crm.html
          grep -q 'ACCESSO CRM RICHIESTO' crm-auth-guard.js
          if grep -q "url: localStorage.getItem('f1SupabaseUrl')" supabase-config.js; then exit 1; fi
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase-config.js f1-acquisition-data.js crm.html setup-cloud.html
          git commit -m 'Enforce canonical Supabase CRM authentication'
          git push
