name: Patch Seller Radar Table Tools

on:
  push:
    paths:
      - '.github/workflows/patch-seller-table-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Seller Radar table
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('seller-radar-unico.html')
          s = p.read_text(encoding='utf-8')

          # Scroll verticale + orizzontale sempre disponibile.
          s = s.replace(
              '.sheetWrap{overflow:auto;max-height:265px;border:1px solid #35513d;border-radius:10px}',
              '.sheetWrap{overflow:auto;max-height:55vh;border:1px solid #35513d;border-radius:10px;scrollbar-gutter:stable both-edges;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}'
          )

          # Stile pulsante COPIA RIGA e prima colonna fissa mentre si scorre.
          s = s.replace(
              '.sheetBtn,.editBtn,.saveBtn,.cancelBtn,.deleteBtn{',
              '.sheetBtn,.editBtn,.saveBtn,.cancelBtn,.deleteBtn,.copyBtn{'
          )
          s = s.replace(
              '.editBtn{background:#182019;border:1px solid var(--blue);color:var(--blue)}',
              '.copyBtn{background:#122417;border:1px solid var(--g);color:var(--g)}.editBtn{background:#182019;border:1px solid var(--blue);color:var(--blue)}'
          )
          s = s.replace(
              '.actionCell{min-width:220px}',
              '.copyHead,.copyCell{position:sticky;left:0;background:#152018;z-index:5;min-width:92px}.copyCell{background:#0d130e;z-index:3}.actionCell{min-width:220px}'
          )

          # COPIA RIGA come prima colonna della tabella.
          s = s.replace(
              '<thead><tr>\n        <th>DATA ANNUNCIO</th>',
              '<thead><tr>\n        <th class="copyHead">COPIA RIGA</th><th>DATA ANNUNCIO</th>'
          )

          # Prependi il pulsante ad ogni record.
          old = "$('contactBody').innerHTML=a.map((r,i)=>`<tr data-i=\"${i}\">${F.map(f=>`<td"
          new = "$('contactBody').innerHTML=a.map((r,i)=>`<tr data-i=\"${i}\"><td class=\"copyCell\"><button class=\"copyBtn\" onclick=\"copyRow(this)\">COPIA RIGA</button></td>${F.map(f=>`<td"
          if old not in s:
              raise SystemExit('renderContacts target not found')
          s = s.replace(old, new, 1)

          # Inserisci funzione di copia: una riga TSV pronta da incollare in Excel/fogli.
          marker = 'function editRow(btn){'
          copy_fn = '''async function copyRow(btn){
            const row=btn.closest('tr'),i=+row.dataset.i,r=contacts()[i];
            if(!r)return;
            const text=F.map(f=>r[f]||'').join('\\t');
            try{
              await navigator.clipboard.writeText(text);
            }catch(e){
              const ta=document.createElement('textarea');
              ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
              document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
            }
            const old=btn.textContent;btn.textContent='COPIATA';setTimeout(()=>btn.textContent=old,1200);
          }
          '''
          if marker not in s:
              raise SystemExit('editRow marker not found')
          s = s.replace(marker, copy_fn + marker, 1)

          # La nuova prima colonna sposta di +1 le celle editabili.
          edit_start = s.index('function editRow(btn){')
          save_start = s.index('function saveRow(btn){', edit_start)
          edit_block = s[edit_start:save_start]
          edit_block = edit_block.replace('row.cells[j]', 'row.cells[j+1]')
          edit_block = edit_block.replace('row.cells[F.length]', 'row.cells[F.length+1]')
          s = s[:edit_start] + edit_block + s[save_start:]

          save_start = s.index('function saveRow(btn){')
          delete_start = s.index('function deleteRow(btn){', save_start)
          save_block = s[save_start:delete_start]
          save_block = save_block.replace('row.cells[j]', 'row.cells[j+1]')
          s = s[:save_start] + save_block + s[delete_start:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "F1 Seller Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add seller-radar-unico.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add scrollable archive and copy-row action"
          git push origin HEAD:main
