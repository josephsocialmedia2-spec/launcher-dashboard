name: F1 Telefonate Dashboard QA

on:
  workflow_dispatch:
  push:
    paths:
      - "telefonate-oggi.html"
      - ".github/workflows/f1-telefonate-microzone-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica controlli telefonata e rimozione contatto
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('telefonate-oggi.html')
          s=p.read_text(encoding='utf-8')

          required=[
            'NON PIÙ PRESENTE · ELIMINA',
            'data-remove-contact',
            'async function removeContact',
            'CONTATTO_NON_PIU_PRESENTE',
            'deleted:true',
            'do_not_contact:true',
            'status:\'ARCHIVIATO\'',
            'class="phone-direct"',
            'href="tel:',
            'SCEGLI L\'ESITO QUANDO VUOI',
            'outcomeButtons(r)',
            'OCCUPATO · +5 MIN',
            'data-busy-task',
            'async function scheduleBusyCallback',
            'function checkBusyReminders',
            'BUSY_REMINDER_KEY',
            'Linea occupata. Richiamare tra 5 minuti.',
            'next_action:\'Richiamare dopo occupato\'',
            'COPIA SCHEDA',
            'data-copy-card',
            'async function copyClientCard',
            'navigator.clipboard.writeText',
            'document.execCommand(\'copy\')'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('FAIL controlli mancanti: '+', '.join(missing))

          forbidden=[
            "Prima premi CHIAMA ORA. Gli esiti si attivano dopo l’avvio della chiamata.",
            "outcomeButtons(r,armed)"
          ]
          present=[x for x in forbidden if x in s]
          if present:
              raise SystemExit('FAIL vincolo CHIAMA ORA ancora presente: '+', '.join(present))

          scripts=re.findall(r'<script>(.*?)</script>', s, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('FAIL JavaScript inline assente')
          Path('/tmp/telefonate-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('PASS rimozione, telefono diretto, esiti liberi, OCCUPATO +5 minuti e COPIA SCHEDA')
          PY

          node --check /tmp/telefonate-inline.js
          echo "PASS sintassi JavaScript telefonate"
