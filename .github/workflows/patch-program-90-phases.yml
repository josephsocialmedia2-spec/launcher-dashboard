name: Patch Program 90 Advanced Phases
on:
  push:
    paths:
      - '.github/workflows/patch-program-90-phases.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire application modules
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('program-90.html')
          s=p.read_text()
          tag='<script defer src="program-90-advanced.js?v=20260913-p90-adv1"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>')
          p.write_text(s)

          p=Path('script.html')
          s=p.read_text()
          tags='''<script src="roleplay-partners.js?v=20260913-rp1"></script>\n<script src="roleplay-realistic.js?v=20260913-rp1"></script>'''
          if 'roleplay-partners.js' not in s:
              s=s.replace('</body>',tags+'\n</body>')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          tag='<script src="program-90-phase-widget.js?v=20260913-p90-adv1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add program-90.html script.html index.html
          git commit -m 'Wire Program 90 advanced phase modules'
          git push
