name: F1 Desktop Windows

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - f1-desktop-offline
    paths:
      - "src-tauri/**"
      - "f1-desktop-data.js"
      - "f1-desktop-hub.js"
      - "desktop-settings.html"
      - "crm.html"
      - "crm-unified-app.js"
      - "crm-auth-guard.js"
      - "oggi.html"
      - "telefonate-oggi.html"
      - "giro-acquisizione.html"
      - "ricerca-territoriale.html"
      - "f1-territory-local.js"
      - "package.json"
      - ".github/workflows/f1-desktop-windows.yml"
  workflow_dispatch:

concurrency:
  group: f1-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check desktop adapter syntax
        run: node --check f1-desktop-data.js && node --check f1-desktop-hub.js && node --check f1-territory-local.js
      - name: Check modified CRM runtime syntax
        run: node --check crm-unified-app.js && node --check crm-auth-guard.js && node --check f1-dashboard-auth-guard.js

  build-windows:
    needs: verify-js
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm install
      - name: Prepare offline desktop assets
        run: node scripts/prepare-desktop.mjs
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build F1 Immobiliare Desktop
        run: npm run desktop:build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: F1-Immobiliare-Desktop-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
