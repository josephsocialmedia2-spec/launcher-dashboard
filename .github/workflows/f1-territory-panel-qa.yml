name: F1 Territory Panel QA

on:
  push:
    paths:
      - 'index.html'
      - 'crm.html'
      - 'territory-operations-panel.js'
      - 'territory-operations-panel.css'
      - 'crm-territory-handoff.js'
      - 'tests/territory-operations-panel.spec.js'
      - 'tests/fixtures/territory-handoff-harness.html'
      - 'supabase-migrations/20260916_f1_territory_operations_panel.sql'
      - '.github/workflows/f1-territory-panel-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static territory contract
        shell: bash
        run: |
          set -euo pipefail
          node --check territory-operations-panel.js
          node --check crm-territory-handoff.js
          node --check tests/territory-operations-panel.spec.js
          grep -q 'territory-operations-panel.css?v=20260916-territory1' index.html
          grep -q 'territory-operations-panel.js?v=20260916-territory1' index.html
          grep -q 'crm-territory-handoff.js?v=20260916-territory1' crm.html
          grep -q 'f1_territory_panel_state' territory-operations-panel.js
          grep -q 'DA INSERIRE NEL CRM' territory-operations-panel.js
          grep -q 'INSERISCI NEL CRM' territory-operations-panel.js
          grep -q 'VAI AL CRM' territory-operations-panel.js
          grep -q 'NESSUN GIRO ATTIVO' territory-operations-panel.js
          grep -q 'f1_territory_progress' supabase-migrations/20260916_f1_territory_operations_panel.sql
          grep -q 'f1_territory_observations' supabase-migrations/20260916_f1_territory_operations_panel.sql
          ! grep -Eq 'Google Dork|Research Engine|crawler|monitoraggio concorrenti' territory-operations-panel.js
          ! grep -q 'localStorage' territory-operations-panel.js
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Territory browser regression
        run: npx playwright test tests/territory-operations-panel.spec.js --project=desktop-chromium
      - name: Live GitHub Pages smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/index.html?qa=$RANDOM" -o /tmp/index.html \
              && curl -fsSL --max-time 20 "$base/crm.html?qa=$RANDOM" -o /tmp/crm.html \
              && curl -fsSL --max-time 20 "$base/territory-operations-panel.js?qa=$RANDOM" -o /tmp/panel.js \
              && curl -fsSL --max-time 20 "$base/crm-territory-handoff.js?qa=$RANDOM" -o /tmp/handoff.js \
              && grep -q 'territory-operations-panel.js?v=20260916-territory1' /tmp/index.html \
              && grep -q 'crm-territory-handoff.js?v=20260916-territory1' /tmp/crm.html \
              && grep -q 'f1_territory_panel_state' /tmp/panel.js \
              && grep -q 'INSERITA_CRM' /tmp/handoff.js; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS territory operations panel deployed'
