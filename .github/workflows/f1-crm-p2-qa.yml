name: F1 CRM P2 QA

on:
  push:
    paths:
      - 'f1-crm-intelligence.html'
      - 'f1-crm-intelligence.js'
      - 'f1-crm-map.html'
      - 'f1-crm-map.js'
      - 'f1-crm-os.html'
      - 'f1-crm-os.js'
      - 'config/crm-os.json'
      - 'tests/crm-intelligence-p2.spec.js'
      - 'tests/crm-os.spec.js'
      - 'tests/unified-crm.spec.js'
      - 'supabase-migrations/20260913_f1_crm_os_p2_*.sql'
      - '.github/workflows/f1-crm-p2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static P2 contract
        shell: bash
        run: |
          set -euo pipefail
          node --check f1-crm-intelligence.js
          node --check f1-crm-map.js
          node --check tests/crm-intelligence-p2.spec.js
          grep -q 'INTELLIGENZA COMMERCIALE' f1-crm-intelligence.html
          grep -q 'CONTACT PRIORITY SCORE' f1-crm-intelligence.js
          grep -q 'f1_top_properties_for_request' f1-crm-intelligence.js
          grep -q 'f1_top_requests_for_property' f1-crm-intelligence.js
          grep -q 'INDIFFERENTE' f1-crm-intelligence.js
          grep -q 'MAPPA UNIFICATA' f1-crm-map.html
          grep -q '0 PUNTI GEO REALI' f1-crm-map.js
          grep -q 'f1_map_points' f1-crm-map.js
          ! grep -q 'service_role' f1-crm-intelligence.html f1-crm-intelligence.js f1-crm-map.html f1-crm-map.js
          ! grep -q 'localStorage' f1-crm-intelligence.html f1-crm-intelligence.js f1-crm-map.html f1-crm-map.js
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: P2 intelligence browser QA
        run: npx playwright test tests/crm-intelligence-p2.spec.js --project=desktop-chromium
      - name: P1 CRM OS regression
        run: npx playwright test tests/crm-os.spec.js --project=desktop-chromium
      - name: Classic CRM regression
        run: npx playwright test tests/unified-crm.spec.js --project=desktop-chromium
      - name: Mobile P2 regression
        run: npx playwright test tests/crm-intelligence-p2.spec.js --project=mobile-chromium
      - name: Published P2 Pages smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/f1-crm-intelligence.html?qa=$RANDOM" -o /tmp/p2.html \
              && curl -fsSL --max-time 20 "$base/f1-crm-intelligence.js?qa=$RANDOM" -o /tmp/p2.js \
              && curl -fsSL --max-time 20 "$base/f1-crm-map.html?qa=$RANDOM" -o /tmp/map.html \
              && curl -fsSL --max-time 20 "$base/f1-crm-map.js?qa=$RANDOM" -o /tmp/map.js \
              && curl -fsSL --max-time 20 "$base/f1-crm-os.html?qa=$RANDOM" -o /tmp/os.html \
              && curl -fsSL --max-time 20 "$base/crm.html?qa=$RANDOM" -o /tmp/crm.html \
              && grep -q 'INTELLIGENZA COMMERCIALE' /tmp/p2.html \
              && grep -q 'CONTACT PRIORITY SCORE' /tmp/p2.js \
              && grep -q 'MAPPA UNIFICATA' /tmp/map.html \
              && grep -q '0 PUNTI GEO REALI' /tmp/map.js \
              && grep -qi 'Postazione Operativa' /tmp/os.html \
              && grep -q 'CRM UNIFICATO' /tmp/crm.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const base='https://josephsocialmedia2-spec.github.io/launcher-dashboard';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[]; const bad=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            page.on('response',r=>{if(r.url().startsWith(base)&&r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            for(const path of ['f1-crm-intelligence.html','f1-crm-map.html','f1-crm-os.html','crm.html']){
              const res=await page.goto(`${base}/${path}?qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!res||res.status()>=400)throw new Error(`HTTP ${res?.status()} ${path}`);
              await page.waitForTimeout(700);
              await page.reload({waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(300);
            }
            if(bad.length)throw new Error('Published same-origin failures: '+bad.join(' | '));
            if(errors.length)throw new Error('Blocking page errors: '+errors.join(' | '));
            await browser.close();
            console.log('PASS P2 published pages and direct refresh');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
