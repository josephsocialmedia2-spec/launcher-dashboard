name: Patch Network 250 Blue Card
on:
  push:
    paths:
      - '.github/workflows/patch-network-250-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert blue Network 250 card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''.net-widget{border:2px solid #2f8cff;border-radius:18px;padding:18px;background:radial-gradient(circle at top right,#1c63b755,transparent 42%),linear-gradient(145deg,#0b1b31,#102b4d);margin-bottom:24px}.net-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.net-widget h2{margin:4px 0 5px;font-size:26px}.net-widget p{margin:0;color:#bdd8f2;font-size:11px;line-height:1.5}.net-open{display:inline-flex;padding:11px 13px;border-radius:9px;background:#2f8cff;color:#fff;text-decoration:none;font-size:10px;font-weight:900;white-space:nowrap}.net-progress{height:11px;border:1px solid #315b88;border-radius:999px;background:#07111f;overflow:hidden;margin:11px 0}.net-progress>div{height:100%;width:0;background:linear-gradient(90deg,#2f8cff,#5fd3ff)}.net-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.net-stats div{padding:9px;text-align:center;border:1px solid #274b72;border-radius:10px;background:#09182a}.net-stats b{display:block;color:#5fd3ff;font-size:18px}.net-stats span{display:block;color:#aebfd1;font-size:7px;font-weight:900}@media(max-width:800px){.net-top{display:block}.net-open{margin-top:10px;width:100%;justify-content:center}.net-stats{grid-template-columns:1fr 1fr}}\n'''
          if '.net-widget{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          card='''<section class="net-widget" id="network250Widget">\n  <div class="net-top"><div><div class="ey">RETE PERSONALE E PROFESSIONALE · 250 FONTI</div><h2>RICOSTRUZIONE RETE 250</h2><p id="netStage">Caricamento rete reale…</p></div><a class="net-open" href="network-reconstruction.html">AVVIA RICOSTRUZIONE RETE →</a></div>\n  <div class="net-progress"><div id="netProgressBar"></div></div>\n  <div class="net-stats"><div><b id="netSourcesDone">0 / 250</b><span>FONTI COMPLETATE</span></div><div><b id="netPeople">0</b><span>PERSONE UNICHE</span></div><div><b id="netDup">0</b><span>DUPLICATI INTERCETTATI</span></div><div><b id="netReactivate">0</b><span>DA RIATTIVARE</span></div></div>\n</section>\n'''
          marker='<section class="mp-widget" id="marketPreviewWidget">'
          if 'id="network250Widget"' not in s:
              if marker not in s: raise SystemExit('Market Preview marker missing')
              s=s.replace(marker,card+marker,1)
          script='<script src="network-reconstruction-widget.js?v=20260913-net1"></script>\n'
          if 'network-reconstruction-widget.js' not in s:
              s=s.replace('</body></html>',script+'</body></html>',1)
          p.write_text(s)
          PY
          grep -q 'id="network250Widget"' index.html
          grep -q 'RICOSTRUZIONE RETE 250' index.html
          grep -q 'network-reconstruction-widget.js' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add blue Network 250 dashboard card'
          git push
