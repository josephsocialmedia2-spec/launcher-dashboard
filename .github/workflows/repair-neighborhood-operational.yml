name: Repair Neighborhood Operational

on:
  push:
    paths:
      - '.github/workflows/repair-neighborhood-operational.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair
        run: python scripts/repair_neighborhood_operational.py
      - name: Syntax check
        run: python -m py_compile scripts/neighborhood_intelligence.py scripts/repair_neighborhood_operational.py
      - name: Refresh operational data
        env:
          F1_NEIGHBORHOOD_RADIUS: '500'
          F1_NEIGHBORHOOD_MAX_ENRICH: '12'
        run: python scripts/neighborhood_intelligence.py
      - name: Commit repaired operational state
        run: |
          git config user.name "f1-operational-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/neighborhood_intelligence.py neighborhood-intelligence.html telefonate-oggi.html data/neighborhood_intelligence.json data/neighborhood_seen.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Repair and activate Neighborhood Intelligence"
          git push
