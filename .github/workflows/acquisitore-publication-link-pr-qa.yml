name: Acquisitore Publication Link PR QA
on:
  pull_request:
    branches: [ main ]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/acquisitore-pro-publication-link.spec.js --config=playwright.v25.config.js --project=mobile-chromium --reporter=line
