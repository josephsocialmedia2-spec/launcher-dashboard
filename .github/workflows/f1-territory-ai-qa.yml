name: F1 Territory AI QA

on:
  push:
    branches: [main]
    paths:
      - 'territory-mobile.html'
      - 'sw.js'
      - 'windows-bridge/f1_chatgpt_uploader.py'
      - 'windows-bridge/INSTALLA_BRIDGE.bat'
      - 'tests/territory-ai-upload.spec.js'
      - '.github/workflows/f1-territory-ai-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Compile Python uploader
        run: python -m py_compile windows-bridge/f1_chatgpt_uploader.py
      - name: Static and JavaScript syntax QA
        run: npx playwright test tests/territory-ai-upload.spec.js --project=desktop-chromium
