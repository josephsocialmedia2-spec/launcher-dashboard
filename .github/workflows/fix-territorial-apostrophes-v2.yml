name: Fix Territorial Apostrophes V2
on:
  push:
    paths:
      - '.github/workflows/fix-territorial-apostrophes-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/neighborhood_intelligence.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('replace("’", "\\\\\'")', 'replace("’", "\'")')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "f1-territorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/neighborhood_intelligence.py
          if git diff --cached --quiet; then echo no-change; exit 0; fi
          git commit -m "Fix territorial apostrophe normalization"
          git push
