name: F1 Launcher Master UI QA

on:
  push:
    branches: [main]
    paths:
      - 'f1-launcher-master.css'
      - 'f1-launcher-master.js'
      - 'f1-dashboard-novice.css'
      - 'albero-fonti-notizie.html'
      - 'ricerca-territoriale.html'
      - 'crm.html'
      - 'oggi.html'
      - 'documenti-vendita.html'
      - 'centrale-risultati.html'
      - 'accessi-ufficio.html'
      - 'setup-cloud.html'
      - 'telefonate-oggi.html'
      - 'f1-email-radar.html'
      - 'social-seller-radar.html'
      - 'ricerca-territoriale.js'
      - 'ricerca-territoriale-layout.js'
      - 'f1-dashboard-auth-guard.js'
      - 'f1-notiziere-engine.js'
      - 'f1-tour-admin-dashboard.js'
      - 'f1-staff-access-panel.js'
      - 'f1-desktop-mobile-bridge.js'
      - 'f1-territory-admin-v4.js'
      - 'tests/f1-launcher-master-ui.spec.js'
      - 'tests/f1-novice-dashboard.spec.js'
      - '.github/workflows/f1-launcher-master-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in             f1-launcher-master.js             f1-dashboard-auth-guard.js             f1-staff-data.js             f1-notiziere-engine.js             ricerca-territoriale.js             f1-notiziere-assistant-bridge.js             f1-tour-admin-dashboard.js             f1-staff-access-panel.js             f1-realtime.js             f1-desktop-mobile-bridge.js             f1-territory-admin-v4.js             ricerca-territoriale-layout.js             f1-secret-db-access.js             content-production-week.js             dashboard-primary-accordions.js \
            f1-global-brand.js \
            f1-premium-help.js; do
            echo "CHECK $file"
            node --check "$file"
          done
      - name: Install QA dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run launcher and novice-dashboard regression checks
        run: npx playwright test tests/f1-launcher-master-ui.spec.js tests/f1-novice-dashboard.spec.js --project=desktop-chromium
