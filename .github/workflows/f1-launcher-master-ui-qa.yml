name: F1 Launcher Master UI QA

on:
  push:
    branches: [main]
    paths:
      - 'f1-launcher-master.css'
      - 'f1-launcher-master.js'
      - 'f1-operating-system.css'
      - 'f1-os-today.js'
      - 'f1-territory-workspace.js'
      - 'albero-fonti-notizie.html'
      - 'ricerca-territoriale.html'
      - 'crm.html'
      - 'oggi.html'
      - 'documenti-vendita.html'
      - 'centrale-risultati.html'
      - 'accessi-ufficio.html'
      - 'setup-cloud.html'
      - 'telefonate-oggi.html'
      - 'f1-email-radar.html'
      - 'social-seller-radar.html'
      - 'ricerca-territoriale.js'
      - 'ricerca-territoriale-layout.js'
      - 'f1-dashboard-auth-guard.js'
      - 'f1-notiziere-engine.js'
      - 'f1-tour-admin-dashboard.js'
      - 'f1-staff-access-panel.js'
      - 'f1-desktop-mobile-bridge.js'
      - 'f1-territory-admin-v4.js'
      - 'f1-global-brand.js'
      - 'f1-premium-help.js'
      - 'tests/f1-launcher-master-ui.spec.js'
      - 'tests/f1-os-consolidation.spec.js'
      - '.github/workflows/f1-launcher-master-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in             f1-launcher-master.js             f1-dashboard-auth-guard.js             f1-staff-data.js             f1-notiziere-engine.js             ricerca-territoriale.js             f1-notiziere-assistant-bridge.js             f1-tour-admin-dashboard.js             f1-staff-access-panel.js             f1-realtime.js             f1-desktop-mobile-bridge.js             f1-territory-admin-v4.js             ricerca-territoriale-layout.js             f1-secret-db-access.js             content-production-week.js             dashboard-primary-accordions.js \
            f1-global-brand.js \
            f1-premium-help.js \
            f1-os-today.js \
            f1-territory-workspace.js; do
            echo "CHECK $file"
            node --check "$file"
          done
      - name: Install QA dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run launcher and novice-dashboard regression checks
        run: npx playwright test tests/f1-launcher-master-ui.spec.js tests/f1-os-consolidation.spec.js --project=desktop-chromium

      - name: Upload dashboard visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-dashboard-visual-qa
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify deployed F1 dashboard
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            echo "Published F1 OS check $i/60"
            if curl -fsSL --max-time 20 "$base/oggi.html?qa=$RANDOM" -o /tmp/oggi.html \
              && curl -fsSL --max-time 20 "$base/ricerca-territoriale.html?qa=$RANDOM" -o /tmp/territorio.html \
              && curl -fsSL --max-time 20 "$base/f1-operating-system.css?qa=$RANDOM" -o /tmp/os.css \
              && curl -fsSL --max-time 20 "$base/f1-territory-workspace.js?qa=$RANDOM" -o /tmp/territory.js \
              && grep -Fq 'UNICA CENTRALE OPERATIVA' /tmp/oggi.html \
              && grep -Fq 'F1 ACQUISITION COMMAND CENTER' /tmp/oggi.html \
              && grep -Fq 'Dal civico alla relazione.' /tmp/territorio.html \
              && grep -Fq 'CHE COSA MI HA RACCONTATO?' /tmp/territorio.html \
              && grep -Fq 'f1-os-territory' /tmp/os.css \
              && ! grep -Fq 'REALMEDIAPRO' /tmp/territorio.html \
              && ! grep -Fq 'CUSTOMER CAMPAIGN ENGINE' /tmp/territorio.html \
              && node --check /tmp/territory.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS F1 OS deployed and syntax-valid'
