name: Verify F1 Script Trainer

on:
  push:
    branches: [main]
    paths:
      - "mike-ferry-script-trainer/**"
      - ".github/workflows/verify-f1-script-trainer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public trainer
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://josephsocialmedia2-spec.github.io/launcher-dashboard/mike-ferry-script-trainer"
          ok=0
          for i in {1..36}; do
            if curl -fsSL --max-time 20 "$BASE/" -o /tmp/index.html \
              && curl -fsSL --max-time 20 "$BASE/acquisition.html" -o /tmp/acquisition.html \
              && curl -fsSL --max-time 20 "$BASE/acquisition.js" -o /tmp/acquisition.js \
              && curl -fsSL --max-time 20 "$BASE/simulator.html" -o /tmp/simulator.html \
              && curl -fsSL --max-time 20 "$BASE/simulator.js" -o /tmp/simulator.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          grep -q "F1 SCRIPT TRAINER" /tmp/index.html
          grep -q "IMPARA L'ACQUISIZIONE" /tmp/index.html
          grep -q "AVVIA SIMULATORE" /tmp/index.html
          grep -q "CORSO ACQUISIZIONE" /tmp/acquisition.html
          grep -q "Catena di memoria" /tmp/acquisition.html
          grep -q "SpeechSynthesisUtterance" /tmp/acquisition.js
          grep -q "SIMULATORE ROLE PLAY" /tmp/simulator.html
          grep -q "ACCENDI TELECAMERA" /tmp/simulator.html
          grep -q "SpeechRecognition" /tmp/simulator.js
          grep -q "getUserMedia" /tmp/simulator.js
          grep -q "MediaRecorder" /tmp/simulator.js
          grep -q "FaceDetector" /tmp/simulator.js
          curl -fsSL --max-time 20 "$BASE/manifest.webmanifest" -o /tmp/manifest.webmanifest
          grep -q '"display": "standalone"' /tmp/manifest.webmanifest
          curl -fsSL --max-time 20 "$BASE/data/scripts.js" -o /tmp/scripts.js
          grep -q "window.F1_SCRIPTS" /tmp/scripts.js
          grep -q "lp-02-tre-risultati" /tmp/scripts.js
          grep -q "acq-03-prequalifica-completa" /tmp/scripts.js
          curl -fsSL --max-time 20 "$BASE/app.js" -o /tmp/app.js
          curl -fsSL --max-time 20 "$BASE/service-worker.js" -o /tmp/sw.js
          grep -q "simulator.js" /tmp/sw.js
          grep -q "acquisition.js" /tmp/sw.js
          node --check /tmp/app.js
          node --check /tmp/acquisition.js
          node --check /tmp/simulator.js
          node --check /tmp/scripts.js
          python -m json.tool /tmp/manifest.webmanifest >/dev/null
          printf 'PUBLIC_URL_OK=1\n'
