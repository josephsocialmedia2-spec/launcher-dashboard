name: UGC Avatar Studio E2E
# CPU4 long-timeout certification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ugc-avatar-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for safe test deployment
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url="https://joseph-socialmedia2--ugc-avatar-studio-web.modal.run/health"
          last=None
          for i in range(40):
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      data=json.load(r)
                      print(data)
                      if r.status==200 and data.get("status")=="ok" and data.get("test_publish_control") is True:
                          raise SystemExit(0)
              except Exception as exc:
                  last=exc
              time.sleep(10)
          raise SystemExit(f"SAFE_TEST_DEPLOYMENT_NOT_READY: {last}")
          PY
      - name: Prepare authorized presenter image
        run: |
          python - <<'PY'
          import base64, urllib.request
          url="https://raw.githubusercontent.com/josephsocialmedia2-spec/open-social-scheduler/main/publisher/assets/joseph_presenter.jpg.b64"
          data=urllib.request.urlopen(url,timeout=60).read()
          open("presenter.jpg","wb").write(base64.b64decode(data))
          PY
          file presenter.jpg
          test -s presenter.jpg
      - name: Render avatar without social publication
        run: |
          set -euo pipefail
          BASE="https://joseph-socialmedia2--ugc-avatar-studio-web.modal.run"
          HTTP_CODE="$(curl --silent --show-error --location --max-redirs 20 --max-time 1800 \
            -o response.json -w "%{http_code}" \
            -F "photo=@presenter.jpg;type=image/jpeg" \
            -F "script=Ciao, questo è un test automatico del sistema avatar e pubblicazione social." \
            -F "publish=false" \
            "$BASE/api/render" || true)"
          echo "HTTP_CODE=$HTTP_CODE"
          cat response.json || true
          test "$HTTP_CODE" = "200"
          JOB_ID="$(python -c 'import json; print(json.load(open("response.json"))["job_id"])')"
          STATE="$(python -c 'import json; print(json.load(open("response.json"))["state"])')"
          PUB="$(python -c 'import json; print(json.load(open("response.json"))["publication_status"])')"
          test "$STATE" = "test_completed"
          test "$PUB" = "TEST_ONLY"
          curl --fail --max-time 300 "$BASE/api/jobs/$JOB_ID/video" -o output.mp4
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
      - name: Verify MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_streams -show_format -of json output.mp4 > probe.json
          python - <<'PY'
          import json, os
          p=json.load(open("probe.json"))
          streams=p.get("streams",[])
          v=next((s for s in streams if s.get("codec_type")=="video"),None)
          a=next((s for s in streams if s.get("codec_type")=="audio"),None)
          assert v and a, "audio/video stream missing"
          assert int(v.get("width",0))==1080 and int(v.get("height",0))==1920
          assert float(p.get("format",{}).get("duration") or 0)>0
          print("E2E_RENDER_OK", os.environ.get("JOB_ID"))
          PY
