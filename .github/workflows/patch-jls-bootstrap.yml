name: Patch JLS bootstrap IDs
on:
  push:
    paths:
      - '.github/workflows/patch-jls-bootstrap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix getElementById calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('just-listed-sold.js')
          s=p.read_text(encoding='utf-8')
          bad=s.count("$('#")
          if bad < 1:
              raise SystemExit('Expected bootstrap selector bug not found')
          s=s.replace("$('#", "$('")
          required=[
              "$('saveProgramStart').onclick=saveProgramStart",
              "$('saveOutcome').onclick=saveOutcome",
              "$('convertReferral').onclick=convertReferral",
          ]
          if "$('#" in s:
              raise SystemExit('Invalid # prefix still present')
          for item in required:
              if item not in s:
                  raise SystemExit('Expected handler missing: '+item)
          p.write_text(s,encoding='utf-8')
          print('fixed selectors:', bad)
          PY
          node --check just-listed-sold.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add just-listed-sold.js
          git commit -m 'Fix Just Listed Sold bootstrap element IDs'
          git push
