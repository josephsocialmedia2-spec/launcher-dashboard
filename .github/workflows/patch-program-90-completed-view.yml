name: Patch Program 90 Completed View
on:
  push:
    paths:
      - '.github/workflows/patch-program-90-completed-view.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose completed-program review without reopening a day
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('program-90-advanced.js')
          s=p.read_text()
          old="panel.hidden=!show;if(!show)return;const x=program90Snapshot();"
          new="panel.hidden=!show;if(!show)return;const operational=$('operational'),setup=$('setupPanel');if(operational)operational.hidden=false;if(setup)setup.hidden=true;const x=program90Snapshot();"
          if old not in s:
              raise SystemExit('render90 visibility marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check program-90-advanced.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add program-90-advanced.js
          git commit -m 'Show Program 90 completed review view'
          git push
