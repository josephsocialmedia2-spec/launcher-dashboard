name: UGC Avatar HF Status

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ugc-avatar-hf-status.yml'
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install status client
        run: pip install "huggingface_hub>=0.36,<1" requests
      - name: Inspect Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          from huggingface_hub import HfApi

          repo_id="realmediajo/ugc-avatar-studio"
          api=HfApi(token=os.environ["HF_TOKEN"])
          runtime=api.get_space_runtime(repo_id)
          info=api.space_info(repo_id)
          print("STAGE=", getattr(runtime,"stage",None))
          print("HARDWARE=", getattr(runtime,"hardware",None))
          print("REQUESTED_HARDWARE=", getattr(runtime,"requested_hardware",None))
          print("SUBDOMAIN=", getattr(info,"subdomain",None))
          subdomain=getattr(info,"subdomain",None)
          if subdomain:
              app=f"https://{subdomain}.hf.space"
              print("APP_URL=", app)
              for path in ["/","/health","/api/diagnostics"]:
                  try:
                      r=requests.get(app+path,timeout=20)
                      print("HTTP",path,r.status_code,r.url)
                      print(r.text[:1000].replace("\n"," "))
                  except Exception as e:
                      print("HTTP_ERROR",path,repr(e))
          PY
