name: Patch Market Preview cache refs
on:
  push:
    paths:
      - '.github/workflows/patch-market-preview-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/market-preview.js?v=20260913-mp1/market-preview.js?v=20260913-mp2/g' market-preview.html
          sed -i 's/market-preview-widget.js?v=20260913-mp1/market-preview-widget.js?v=20260913-mp2/g' index.html
          grep -q 'market-preview.js?v=20260913-mp2' market-preview.html
          grep -q 'market-preview-widget.js?v=20260913-mp2' index.html
      - run: |
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html market-preview.html
          git diff --cached --quiet || git commit -m 'Version Market Preview browser assets'
          git push