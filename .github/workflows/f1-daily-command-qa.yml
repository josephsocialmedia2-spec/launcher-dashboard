name: F1 Daily Command Dashboard QA
on:
  push:
    paths:
      - 'index.html'
      - 'daily-command-panel.css'
      - 'daily-command-panel.js'
      - 'tests/daily-command-panel.spec.js'
      - '.github/workflows/f1-daily-command-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static daily command contract
        run: |
          set -ex
          node --check daily-command-panel.js
          node --check tests/daily-command-panel.spec.js
          grep -q 'daily-command-panel.css?v=20260913-daily2' index.html
          grep -q 'daily-command-panel.js?v=20260913-daily2' index.html
          grep -q 'position:sticky' daily-command-panel.css
          grep -q 'grid-template-columns:minmax(0,72%)' daily-command-panel.css
          grep -q 'f1DailyCommand:' daily-command-panel.js
          grep -q '06:30' daily-command-panel.js
          grep -q '20:00' daily-command-panel.js
          grep -q 'MARKET PREVIEW' daily-command-panel.js
          grep -q 'JUST LISTED / JUST SOLD' daily-command-panel.js
          grep -q 'CHIUSURA GIORNATA' daily-command-panel.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('daily-command-panel.js','utf8');
          const ids=[...s.matchAll(/\{id:'([^']+)'/g)].map(x=>x[1]);
          if(ids.length!==20||new Set(ids).size!==20) throw new Error('Sequenza giornaliera non contiene 20 blocchi unici');
          NODE
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Daily command E2E desktop mobile persistence
        run: npx playwright test tests/daily-command-panel.spec.js --project=desktop-chromium
      - name: Existing dashboard regressions
        run: npx playwright test tests/network-reconstruction.spec.js tests/program-90-goals-reset.spec.js tests/market-preview.spec.js --project=desktop-chromium
      - name: Published GitHub Pages smoke
        run: |
          set -e
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          deployed=0
          for i in $(seq 1 72); do
            if curl -fsSL "$base/index.html?qa=$RANDOM" -o /tmp/index \
              && curl -fsSL "$base/daily-command-panel.css?qa=$RANDOM" -o /tmp/dailycss \
              && curl -fsSL "$base/daily-command-panel.js?qa=$RANDOM" -o /tmp/dailyjs \
              && grep -q 'daily-command-panel.css?v=20260913-daily2' /tmp/index \
              && grep -q 'daily-command-panel.js?v=20260913-daily2' /tmp/index \
              && grep -q 'f1-command-panel' /tmp/dailycss \
              && grep -q 'PROGRAMMA OPERATIVO DI OGGI' /tmp/dailyjs; then
              deployed=1
              break
            fi
            sleep 5
          done
          test "$deployed" = 1
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-command-visual-qa
          path: |
            test-results/daily-command-desktop.png
            test-results/daily-command-mobile.png
          if-no-files-found: ignore