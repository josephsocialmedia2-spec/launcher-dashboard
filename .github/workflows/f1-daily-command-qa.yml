name: F1 Daily Command Policy QA

on:
  push:
    branches: [main]
    paths:
      - 'daily-command-panel.js'
      - 'tests/daily-command-panel.spec.js'
      - '.github/workflows/f1-daily-command-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify daily command policy
        shell: bash
        run: |
          set -euo pipefail
          node --check daily-command-panel.js
          node --check tests/daily-command-panel.spec.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('daily-command-panel.js','utf8');
          const ids=[...s.matchAll(/\{id:'([^']+)'/g)].map(x=>x[1]);
          if(ids.length!==20||new Set(ids).size!==20) throw new Error('Sequenza giornaliera non contiene 20 blocchi unici');
          const forbidden=[
            "name:'PROSPECTING'",
            "goal:'10 contatti prospecting'",
            "module:'Telefonate + Script + CRM'",
            "href:'telefonate-oggi.html',linkNeedle:'telefonate-oggi.html'"
          ];
          for(const value of forbidden){
            if(s.includes(value)) throw new Error('Routine Telefonate ancora programmata: '+value);
          }
          for(const value of ["name:'PRIORITÀ OPERATIVE'","name:'PRIORITÀ POMERIDIANE'"]){
            if(!s.includes(value)) throw new Error('Blocco neutro mancante: '+value);
          }
          console.log('PASS: Telefonate non è più una routine oraria nel programma giornaliero');
          NODE

      - name: Verify published policy
        shell: bash
        run: |
          set -euo pipefail
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/daily-command-panel.js?qa=$RANDOM" -o /tmp/daily.js               && grep -Fq "name:'PRIORITÀ OPERATIVE'" /tmp/daily.js               && grep -Fq "name:'PRIORITÀ POMERIDIANE'" /tmp/daily.js               && ! grep -Fq "name:'PROSPECTING'" /tmp/daily.js               && ! grep -Fq "module:'Telefonate + Script + CRM'" /tmp/daily.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS: policy Telefonate libera pubblicata'
