name: F1 Daily Command Dashboard QA
on:
  push:
    paths:
      - 'index.html'
      - 'daily-command-panel.css'
      - 'daily-command-panel.js'
      - 'dashboard-workspace.css'
      - 'dashboard-workspace.js'
      - 'market-preview-widget.js'
      - 'f1-ai-guide.css'
      - 'f1-ai-guide.js'
      - 'f1-operational-procedures.js'
      - 'f1-guided-workspace.css'
      - 'f1-guided-workspace.js'
      - 'tests/daily-command-panel.spec.js'
      - '.github/workflows/f1-daily-command-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static IA004 dashboard contract
        run: |
          set -ex
          node --check daily-command-panel.js
          node --check dashboard-workspace.js
          node --check market-preview-widget.js
          node --check f1-operational-procedures.js
          node --check f1-ai-guide.js
          node --check f1-guided-workspace.js
          node --check tests/daily-command-panel.spec.js
          grep -q 'dashboard-workspace.css?v=20260914-ia004-1' index.html
          grep -q 'dashboard-workspace.js?v=20260914-ia004-1' index.html
          grep -q 'f1-ai-guide.css?v=20260914-guide2' index.html
          grep -q 'f1-operational-procedures.js?v=20260914-docops1' index.html
          grep -q 'f1-ai-guide.js?v=20260914-guide5' index.html
          grep -q 'f1-guided-workspace.css?v=20260914-guide5' index.html
          grep -q 'f1-guided-workspace.js?v=20260914-guide5' index.html
          grep -q 'market-preview-widget.js?v=20260914-mp3' index.html
          grep -q 'id="reparto-ricerca"' index.html
          grep -q 'id="reparto-acquisizione"' index.html
          grep -q 'id="reparto-vendita"' index.html
          grep -q 'id="reparto-pubblicita"' index.html
          grep -q 'legacy-data-bridge' index.html
          grep -q 'grid-template-columns:minmax(0,80%)' dashboard-workspace.css
          grep -q 'height:calc(100vh - 68px)' dashboard-workspace.css
          grep -q 'F1StaffData.tasks' dashboard-workspace.js
          grep -q 'ADESSO' dashboard-workspace.js
          grep -q 'DOPO' dashboard-workspace.js
          grep -q 'HO FINITO' dashboard-workspace.js
          grep -q 'f1DailyCommand:' daily-command-panel.js
          grep -q 'setInterval(tick,1000)' daily-command-panel.js
          grep -q '06:30' daily-command-panel.js
          grep -q '20:00' daily-command-panel.js
          grep -q 'GUIDA FUNZIONARIO' f1-ai-guide.js
          grep -q 'ORDINE OPERATIVO' f1-ai-guide.js
          grep -q 'TROVA NOTIZIE' f1-ai-guide.js
          grep -q 'f1AiZone' f1-ai-guide.js
          grep -q 'f1AiExecute' f1-ai-guide.js
          grep -q 'f1AiRegister' f1-ai-guide.js
          grep -q 'PRIMI 30 GIORNI' f1-operational-procedures.js
          grep -q 'VECCHIE VALUTAZIONI' f1-operational-procedures.js
          grep -q 'AVVIA E APRI' f1-guided-workspace.js
          grep -q 'F1AIGuide?.start' f1-guided-workspace.js
          grep -q 'SONO BLOCCATO' f1-ai-guide.js
          grep -q 'APRI SCRIPT' f1-ai-guide.js
          ! grep -q 'f1AiGuideLoader' market-preview-widget.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('daily-command-panel.js','utf8');
          const ids=[...s.matchAll(/\{id:'([^']+)'/g)].map(x=>x[1]);
          if(ids.length!==20||new Set(ids).size!==20) throw new Error('Sequenza giornaliera non contiene 20 blocchi unici');
          const h=fs.readFileSync('index.html','utf8');
          for(const id of ['reparto-ricerca','reparto-acquisizione','reparto-vendita','reparto-pubblicita']){
            const block=h.split(`id="${id}"`)[1]?.split('</section>')[0]||'';
            const cards=(block.match(/f1-op-card/g)||[]).length;
            if(cards<8) throw new Error(`${id}: meno di 8 card operative`);
          }
          NODE
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: IA004 daily command E2E
        run: npx playwright test tests/daily-command-panel.spec.js --project=desktop-chromium
      - name: Existing CRM and dashboard regressions
        run: npx playwright test tests/crm-full-e2e.spec.js tests/market-preview.spec.js --project=desktop-chromium
      - name: Published GitHub Pages smoke
        run: |
          set -e
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          deployed=0
          for i in $(seq 1 72); do
            if curl -fsSL "$base/index.html?qa=$RANDOM" -o /tmp/index \
              && curl -fsSL "$base/dashboard-workspace.css?qa=$RANDOM" -o /tmp/workcss \
              && curl -fsSL "$base/dashboard-workspace.js?qa=$RANDOM" -o /tmp/workjs \
              && curl -fsSL "$base/daily-command-panel.js?qa=$RANDOM" -o /tmp/dailyjs \
              && curl -fsSL "$base/f1-operational-procedures.js?qa=$RANDOM" -o /tmp/procjs \
              && curl -fsSL "$base/f1-ai-guide.js?qa=$RANDOM" -o /tmp/guidejs \
              && curl -fsSL "$base/f1-ai-guide.css?qa=$RANDOM" -o /tmp/guidecss \
              && curl -fsSL "$base/f1-guided-workspace.js?qa=$RANDOM" -o /tmp/guidedjs \
              && curl -fsSL "$base/f1-guided-workspace.css?qa=$RANDOM" -o /tmp/guidedcss \
              && grep -q 'id="reparto-ricerca"' /tmp/index \
              && grep -q 'id="reparto-pubblicita"' /tmp/index \
              && grep -q 'f1-operational-procedures.js?v=20260914-docops1' /tmp/index \
              && grep -q 'f1-ai-guide.js?v=20260914-guide5' /tmp/index \
              && grep -q 'f1-guided-workspace.js?v=20260914-guide5' /tmp/index \
              && grep -q 'market-preview-widget.js?v=20260914-mp3' /tmp/index \
              && grep -q 'grid-template-columns:minmax(0,80%)' /tmp/workcss \
              && grep -q 'HO FINITO' /tmp/workjs \
              && grep -q 'PROGRAMMA OPERATIVO DI OGGI' /tmp/dailyjs \
              && grep -q 'VECCHIE VALUTAZIONI' /tmp/procjs \
              && grep -q 'ORDINE OPERATIVO' /tmp/guidejs \
              && grep -q 'f1AiZone' /tmp/guidejs \
              && grep -q 'f1-ai-guide-active' /tmp/guidecss \
              && grep -q 'AVVIA E APRI' /tmp/guidedjs \
              && grep -q 'f1-guided-workspace' /tmp/guidedcss; then
              deployed=1
              break
            fi
            sleep 5
          done
          test "$deployed" = 1
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia004-dashboard-visual-qa
          path: |
            test-results/daily-command-desktop.png
            test-results/daily-command-mobile.png
          if-no-files-found: ignore
