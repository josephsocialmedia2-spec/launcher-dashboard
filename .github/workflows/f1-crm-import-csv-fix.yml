name: F1 CRM Import CSV Fix

on:
  push:
    paths:
      - '.github/workflows/f1-crm-import-csv-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add robust CSV delimiter parser
        shell: python
        run: |
          from pathlib import Path
          p=Path('crm-import-app.js')
          s=p.read_text(encoding='utf-8')
          old="""function readWithXLSX(file){return file.arrayBuffer().then(buf=>{if(!window.XLSX)throw new Error('Libreria Excel non disponibile. Ricarica la pagina e riprova.');const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]],matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});return matrix})}"""
          new="""function countDelimiter(line,delimiter){let count=0,quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='\\"'){if(quoted&&line[i+1]==='\\"'){i++;continue}quoted=!quoted;continue}if(!quoted&&ch===delimiter)count++}return count}
          function csvDelimiter(text){const lines=String(text||'').replace(/^\\uFEFF/,'').split(/\\r?\\n/).filter(x=>x.trim()).slice(0,5),candidates=[';',',','\\t','|'];let best=',',score=-1;for(const d of candidates){const n=lines.reduce((sum,line)=>sum+countDelimiter(line,d),0);if(n>score){best=d;score=n}}return best}
          function parseDelimited(text,delimiter){const rows=[],row=[];let current='',quoted=false;const input=String(text||'').replace(/^\\uFEFF/,'');for(let i=0;i<input.length;i++){const ch=input[i];if(quoted){if(ch==='\\"'){if(input[i+1]==='\\"'){current+='\\"';i++}else quoted=false}else current+=ch;continue}if(ch==='\\"'){quoted=true;continue}if(ch===delimiter){row.push(current);current='';continue}if(ch==='\\n'){row.push(current);current='';if(row.some(v=>String(v).trim()))rows.push(row.splice(0));else row.splice(0);continue}if(ch==='\\r')continue;current+=ch}row.push(current);if(row.some(v=>String(v).trim()))rows.push(row);return rows}
          function readWithXLSX(file){return file.arrayBuffer().then(buf=>{if(!window.XLSX)throw new Error('Libreria Excel non disponibile. Ricarica la pagina e riprova.');const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]],matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});return matrix})}
          function readInput(file){if(/\\.csv$/i.test(file.name)||/csv|text\\//i.test(file.type||''))return file.text().then(text=>parseDelimited(text,csvDelimiter(text)));return readWithXLSX(file)}"""
          if old not in s:
              raise SystemExit('readWithXLSX marker not found')
          s=s.replace(old,new,1)
          old_call="const matrix=await readWithXLSX(file);"
          if old_call not in s:
              raise SystemExit('analyze read marker not found')
          s=s.replace(old_call,"const matrix=await readInput(file);",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add crm-import-app.js
          git commit -m 'Fix semicolon and quoted CSV imports'
          git push
