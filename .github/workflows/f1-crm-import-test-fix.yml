name: F1 CRM Import Test Fix

on:
  push:
    paths:
      - '.github/workflows/f1-crm-import-test-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact mapping-row selector
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/crm-excel-import.spec.js')
          s=p.read_text(encoding='utf-8')
          old="function mapRow(page,text){return page.locator('#importMapping tr').filter({hasText:text}).first()}"
          new="function mapRow(page,text){return page.locator('#importMapping tr').filter({has:page.getByRole('cell',{name:text,exact:true})}).first()}"
          if old not in s:
              raise SystemExit('selector marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit selector fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/crm-excel-import.spec.js
          git commit -m 'Fix CRM import QA mapping selector'
          git push
