name: F1 Program 90 Days QA
# QA revision: advanced-day90-final
on:
  push:
    paths:
      - 'index.html'
      - 'program-90.html'
      - 'program-90*.js'
      - 'script.html'
      - 'roleplay-*.js'
      - 'tests/program-90.spec.js'
      - 'tests/program-90-point7.spec.js'
      - 'tests/program-90-goals-reset.spec.js'
      - 'tests/program-90-operational-days.spec.js'
      - 'tests/program-90-phases.spec.js'
      - 'tests/roleplay-partners.spec.js'
      - 'tests/program-90-live.spec.js'
      - '.github/workflows/f1-program-90-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Program 90 contract
        run: |
          set -ex
          node --check program-90.js
          node --check program-90-widget.js
          node --check program-90-advanced.js
          node --check program-90-phase-widget.js
          node --check roleplay-partners.js
          node --check roleplay-realistic.js
          node --check tests/program-90.spec.js
          node --check tests/program-90-point7.spec.js
          node --check tests/program-90-goals-reset.spec.js
          node --check tests/program-90-operational-days.spec.js
          node --check tests/program-90-phases.spec.js
          node --check tests/roleplay-partners.spec.js
          node --check tests/program-90-live.spec.js
          grep -q 'id="program90Widget"' index.html
          grep -q 'PROGRAMMA 90 GIORNI' program-90.html
          grep -q 'CHIUDI GIORNATA' program-90.html
          grep -q 'RIVEDI OBIETTIVI' program-90.html
          grep -q 'id="noAppointmentPanel"' program-90.html
          grep -q 'program-90-advanced.js?v=20260913-p90-adv2' program-90.html
          grep -q 'program-90-phase-widget.js?v=20260913-p90-adv2' index.html
          grep -q 'roleplay-partners.js' script.html
          grep -q 'roleplay-realistic.js' script.html
          grep -q "F1_90_DAY_PROGRAM" program-90.js
          grep -q "F1_90_DAY_ATTEMPT" program-90.js
          grep -q "F1_90_ATTEMPT_RESET" program-90.js
          grep -q "operational_weekdays" program-90.js
          grep -q "GIORNATA NON OPERATIVA" program-90.js
          grep -q "APPUNTAMENTO_SVOLTO" program-90.js
          grep -q "CONTRATTO_FIRMATO" program-90.js
          grep -q "GRANDE OBIETTIVO" program-90-widget.js
          grep -q "F1_90_NO_APPOINTMENT_FSBO_EXPIRED" program-90.js
          grep -q "SECONDI 30 GIORNI" program-90-advanced.js
          grep -q "TERZI 30 GIORNI" program-90-advanced.js
          grep -q "CONTATTI REALI" program-90-advanced.js
          grep -q "APPUNTAMENTI SETTIMANA" program-90-advanced.js
          grep -q "baseline reale dei 90 giorni" program-90-advanced.js
          grep -q "F1_18_MONTH_PLAN" program-90-advanced.js
          grep -q "render90();renderPeriod()" program-90-advanced.js
          grep -q "p90ScriptToday" program-90-phase-widget.js
          grep -q "p90ProsToday" program-90-phase-widget.js
          grep -q "PARTNER ROLE-PLAY" roleplay-partners.js
          grep -q "SIMULATORE ROLE-PLAY REALISTICO" roleplay-realistic.js
          ! grep -q 'localStorage' program-90.js
          ! grep -q 'localStorage' program-90-widget.js
          ! grep -q 'localStorage' program-90-advanced.js
          ! grep -q 'localStorage' roleplay-partners.js
      - name: Install browser QA
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Full Program 90 day E2E
        run: npx playwright test tests/program-90.spec.js tests/program-90-point7.spec.js tests/program-90-goals-reset.spec.js tests/program-90-operational-days.spec.js tests/program-90-phases.spec.js tests/roleplay-partners.spec.js --project=desktop-chromium
      - name: CRM unified regression
        run: npx playwright test tests/crm-full-e2e.spec.js tests/crm-excel-import.spec.js --project=desktop-chromium
      - name: Existing production modules regression
        run: npx playwright test tests/market-preview.spec.js tests/just-listed-sold.spec.js --project=desktop-chromium
      - name: Published GitHub Pages smoke
        run: |
          set -e
          base='https://josephsocialmedia2-spec.github.io/launcher-dashboard'
          deployed=0
          for i in $(seq 1 72); do
            if curl -fsSL "$base/index.html?qa=$RANDOM" -o /tmp/i \
              && curl -fsSL "$base/program-90.html?qa=$RANDOM" -o /tmp/p90 \
              && curl -fsSL "$base/program-90.js?qa=$RANDOM" -o /tmp/p90js \
              && curl -fsSL "$base/program-90-widget.js?qa=$RANDOM" -o /tmp/p90w \
              && curl -fsSL "$base/program-90-advanced.js?qa=$RANDOM" -o /tmp/p90a \
              && curl -fsSL "$base/program-90-phase-widget.js?qa=$RANDOM" -o /tmp/p90pw \
              && curl -fsSL "$base/roleplay-partners.js?qa=$RANDOM" -o /tmp/rpp \
              && curl -fsSL "$base/roleplay-realistic.js?qa=$RANDOM" -o /tmp/rpr \
              && grep -q 'id="program90Widget"' /tmp/i \
              && grep -q 'program-90-advanced.js?v=20260913-p90-adv2' /tmp/p90 \
              && grep -q 'program-90-phase-widget.js?v=20260913-p90-adv2' /tmp/i \
              && grep -q 'CHIUDI GIORNATA' /tmp/p90 \
              && grep -q 'F1_90_DAY_ATTEMPT' /tmp/p90js \
              && grep -q 'operational_weekdays' /tmp/p90js \
              && grep -q 'GIORNATA NON OPERATIVA' /tmp/p90js \
              && grep -q 'APPUNTAMENTO_SVOLTO' /tmp/p90js \
              && grep -q 'CONTRATTO_FIRMATO' /tmp/p90js \
              && grep -q 'GRANDE OBIETTIVO' /tmp/p90w \
              && grep -q 'F1_18_MONTH_PLAN' /tmp/p90a \
              && grep -q 'APPUNTAMENTI SETTIMANA' /tmp/p90a \
              && grep -q 'p90ScriptToday' /tmp/p90pw \
              && grep -q 'F1_ROLEPLAY_PARTNER_UPSERT' /tmp/rpp \
              && grep -q 'SIMULATORE ROLE-PLAY REALISTICO' /tmp/rpr; then
              deployed=1
              break
            fi
            sleep 5
          done
          test "$deployed" = 1
          npx playwright test tests/program-90-live.spec.js --project=desktop-chromium