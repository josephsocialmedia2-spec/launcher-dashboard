name: F1 Relationship Dashboard Patch

on:
  push:
    paths:
      - '.github/workflows/f1-relationship-dashboard-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add relationship engine card and clean temp file
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<div class="section-title ops"><h2>CONTROLLO F1</h2></div>\n<section class="grid">\n'
          card='''<div class="section-title ops"><h2>CONTROLLO F1</h2></div>\n<section class="grid">\n<a class="card primary" href="clienti-passati-coi.html"><span class="status">2° MOTORE</span><div class="icon"><i class="fa-solid fa-people-group"></i></div><h3>Clienti Passati + Centro di Influenza</h3><p>5–7 contatti al giorno dal CRM unificato, script di riattivazione, esiti, task, referenze e crescita progressiva fino a 20.</p><span class="go">APRI CONTATTI DEL GIORNO →</span></a>\n'''
          if 'href="clienti-passati-coi.html"' not in s:
              if marker not in s:
                  raise SystemExit('Dashboard marker not found')
              s=s.replace(marker,card,1)
              p.write_text(s,encoding='utf-8')
          Path('tmp-f1-test.txt').unlink(missing_ok=True)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git add -u tmp-f1-test.txt || true
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Add past clients and COI acquisition engine card'
          git push
