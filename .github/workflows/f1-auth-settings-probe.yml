name: F1 Auth Settings Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f1-auth-settings-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase Auth public settings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'apikey: sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu' \
            'https://nqnmlsmeiynxbdojeyjt.supabase.co/auth/v1/settings' \
            | jq '{disable_signup, mailer_autoconfirm, external_email_enabled, external_phone_enabled}'
