name: Patch Market Preview dashboard
on:
  push:
    paths:
      - '.github/workflows/patch-market-preview-dashboard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''.mp-widget{border:2px solid #50c9e8;border-radius:18px;padding:18px;background:linear-gradient(145deg,#0d1619,#102229);margin-bottom:24px}.mp-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.mp-widget h2{margin:4px 0 5px;font-size:24px}.mp-widget p{margin:0;color:#bed5db;font-size:11px;line-height:1.5}.mp-open{display:inline-flex;padding:11px 13px;border-radius:9px;background:#50c9e8;color:#071116;text-decoration:none;font-size:10px;font-weight:900;white-space:nowrap}.mp-bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.mp-label{color:#50c9e8;font-size:10px;font-weight:900;margin-bottom:5px}.mp-progress{height:11px;border:1px solid #34515a;border-radius:999px;background:#0a1114;overflow:hidden}.mp-progress>div{height:100%;width:0;background:linear-gradient(90deg,#50c9e8,#39f28a);transition:.25s}.mp-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.mp-stats div{padding:8px;text-align:center;border:1px solid #2b444b;border-radius:10px;background:#0d1416}.mp-stats b{display:block;color:#39f28a;font-size:20px}.mp-stats span{display:block;color:#aeb7b0;font-size:7px;font-weight:900}@media(max-width:700px){.mp-top{display:block}.mp-open{margin-top:10px;width:100%;justify-content:center}.mp-bars{grid-template-columns:1fr}.mp-stats{grid-template-columns:1fr 1fr}.mp-stats div:last-child{grid-column:1/-1}}'''
          if '.mp-widget{' not in s:
              s=s.replace('</style>',css+'\n</style>')
          block='''<section class="mp-widget" id="marketPreviewWidget">\n  <div class="mp-top"><div><div class="ey">ATTIVITÀ QUOTIDIANA · 2 ORE</div><h2>MARKET PREVIEW</h2><p id="mpStage">Caricamento piano mercato…</p></div><a class="mp-open" href="market-preview.html">APRI MARKET PREVIEW →</a></div>\n  <div class="mp-bars"><div><div class="mp-label" id="mpVisionText">IMMOBILI VISIONATI OGGI: 0 / 5–7</div><div class="mp-progress"><div id="mpVisionBar"></div></div></div><div><div class="mp-label" id="mpTimeText">TEMPO PREVIEW: 0 / 120 MIN</div><div class="mp-progress"><div id="mpTimeBar"></div></div></div></div>\n  <div class="mp-stats"><div><b id="mpVisioned">0</b><span>VISIONATI</span></div><div><b id="mpTime">0</b><span>MINUTI</span></div><div><b id="mpPrivate">0</b><span>PRIVATI</span></div><div><b id="mpExpired">0</b><span>POSSIBILI SCADUTI</span></div><div><b id="mpOpp">0</b><span>OPPORTUNITÀ CRM</span></div></div>\n</section>\n'''
          if 'id="marketPreviewWidget"' not in s:
              s=s.replace('<section class="jls-widget" id="jlsWidget">',block+'<section class="jls-widget" id="jlsWidget">')
          tag='<script src="market-preview-widget.js?v=20260913-mp1"></script>\n'
          if 'market-preview-widget.js' not in s:
              s=s.replace('<script src="just-listed-sold-widget.js?v=20260913-w2"></script>',tag+'<script src="just-listed-sold-widget.js?v=20260913-w2"></script>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'id="marketPreviewWidget"' index.html
          grep -q 'IMMOBILI VISIONATI OGGI: 0 / 5–7' index.html
          grep -q 'market-preview-widget.js?v=20260913-mp1' index.html
      - name: Commit dashboard
        run: |
          git config user.name 'f1-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Market Preview dashboard card'
          git push