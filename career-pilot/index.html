<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerPilot Retail</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:24px}.top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.title{font-size:32px;font-weight:800;margin:0}.sub{color:#667085;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin:20px 0}.stat,.job{background:white;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.stat{padding:14px}.stat b{display:block;font-size:23px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.controls input,.controls select{padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:white;min-width:180px}.jobs{display:grid;gap:12px}.job{padding:18px}.jobHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.company{font-weight:800}.job h2{font-size:19px;margin:4px 0 6px}.meta{color:#667085;font-size:14px}.score{font-weight:800;border:1px solid #d0d5dd;border-radius:999px;padding:7px 10px;white-space:nowrap}.reasons{font-size:13px;color:#475467;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:700;background:#17202a;color:white}.btn.secondary{background:white;color:#17202a;border:1px solid #d0d5dd}.empty{padding:28px;text-align:center;color:#667085;background:white;border-radius:14px}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.title{font-size:26px}}</style></head><body><main><div class="top"><div><h1 class="title">CareerPilot Retail</h1><div class="sub">Radar offerte GDO · curriculum standard ATS-friendly · candidatura dal canale ufficiale</div></div><div id="updated" class="sub">Caricamento…</div></div><div class="stats"><div class="stat"><span>Offerte archiviate</span><b id="count">0</b></div><div class="stat"><span>Nuove ultimo scan</span><b id="new">0</b></div><div class="stat"><span>Fonti controllate</span><b id="sources">0</b></div><div class="stat"><span>Pagine analizzate</span><b id="pages">0</b></div></div><div class="controls"><input id="q" placeholder="Cerca azienda, ruolo, comune"><select id="min"><option value="0">Tutti gli score</option><option value="55">Score ≥ 55</option><option value="70">Score ≥ 70</option><option value="85">Score ≥ 85</option></select></div><div id="jobs" class="jobs"></div></main><script>let all=[];const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const q=document.querySelector('#q').value.toLowerCase(),min=+document.querySelector('#min').value;const rows=all.filter(j=>(j.score||0)>=min&&[j.company,j.title,j.location].join(' ').toLowerCase().includes(q));const root=document.querySelector('#jobs');if(!rows.length){root.innerHTML='<div class="empty">Nessuna offerta corrispondente ai filtri.</div>';return}root.innerHTML=rows.map(j=>`<article class="job"><div class="jobHead"><div><div class="company">${esc(j.company)}</div><h2>${esc(j.title)}</h2><div class="meta">${esc(j.location||'Località non rilevata')} · ${esc(j.date_posted||'data non indicata')}</div></div><div class="score">${j.score||0}/100</div></div><div class="reasons">${esc((j.reasons||[]).join(' · '))}</div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${esc(j.url)}">Apri candidatura</a></div></article>`).join('')}fetch('./data/jobs.json?ts='+Date.now()).then(r=>r.json()).then(d=>{all=d.jobs||[];document.querySelector('#updated').textContent=d.updated_at?'Aggiornato: '+new Date(d.updated_at).toLocaleString('it-IT'):'Non ancora eseguito';document.querySelector('#count').textContent=all.length;document.querySelector('#new').textContent=d.stats?.new||0;document.querySelector('#sources').textContent=d.stats?.sources||0;document.querySelector('#pages').textContent=d.stats?.detail_pages||0;render()}).catch(()=>document.querySelector('#jobs').innerHTML='<div class="empty">Dati radar non disponibili.</div>');document.querySelector('#q').addEventListener('input',render);document.querySelector('#min').addEventListener('change',render);</script></body></html>
