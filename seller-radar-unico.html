<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070907">
<title>F1 — Seller Radar</title>
<style>
:root{--p:#101510;--p2:#151c16;--line:#2a342c;--txt:#fff;--mut:#aeb7b0;--g:#39f28a;--gold:#f4c95d;--blue:#74c8ff;--red:#ff7979}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#050705,#0b110c);color:var(--txt);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 12px 300px}.ey{color:var(--g);font-size:10px;font-weight:900;letter-spacing:.15em}.hero,.panel,.listing{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.hero{border:2px solid var(--g)}.hero h1{margin:0;font-size:clamp(30px,7vw,52px)}.communeSelect{margin-top:12px;width:100%;max-width:620px;background:#07100a;color:#fff;border:1px solid #35513d;border-radius:12px;padding:14px 15px;font-size:20px;font-weight:900}.meta{color:var(--mut);font-size:12px;line-height:1.5}.listingTop{display:flex;justify-content:space-between;gap:12px}.listingTitle{font-size:19px;font-weight:900;line-height:1.3}.source{color:var(--blue);font-size:11px;font-weight:900;margin-top:4px}.address{font-size:12px;margin-top:6px}.price{font-size:22px;font-weight:900;color:var(--g);white-space:nowrap}.actions,.streets{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:9px;background:var(--g);color:#07100a;text-decoration:none;border:0;font-size:10px;font-weight:900;cursor:pointer}.btn.alt{background:#182019;color:#fff;border:1px solid var(--line)}.micro{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.micro summary{cursor:pointer;color:var(--g);font-size:10px;font-weight:900}.street{font-size:9px;border:1px solid #405044;border-radius:999px;padding:4px 6px}.paste{width:100%;min-height:95px;background:#0b100c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:11px}.empty{color:var(--mut);padding:18px;text-align:center}.bottomSheet{position:fixed;left:0;right:0;bottom:0;background:#071009f8;border-top:2px solid var(--g);z-index:100;padding:8px 10px 10px;box-shadow:0 -10px 40px #0009}.sheetTop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.sheetTitle{font-size:12px;font-weight:900;color:var(--g)}.sheetWrap{overflow:auto;max-height:235px;border:1px solid #35513d;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1500px;background:#0d130e}th,td{border-right:1px solid #2b372e;border-bottom:1px solid #2b372e;padding:8px 9px;text-align:left;font-size:10px;white-space:nowrap}th{position:sticky;top:0;background:#152018;color:var(--g);z-index:2;font-size:9px}td{color:#e8eee9}.status{color:var(--g);font-weight:900}.sheetBtn,.editBtn,.saveBtn,.cancelBtn{padding:7px 9px;border-radius:8px;font-size:9px;font-weight:900;cursor:pointer}.sheetBtn{background:#182019;border:1px solid #35513d;color:#fff}.editBtn{background:#182019;border:1px solid var(--blue);color:var(--blue)}.saveBtn{background:var(--g);border:1px solid var(--g);color:#07100a}.cancelBtn{background:#241616;border:1px solid #6b3434;color:#ffb0b0}.rowInput,.rowSelect{width:100%;min-width:95px;background:#07100a;color:#fff;border:1px solid #35513d;border-radius:6px;padding:6px;font-size:10px}.notesCell .rowInput{min-width:220px}.actionCell{min-width:145px}@media(max-width:800px){.listingTop{display:block}.price{margin-top:8px}.communeSelect{font-size:17px}.wrap{padding-bottom:330px}}
</style>
<script defer src="f1-acquisition-core.js"></script>
</head>
<body><main class="wrap">
<div class="ey">F1 IMMOBILIARE · SELLER RADAR</div>
<section class="hero"><h1>IN VENDITA A</h1><select id="workCommune" class="communeSelect"></select><p class="meta" id="areaInfo">Caricamento…</p></section>
<section id="list"><div class="empty">Caricamento annunci…</div></section>
</main>
<div class="bottomSheet"><div class="sheetTop"><div class="sheetTitle">ARCHIVIO CONTATTI TERRITORIALI · SEMPRE VISIBILE</div><div><button class="sheetBtn" onclick="addRow()">+ NUOVA RIGA</button><button class="sheetBtn" onclick="exportCsv()">ESPORTA EXCEL</button></div></div><div class="sheetWrap"><table id="contactsTable"><thead><tr><th>COMUNE</th><th>NOME</th><th>COGNOME</th><th>VIA</th><th>CIVICO</th><th>TELEFONO</th><th>EMAIL</th><th>FACEBOOK</th><th>INSTAGRAM</th><th>TIKTOK</th><th>YOUTUBE</th><th>FONTE</th><th>NOTE</th><th>STATO</th><th>AZIONI</th></tr></thead><tbody id="contactBody"></tbody></table></div></div>
<script>
let ROWS=[],AREA=[],TERRITORY={},INTEL={signals:[],commune_cache:[]};const $=id=>document.getElementById(id),STORE='f1_territory_contacts_v1';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function key(c,v){return norm(c)+'|'+norm(v)}
function hav(a,b){const R=6371.0088,to=x=>x*Math.PI/180,dlat=to(b.lat-a.lat),dlon=to(b.lon-a.lon),p1=to(a.lat),p2=to(b.lat);const h=Math.sin(dlat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function intelIndex(){const m=new Map();for(const s of INTEL.signals||[])m.set(key(s.comune,s.indirizzo),s);return m}
function findCenter(name){const n=norm(name),x=(INTEL.commune_cache||[]).find(c=>norm(c.comune)===n&&c.geocode);return x&&x.geocode}
function numericPrice(v){const n=String(v||'').replace(/[^0-9]/g,'');return n?Number(n):0}
function formatPrice(v){const n=numericPrice(v);return n?new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n):'Prezzo non indicato'}
function controlUrl(t){const comune=String(t.comune||'').trim(),via=String(t.via||'').trim(),titolo=String(t.immobile||'').trim();const viaValida=via&&!/da verificare|indirizzo|n\.d\.|non disponibile/i.test(via);const query=viaValida?`${via} ${comune} annuncio immobiliare`:`${titolo||'immobile in vendita'} ${comune} annuncio immobiliare`;return 'https://www.google.com/search?q='+encodeURIComponent(query)}
function pbQuery(t){const comune=String(t.comune||'').trim(),via=String(t.via||'').trim();return `${comune} (TO) ${via}`.replace(/\s+/g,' ').trim()}
function openPagineBianche(t){const q=pbQuery(t);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(q).catch(()=>{});window.open('https://www.paginebianche.it/ricerca-da-indirizzo','_blank','noopener')}
function applyArea(){const name=$('workCommune').value,center=findCenter(name),idx=intelIndex(),radius=Number(INTEL.reference_span&&INTEL.reference_span.distance_km)||0;if(!center){AREA=ROWS.filter(r=>norm(r.comune)===norm(name));$('areaInfo').textContent=`${AREA.length} annunci attribuiti a ${name}.`;render();return}AREA=ROWS.filter(r=>{const s=idx.get(key(r.comune,r.via));if(!s||!s.geocode)return norm(r.comune)===norm(name);return hav(center,s.geocode)<=radius});$('areaInfo').textContent=`${AREA.length} annunci nell'area di ${name}.`;render()}
function cleanPaste(id,comune,via){const ta=$(id),lines=ta.value.split(/\n+/).map(x=>x.trim()).filter(Boolean),seen=[];for(const l of lines)if(!seen.some(x=>norm(x)===norm(l)))seen.push(l);ta.value=seen.join('\n');if(seen.length){addContact({comune,via,nome:'',cognome:'',civico:'',telefono:'',email:'',facebook:'',instagram:'',tiktok:'',youtube:'',fonte:'Dati incollati',note:seen.slice(0,4).join(' | '),stato:'DA LAVORARE'})}}
function render(){const idx=intelIndex();$('list').innerHTML=AREA.length?AREA.map((t,i)=>{const s=idx.get(key(t.comune,t.via)),streets=(s&&s.streets)||[],q=(s&&s.queries)||{},sourceUrl=String(t.source_url||''),title=t.immobile||`${t.via||'Immobile'} · ${t.comune||''}`,pid='paste_'+i,checkUrl=controlUrl(t),pb=pbQuery(t);return `<article class="listing"><div class="listingTop"><div><div class="ey">${i+1}/${AREA.length}</div><div class="source">${esc(t.source||'Fonte non indicata')}</div><div class="listingTitle">${esc(title)}</div><div class="address">${esc([t.via,t.comune].filter(Boolean).join(', '))}</div></div><div class="price">${esc(formatPrice(t.prezzo))}</div></div><div class="actions">${sourceUrl?`<a class="btn" target="_blank" rel="noopener" href="${esc(sourceUrl)}">APRI ANNUNCIO</a>`:''}<a class="btn alt" target="_blank" rel="noopener" href="${esc(checkUrl)}">CONTROLLA</a><button class="btn alt" onclick='openPagineBianche(${JSON.stringify({comune:t.comune||'',via:t.via||''})})'>PAGINE BIANCHE</button>${q.pagine_gialle?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(q.pagine_gialle)}">PAGINE GIALLE</a>`:''}</div><div class="meta">PAGINE BIANCHE: COMPILA ${esc(pb)}</div>${s?`<details class="micro"><summary>VIE VICINE E DATI TERRITORIALI</summary><div class="streets">${streets.slice(0,40).map(v=>`<span class="street">${esc(v.street||v)}</span>`).join('')}</div><p class="meta">Copia i dati dalla ricerca e incollali qui. Il testo viene ripulito e puoi salvarlo nell'archivio sottostante.</p><textarea id="${pid}" class="paste" placeholder="CTRL+A → COPIA → INCOLLA QUI"></textarea><div class="actions"><button class="btn" onclick="cleanPaste('${pid}','${esc(t.comune)}','${esc(t.via)}')">PULISCI + SALVA</button></div></details>`:''}</article>`}).join(''):'<div class="empty">Nessun annuncio trovato nell’area selezionata.</div>'}
function contacts(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}
function saveContacts(a){localStorage.setItem(STORE,JSON.stringify(a));renderContacts()}
function addContact(x){const a=contacts();a.unshift(x);saveContacts(a)}
function addRow(){addContact({comune:$('workCommune').value||'',nome:'',cognome:'',via:'',civico:'',telefono:'',email:'',facebook:'',instagram:'',tiktok:'',youtube:'',fonte:'',note:'',stato:'DA LAVORARE'});setTimeout(()=>editRow(document.querySelector('#contactBody .editBtn')),50)}
const F=['comune','nome','cognome','via','civico','telefono','email','facebook','instagram','tiktok','youtube','fonte','note','stato'];
function renderContacts(){const a=contacts();$('contactBody').innerHTML=a.map((r,i)=>`<tr data-i="${i}">${F.map((f,j)=>`<td class="${f==='note'?'notesCell ':''}${f==='stato'?'status':''}">${esc(r[f]||'—')}</td>`).join('')}<td class="actionCell"><button class="editBtn" onclick="editRow(this)">MODIFICA</button></td></tr>`).join('')}
function editRow(btn){const row=btn.closest('tr'),i=+row.dataset.i,a=contacts(),r=a[i];F.forEach((f,j)=>{row.cells[j].innerHTML=f==='stato'?`<select class="rowSelect"><option>DA LAVORARE</option><option>VERIFICATO</option><option>CONTATTATO</option><option>DA RICHIAMARE</option><option>ARCHIVIATO</option></select>`:`<input class="rowInput" value="${esc(r[f]||'')}">`;if(f==='stato')row.cells[j].querySelector('select').value=r[f]||'DA LAVORARE'});row.cells[14].innerHTML='<button class="saveBtn" onclick="saveRow(this)">SALVA</button> <button class="cancelBtn" onclick="renderContacts()">ANNULLA</button>'}
function saveRow(btn){const row=btn.closest('tr'),i=+row.dataset.i,a=contacts();F.forEach((f,j)=>a[i][f]=row.cells[j].querySelector('input,select').value.trim());saveContacts(a)}
function exportCsv(){const a=contacts(),rows=[F.map(x=>x.toUpperCase()),...a.map(r=>F.map(f=>r[f]||''))],csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='F1_Archivio_Contatti_Territoriali.csv';x.click();URL.revokeObjectURL(u)}
async function load(){renderContacts();try{const [cfg,feed,intel]=await Promise.all([F1AcquisitionCore.loadConfig(),F1AcquisitionCore.loadPublicFeed(),fetch('data/neighborhood_intelligence.json',{cache:'no-store'}).then(r=>r.json())]);TERRITORY=cfg.territory;ROWS=feed.tasks||[];INTEL=intel||INTEL;const names=[...(TERRITORY.sinistra||[]),...(TERRITORY.destra||[])];$('workCommune').innerHTML=[...new Set(names)].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('workCommune').value=TERRITORY.reference_hub||names[0]||'';applyArea()}catch(e){$('list').innerHTML='<div class="empty">Seller Radar non disponibile: '+esc(e.message)+'</div>'}}
$('workCommune').addEventListener('change',applyArea);window.addEventListener('load',load);
</script></body></html>
