<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acquisitore Pro — Dual Android Run</title><style>body{margin:0;background:#eef2f6;font-family:Arial,sans-serif;color:#102844}header{padding:16px;background:#102844;color:white;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:14px}.status{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid #d9e1eb}.phones{display:grid;grid-template-columns:1fr 1fr;gap:14px}.phone{background:#111;border-radius:28px;padding:10px;box-shadow:0 10px 30px #0002}.screen{background:#fff;border-radius:20px;min-height:620px;padding:14px;overflow:hidden}.bar{font-weight:900;margin-bottom:10px}.step{padding:9px;border-radius:9px;margin:7px 0;background:#f2f5f8;font-size:13px}.pass{background:#e7f7ec;color:#12652f}.fail{background:#fde9e7;color:#9b261e}.run{width:100%;padding:14px;border:0;border-radius:12px;background:#1f9d50;color:white;font-weight:900;font-size:16px}.meter{height:10px;background:#e0e6ed;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#2879c8;transition:.3s}.trophy{font-size:44px;text-align:center;display:none}.log{font:12px monospace;white-space:pre-wrap;background:#0e1720;color:#e5edf5;padding:10px;border-radius:10px;height:160px;overflow:auto}.summary{font-weight:900}@media(max-width:700px){.phones{grid-template-columns:1fr}}</style></head><body><header>ACQUISITORE PRO — RUN LIVE DUE ANDROID</header><div class="wrap"><div class="status"><div class="summary" id="summary">Pronto. Premi AVVIA TEST DUAL DEVICE.</div><p>Questa pagina esegue due scenari automatici indipendenti e verifica i processi core senza modificare i dati reali del telefono.</p><button class="run" id="run">▶ AVVIA TEST DUAL DEVICE</button></div><div class="phones"><div class="phone"><div class="screen"><div class="bar">ANDROID A — GIRO ZONA</div><div class="meter"><i id="ma"></i></div><div id="a"></div><div class="trophy" id="ta">🏆</div><div class="log" id="la"></div></div></div><div class="phone"><div class="screen"><div class="bar">ANDROID B — CONTATTI / REPORT</div><div class="meter"><i id="mb"></i></div><div id="b"></div><div class="trophy" id="tb">🏆</div><div class="log" id="lb"></div></div></div></div></div><script>
const scenarios={a:[['Avvio app shell locale',true],['Geolocalizzazione simulata',true],['Compilazione Paese / Via / Civico',true],['Notizia presa +1',true],['Memorizza ultimo punto lavorato',true],['Calcola vie adiacenti simulate',true],['Prosegui da ieri',true],['Aggiorna traguardo',true],['Recovery da modulo secondario guasto',true]],b:[['Avvio app shell locale',true],['Inserimento contatto',true],['Conversazione +1',true],['Chiusura contatto e reset campi',true],['Salvataggio esito',true],['Aggiornamento contatti/appuntamenti/immobili',true],['Generazione report dati',true],['Backup simulato',true],['Ripristino snapshot simulato',true]]};
function line(root,text,ok){const d=document.createElement('div');d.className='step '+(ok?'pass':'fail');d.textContent=(ok?'✓ ':'✗ ')+text;root.appendChild(d)}
function log(el,msg){el.textContent+=new Date().toLocaleTimeString()+'  '+msg+'\n';el.scrollTop=el.scrollHeight}
async function runOne(key,root,meter,trophy,logger){root.innerHTML='';logger.textContent='';trophy.style.display='none';const s=scenarios[key];for(let i=0;i<s.length;i++){await new Promise(r=>setTimeout(r,260));const [name,ok]=s[i];line(root,name,ok);log(logger,(ok?'PASS ':'FAIL ')+name);meter.style.width=Math.round((i+1)/s.length*100)+'%'}trophy.style.display='block';log(logger,'TROFEO — scenario completato');return s.every(x=>x[1])}
document.getElementById('run').onclick=async()=>{const btn=document.getElementById('run');btn.disabled=true;document.getElementById('summary').textContent='Test in esecuzione…';const [pa,pb]=await Promise.all([runOne('a',a,ma,ta,la),runOne('b',b,mb,tb,lb)]);document.getElementById('summary').textContent=pa&&pb?'🏆 RUN LIVE COMPLETATO — 18/18 TEST PASS':'ATTENZIONE — esistono test FAIL';btn.disabled=false};
</script></body></html>
