<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102844"><title>Ripristino Acquisitore Pro</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;color:#11233b;font-family:Arial,sans-serif;padding:24px;text-align:center}.box{max-width:460px;background:#fff;border:1px solid #d9e1eb;border-radius:18px;padding:24px}h1{margin:0 0 12px;color:#102844;font-size:24px}p{line-height:1.5}.ok{color:#1f9d50;font-weight:900}</style></head><body><div class="box"><h1>Acquisitore Pro</h1><p id="msg">Pulizia vecchie versioni in corso…</p><p>I contatti, le metriche, gli obiettivi e le vie salvate nel telefono non vengono cancellati.</p></div><script>(async()=>{const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/launcher-dashboard/acquisitore-pro/'))await r.unregister();}}if('caches'in window){const keys=await caches.keys();for(const k of keys){if(k.startsWith('acquisitore-pro-'))await caches.delete(k);}}msg.className='ok';msg.textContent='Pulizia completata. Apro Acquisitore Pro v22…';setTimeout(()=>location.replace('./index.html?v=22&fresh=1'),650);}catch(e){msg.textContent='Apro comunque Acquisitore Pro v22…';setTimeout(()=>location.replace('./index.html?v=22&fresh=1'),850);}})();</script></body></html>
