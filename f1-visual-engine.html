<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 Visual Engine</title><style>:root{--bg:#07131d;--p:#0d2130;--c:#42d7ff;--t:#eefaff;--m:#8eb0c0;--w:#ffc857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#123b54,#07131d 45%);color:var(--t);font-family:Inter,Arial}header{padding:18px 24px;border-bottom:1px solid #19455d;background:#081923dd}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--c)}main{max-width:1180px;margin:auto;padding:24px}.hero,.panel{background:#0b1e2bd9;border:1px solid #1b536d;border-radius:18px;padding:22px;margin-bottom:18px}.hero h1{margin:8px 0}.hero p,small{color:var(--m)}.badge{display:inline-block;padding:6px 9px;border:1px solid #2786a9;border-radius:999px;color:var(--c);font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-size:11px;font-weight:900;color:#9dd8eb}input,select,textarea{background:#071720;color:#fff;border:1px solid #28566a;border-radius:10px;padding:12px}textarea{min-height:100px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,a.btn{border:1px solid #2d8eb0;background:#0d3142;color:#fff;border-radius:10px;padding:12px 16px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#087ba4!important}.status,pre,.job{background:#071720;border:1px solid #23495a;border-radius:10px;padding:12px}.warn{color:var(--w)}pre{white-space:pre-wrap;max-height:360px;overflow:auto}.jobs{display:grid;gap:8px}.job{display:grid;grid-template-columns:1fr auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="brand">F1 <b>IMMOBILIARE</b> / VISUAL ENGINE</div></header><main><section class="hero"><span class="badge">ZERO COST GUARD</span> <span class="badge">REMOTE-FIRST</span><h1>F1 Visual Engine</h1><p>Router visuale immobiliare. Nessun passaggio automatico a servizi a pagamento.</p></section><section class="panel"><h2>Nuovo job</h2><div class="grid"><div class="field"><label>COMUNE</label><select id="comune"></select></div><div class="field"><label>MODALITÀ</label><select id="mode"><option>TEXT_TO_IMAGE</option><option>IMAGE_TO_IMAGE</option><option>PHOTO_ENHANCEMENT</option><option>VIRTUAL_STAGING</option><option>INPAINTING</option><option>EXTERIOR_ENHANCEMENT</option><option>UPSCALE</option></select></div><div class="field"><label>TIPOLOGIA</label><input id="tipo" value="appartamento"></div><div class="field"><label>EPOCA</label><input id="epoca" placeholder="es. anni 80"></div><div class="field"><label>STATO</label><select id="stato"><option>abitabile</option><option>originale</option><option>ristrutturato</option><option>nuovo</option></select></div><div class="field"><label>FORMATO</label><select id="formato"><option>4:5</option><option>1:1</option><option>9:16</option><option>16:9</option></select></div><div class="field full"><label>SCENA / VINCOLI</label><textarea id="note"></textarea></div></div><div class="actions"><button id="build">GENERA MASTER PROMPT</button><button class="primary" id="generate">GENERA IMMAGINE</button><a class="btn" href="ricerca-territoriale.html">TORNA A F1</a></div></section><section class="panel"><h2>Stato motore</h2><div id="engineStatus" class="status">Verifica provider…</div></section><section class="panel"><h2>Master prompt</h2><pre id="prompt">—</pre></section><section class="panel"><h2>Coda job</h2><div id="jobs" class="jobs"></div></section></main><script src="f1-visual-engine.js?v=20260928a"></script></body></html>
