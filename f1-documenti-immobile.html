<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 · Registro documentale</title>
<style>:root{--b:#070907;--p:#101510;--l:#29352d;--g:#39f28a;--m:#aeb7b0}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#fff;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:20px 14px 80px}.ey{color:var(--g);font-size:10px;font-weight:900;letter-spacing:.14em}.meta{color:var(--m);font-size:11px}.p{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px;margin:12px 0}.i{padding:9px;border:1px solid var(--l);border-radius:8px;background:#0b100c;color:#fff}.row{display:grid;grid-template-columns:1.5fr .8fr 1fr 1fr;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--l)}.btn{padding:10px 12px;border:1px solid var(--l);border-radius:9px;background:#172019;color:#fff;text-decoration:none;font-weight:900;font-size:10px;cursor:pointer}.pri{background:var(--g);color:#07100a}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="ey">F1 · IMMOBILE → DUE DILIGENCE</div><h1>REGISTRO DOCUMENTALE</h1><p class="meta">La checklist diventa persistente: per ogni immobile memorizza stato, file/link, scadenza e note. “Ricevuto” non significa automaticamente “conforme”: la verifica resta separata.</p>
<section class="p"><select id="property" class="i" style="width:100%"><option>Caricamento…</option></select><div id="rows"></div><p><button id="save" class="btn pri">SALVA REGISTRO</button> <span id="status" class="meta"></span></p></section><a class="btn" href="oggi.html">← OGGI</a> <a class="btn" href="documenti-vendita.html">CHECKLIST GUIDA</a></main>
<script>
(()=>{'use strict';const U='https://nqnmlsmeiynxbdojeyjt.supabase.co',K='sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu',S='f1SupabaseSession',$=x=>document.getElementById(x),types=['DOCUMENTO_IDENTITA','CODICE_FISCALE','STATO_CIVILE_REGIME','PROCURA','ATTO_PROVENIENZA_ROGITO','SUCCESSIONE_DONAZIONE','VISURA_CATASTALE','PLANIMETRIA_CATASTALE','TITOLI_EDILIZI','SANATORIE','AGIBILITA','APE','SPESE_CONDOMINIALI','VERBALI_CONDOMINIO','MUTUO_IPOTECHE','CONTRATTO_LOCAZIONE','PERTINENZE'];
let user=null,existing=[];const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function ss(){try{return JSON.parse(localStorage.getItem(S)||'null')}catch{return null}}async function tok(){let s=ss();if(!s)throw Error('ACCESSO F1 NECESSARIO');user=s.user;return s.access_token}async function api(p,o={}){let t=await tok(),r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:o.prefer||'return=representation'}});if(!r.ok)throw Error('HTTP '+r.status+' '+await r.text());let z=await r.text();return z?JSON.parse(z):[]}
function render(){let m=new Map(existing.map(x=>[x.document_type,x]));$('rows').innerHTML=types.map((t,i)=>{let d=m.get(t)||{};return '<div class="row" data-type="'+t+'" data-id="'+(d.document_id||'')+'"><b>'+t.replaceAll('_',' ')+'</b><select class="i status">'+['MISSING','REQUESTED','RECEIVED','VERIFIED','EXPIRED','NOT_APPLICABLE'].map(s=>'<option '+(d.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select><input class="i url" placeholder="Link/file" value="'+esc(d.file_url||'')+'"><input class="i exp" type="date" value="'+esc(d.expires_at||'')+'"></div>'}).join('')}
async function loadProps(){let p=await api('properties?deleted=eq.false&select=property_id,comune,via,civico&order=updated_at.desc&limit=500');$('property').innerHTML='<option value="">Seleziona immobile…</option>'+p.map(x=>'<option value="'+esc(x.property_id)+'">'+esc([x.comune,x.via,x.civico].filter(Boolean).join(' · '))+'</option>').join('');render()}
$('property').onchange=async()=>{let id=$('property').value;if(!id){existing=[];render();return}existing=await api('f1_property_documents?property_id=eq.'+encodeURIComponent(id)+'&select=*');render()};
$('save').onclick=async()=>{try{let pid=$('property').value;if(!pid)throw Error('Seleziona immobile');for(const r of document.querySelectorAll('.row')){let id=r.dataset.id,b={user_id:user?.id||ss()?.user?.id,property_id:pid,document_type:r.dataset.type,status:r.querySelector('.status').value,file_url:r.querySelector('.url').value.trim(),expires_at:r.querySelector('.exp').value||null};if(id)await api('f1_property_documents?document_id=eq.'+id,{method:'PATCH',body:JSON.stringify(b)});else if(b.status!=='MISSING'||b.file_url||b.expires_at)await api('f1_property_documents',{method:'POST',body:JSON.stringify(b)})}$('status').textContent='Registro salvato.';$('property').dispatchEvent(new Event('change'))}catch(e){$('status').textContent=e.message}};loadProps().catch(e=>$('status').textContent=e.message)})();
</script></body></html>
