<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGC Avatar Studio</title>
<style>:root{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#111827;background:#f5f7fb}body{margin:0}.top{background:#111827;color:white;padding:18px 24px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:32px auto;padding:0 18px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:22px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field input,.field textarea,.field select{border:1px solid #d1d5db;border-radius:12px;padding:12px}.field textarea{min-height:140px}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;background:#111827;color:white}.status{white-space:pre-wrap;background:#f9fafb;border-radius:12px;padding:12px}.ok{color:#047857}.err{color:#b91c1c}@media(max-width:800px){.hero{grid-template-columns:1fr}}</style></head><body><div class="top"><b>UGC AVATAR STUDIO</b><span>LOCAL FIRST · MVP</span></div><div class="wrap"><div class="hero"><section class="card"><h1>Crea un video UGC</h1><p>Carica un volto autorizzato, scrivi lo script e genera un MP4 verticale.</p><form id="f"><div class="field"><label>Avatar / foto</label><input name="avatar" type="file" accept="image/*" required></div><div class="field"><label>Velocità voce</label><select name="speed"><option value="0.9">Calma</option><option selected value="1">Naturale</option><option value="1.1">Energica</option></select></div><div class="field"><label>Script</label><textarea name="script" required></textarea></div><div class="field"><label><input type="checkbox" name="consent" value="true" required> Confermo di avere diritti e consenso necessari.</label></div><button class="btn" id="go">GENERA VIDEO</button></form><div id="result"></div></section><aside class="card"><h2>Stato sistema</h2><div id="diag" class="status">Caricamento…</div></aside></div></div><script>
async function diag(){try{let r=await fetch('/api/diagnostics');document.querySelector('#diag').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.querySelector('#diag').textContent=e}}
diag();document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();let b=document.querySelector('#go'),r=document.querySelector('#result');b.disabled=true;b.textContent='GENERAZIONE IN CORSO…';try{let fd=new FormData(e.target);let x=await fetch('/api/render',{method:'POST',body:fd});let j=await x.json();if(!x.ok)throw new Error(j.detail||'Errore');r.innerHTML='<div class="status ok">Video creato.</div><p><a href="'+j.download+'">Scarica VIDEO_UGC_001.mp4</a></p>'}catch(err){r.innerHTML='<div class="status err">'+err.message+'</div>'}finally{b.disabled=false;b.textContent='GENERA VIDEO'}})
</script></body></html>
