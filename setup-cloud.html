<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070907"><title>F1 OS · Accesso CRM</title><style>body{font-family:Arial;background:#070907;color:#fff;margin:0}.w{max-width:720px;margin:auto;padding:24px}.c{background:#101510;border:1px solid #2a342c;border-radius:16px;padding:18px;margin-top:14px}.g{color:#39f28a}.f{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border-radius:10px;border:1px solid #2a342c;background:#0d120e;color:#fff}.b{padding:12px 16px;border:0;border-radius:10px;background:#39f28a;color:#07100a;font-weight:900;cursor:pointer}.s{background:#1c261f;color:#fff;border:1px solid #2a342c}.msg{margin-top:14px;color:#aeb7b0;line-height:1.5}.ok{color:#39f28a}.small{font-size:12px;color:#aeb7b0;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="w"><a class="g" href="oggi.html">← OGGI</a><h1>COLLEGA IL CRM F1</h1><p class="small">Un solo account, un solo database. PC e smartphone usano lo stesso CRM F1.</p><div class="c"><h3>Account F1</h3><label>Email</label><input id="email" class="f" readonly value="f1immobiliaresusa@outlook.it"><label>Password</label><input id="password" class="f" type="password" autocomplete="current-password" minlength="8"><div class="row"><button class="b" id="enter">ENTRA / CREA ACCOUNT F1</button><button class="b s" id="logout">ESCI DA QUESTO DISPOSITIVO</button></div><div id="msg" class="msg"></div></div><div class="c"><h3>Stato</h3><div id="status" class="msg"></div><p><a class="g" href="oggi.html">Apri COSA FACCIO OGGI</a></p><p><a class="g" href="crm.html">Apri CRM UNICO</a></p><p><a class="g" href="https://josephsocialmedia2-spec.github.io/open-social-scheduler/f1-os-mobile/" target="_blank">Apri APP SMARTPHONE</a></p></div></main><script src="supabase-config.js"></script><script src="supabase-sync.js"></script><script>const em=F1_SUPABASE.email;async function signIn(pw){let r=await fetch(F1_SUPABASE.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:F1_SUPABASE.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});let j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.message||'Accesso non riuscito');let s={...j,expires_at:Date.now()+Number(j.expires_in||3600)*1000};F1Sync.saveSession(s);return s}async function signup(pw){let r=await fetch(F1_SUPABASE.url+'/auth/v1/signup',{method:'POST',headers:{apikey:F1_SUPABASE.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,data:{app:'F1 OS Immobiliare'}})});let j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.message||'Creazione account non riuscita');if(j.access_token){let s={...j,expires_at:Date.now()+Number(j.expires_in||3600)*1000};F1Sync.saveSession(s);return s}return null}function show(){let s=F1Sync.readSession();status.innerHTML=s?.user?'<span class="ok">CRM COLLEGATO</span><br>'+em:'CRM non collegato su questo dispositivo'}enter.onclick=async()=>{let pw=password.value;if(!pw||pw.length<8){msg.textContent='Inserisci la password F1 di almeno 8 caratteri.';return}enter.disabled=true;msg.textContent='Collego il CRM...';try{try{await signIn(pw);msg.innerHTML='<span class="ok">ACCESSO F1 ATTIVO.</span>'}catch(e){let s=await signup(pw);if(s)msg.innerHTML='<span class="ok">ACCOUNT CREATO E COLLEGATO.</span>';else msg.innerHTML='Account creato. Controlla '+em+' per la conferma email, poi torna qui e premi di nuovo ENTRA.'}password.value='';show()}catch(e){msg.textContent=e.message}finally{enter.disabled=false}};logout.onclick=()=>{F1Sync.clearSession();msg.textContent='Sessione rimossa da questo dispositivo.';show()};show();</script></body></html>
