<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>F1 OS Immobiliare</title>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel2:#1c2026;--gold:#d7b75f;--text:#f5f5f5;--muted:#a8adb5;--border:#2d3239;--ok:#54c27a;--warn:#e7b34a;--bad:#d96868;--radius:16px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090b0e,#11151a);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#0b0d10;border-right:1px solid var(--border);padding:18px;overflow:auto}.brand{font-weight:900;letter-spacing:.05em;font-size:20px}.brand span{color:var(--gold)}.sub{font-size:12px;color:var(--muted);margin-top:4px}.menu{margin-top:20px;display:flex;flex-direction:column;gap:6px}.menu button{width:100%;text-align:left;border:0;background:transparent;color:#d7dbe0;padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer}.menu button:hover,.menu button.active{background:#20242a;color:#fff}.main{padding:20px;min-width:0}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.title h1{margin:0;font-size:24px}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}.badge{padding:7px 10px;border-radius:999px;border:1px solid var(--border);background:#171b20;color:var(--muted);font-size:12px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(180deg,#171b20,#12161a);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 14px 30px rgba(0,0,0,.18)}.card h2,.card h3{margin:0 0 8px}.metric{font-size:30px;font-weight:900}.metricLabel{color:var(--muted);font-size:12px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions,.rowActions{display:flex;gap:8px;flex-wrap:wrap}.btn{appearance:none;border:1px solid #39414b;background:#20262d;color:white;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#e4c76f,#cba74c);color:#17130a;border-color:#d2ae4d}.btn.danger{background:#5c2424;border-color:#844}.btn:disabled{opacity:.45;cursor:not-allowed}.note,.small{color:var(--muted);font-size:12px}.tag{display:inline-block;border:1px solid #3a414b;padding:4px 8px;border-radius:999px;font-size:11px;background:#1b2026}.tag.gold{border-color:#6d5a26;color:#f2d47e}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #2a3037;vertical-align:top;font-size:13px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:span 2}.field label{font-size:11px;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;background:#0f1317;color:white;border:1px solid #323944;border-radius:9px;padding:9px 10px}.field textarea{min-height:90px}.empty{padding:28px;text-align:center;color:var(--muted)}.kpiList{display:flex;flex-direction:column;gap:9px}.kpiItem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #252b32}.hero{border-color:#574a2b;background:radial-gradient(circle at top right,rgba(221,183,86,.12),transparent 35%),linear-gradient(180deg,#171b20,#12161a)}.split{display:flex;justify-content:space-between;gap:15px;align-items:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modal.show{display:flex}.modalBox{max-width:980px;width:100%;max-height:92vh;overflow:auto;background:#11161b;border:1px solid #38414b;border-radius:16px;padding:18px}.toast{position:fixed;right:16px;bottom:16px;background:#20262d;border:1px solid #3b444f;padding:10px 14px;border-radius:10px;display:none;z-index:120}.toast.show{display:block}.status-ok{color:#8ee0a7}.status-bad{color:#ff9d9d}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--border)}.menu{display:grid;grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.main{padding:12px}.sidebar{padding:12px}.menu{grid-template-columns:repeat(2,1fr)}.cards,.two{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.wide{grid-column:span 1}.split,.topbar,.sectionTitle{align-items:flex-start;flex-direction:column}.title h1{font-size:21px}.metric{font-size:26px}.card{padding:13px}.menu button{font-size:12px}.btn{width:100%}.actions,.rowActions{width:100%}.actions .btn,.rowActions .btn{flex:1 1 120px}}
</style>
<script>
const VERSION='3.0';
const SELLER_URL='https://raw.githubusercontent.com/josephsocialmedia2-spec/immobili-in-zona/main/seller_radar_auto/data/giro_acquisizione_oggi.csv';
const NEIGHBORHOOD_URL='https://raw.githubusercontent.com/josephsocialmedia2-spec/launcher-dashboard/main/data/neighborhood_intelligence.json';
const EDIL_URL='https://raw.githubusercontent.com/josephsocialmedia2-spec/launcher-dashboard/main/data/radar_edilizio.json';
let sellerData=[];let neighborhoodData={signals:[],signals_count:0};let edilData={opportunities:[],backlog:[],contacts:[]};let current='home';let sellerView={q:'',town:'',priority:'',page:1,pageSize:20};let neighView={q:'',town:'',phonesOnly:false,page:1,pageSize:20};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);const nowIso=()=>new Date().toISOString();const today=()=>new Date().toISOString().slice(0,10);const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();const uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'it'));
function parseCSV(t){t=String(t||'').replace(/^\uFEFF/,'');let rows=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i];if(q){if(x==='"'&&t[i+1]==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===','){r.push(c);c=''}else if(x==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(x!=='\r')c+=x}if(c||r.length){r.push(c);rows.push(r)}if(rows.length<2)return[];const h=rows.shift().map(x=>x.trim());return rows.filter(x=>x.some(Boolean)).map((x,idx)=>({...Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])),_idx:idx}))}
function loadState(){try{return {...defaultState(),...JSON.parse(localStorage.getItem('f1OSStateV3')||'{}')}}catch{return defaultState()}}function save(){localStorage.setItem('f1OSStateV3',JSON.stringify(state));renderCurrent()}
const defaultState=()=>({version:VERSION,signals:[],leads:[],reminders:[],routes:[],neighborhood:[],valuations:[],assignments:[],marketing:[],communications:[],magazine:[],timeline:[],settings:{phone1:'+39 371 370 8294',phone2:'+39 371 424 6300',email:'f1immobiliaresusa@outlook.it',site:'https://f1immobiliare.com',followupDays:20,excludedTown:"Sant'Ambrogio di Torino"}});let state=loadState();
function addTimeline(type,id,text){state.timeline.unshift({id:uid('tl'),type,entityId:id,text,at:nowIso()});state.timeline=state.timeline.slice(0,500)}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
async function liveSync(show=true){try{const [s,n,e]=await Promise.all([fetch(SELLER_URL+'?v='+Date.now()).then(r=>{if(!r.ok)throw Error('seller');return r.text()}),fetch(NEIGHBORHOOD_URL+'?v='+Date.now()).then(r=>{if(!r.ok)throw Error('neighborhood');return r.json()}),fetch(EDIL_URL+'?v='+Date.now()).then(r=>r.ok?r.json():({opportunities:[],backlog:[],contacts:[]}))]);sellerData=parseCSV(s);neighborhoodData=n;edilData=e;localStorage.setItem('f1SellerCache',s);localStorage.setItem('f1NeighborhoodCache',JSON.stringify(n));localStorage.setItem('f1EdilCache',JSON.stringify(e));localStorage.setItem('f1DataUpdated',nowIso());if(show)toast('Dati Seller + Neighborhood aggiornati');renderAll()}catch(err){try{sellerData=parseCSV(localStorage.getItem('f1SellerCache')||'');neighborhoodData=JSON.parse(localStorage.getItem('f1NeighborhoodCache')||'{"signals":[]}');edilData=JSON.parse(localStorage.getItem('f1EdilCache')||'{}')}catch{}if(show)toast('Aggiornamento non riuscito: uso cache locale');renderAll()}}
function dataFreshLabel(){const d=neighborhoodData?.generated_at||localStorage.getItem('f1DataUpdated');return d?new Date(d).toLocaleString('it-IT'):'cache non aggiornata'}function neighSignals(){return Array.isArray(neighborhoodData?.signals)?neighborhoodData.signals:[]}
const pages=[['home','HOME','La mia mattina','Cosa devo fare adesso?'],['seller','SELLER RADAR','Seller Radar','Tutti i dati reali del giro acquisizione corrente'],['signals','SEGNALAZIONI','Segnalazioni manuali','Segnali inseriti o promossi dal Seller Radar'],['crm','CRM','CRM unico','Contatti, timeline, esiti e follow-up'],['reminders','RICHIAMI','Richiami','Oggi, scaduti e programmati'],['routes','GIRO ZONA','Giro di acquisizione','Dove andare e cosa verificare'],['neighborhood','NEIGHBORHOOD','Neighborhood','Seller signal arricchiti: attività, enti, professionisti e recapiti pubblici'],['valuations','VALUTAZIONI','Valutazioni','Stima minima, centrale, massima e prezzo strategico'],['assignments','INCARICHI','Incarichi','Procedura guidata, documenti, validazione e firma'],['marketing','MARKETING','Marketing immobili','Checklist post-acquisizione e pubblicazione'],['communications','COMUNICAZIONI','Comunicazioni','WhatsApp, email e lettere'],['magazine','RIVISTA','Rivista immobiliare','Edizioni mensili e stato distribuzione'],['settings','IMPOSTAZIONI','Impostazioni','Contatti ufficiali, follow-up, esclusioni e dati']];
function layout(){document.body.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">F1 <span>OS</span> IMMOBILIARE</div><div class="sub">Cabina di regia unica · v${VERSION}</div><div class="menu">${pages.map(p=>`<button data-page="${p[0]}">${p[1]}</button>`).join('')}</div></aside><main class="main"><div class="topbar"><div class="title"><h1 id="pageTitle"></h1><p id="pageSub"></p></div><span class="badge" id="dataStatus">Sincronizzazione…</span></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="modalBox"><div class="sectionTitle"><h2 id="modalTitle">Dettaglio</h2><button class="btn" id="closeModal">CHIUDI</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;renderCurrent()});document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show')}
function renderAll(){const st=document.getElementById('dataStatus');if(st)st.innerHTML=`<span class="${sellerData.length&&neighSignals().length?'status-ok':'status-bad'}">●</span> Seller ${sellerData.length} · Neighborhood ${neighSignals().length}`;renderCurrent()}
function renderCurrent(){const p=pages.find(x=>x[0]===current)||pages[0];document.getElementById('pageTitle').textContent=p[2];document.getElementById('pageSub').textContent=p[3];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));document.getElementById('content').innerHTML=renderPage(current);bindCurrent()}
function renderPage(id){return ({home:renderHome,seller:renderSeller,signals:renderSignals,crm:renderCRM,reminders:renderReminders,routes:renderRoutes,neighborhood:renderNeighborhood,valuations:renderValuations,assignments:renderAssignments,marketing:renderMarketing,communications:renderCommunications,magazine:renderMagazine,settings:renderSettings}[id]||(()=>''))()}
function metric(n,l){return `<div class="card"><div class="metric">${n}</div><div class="metricLabel">${l}</div></div>`}function kpiAction(l,n,p){return `<div class="kpiItem"><span>${l}</span><button class="btn" data-go="${p}">${n}</button></div>`}
function renderHome(){const overdue=state.reminders.filter(x=>x.status!=='COMPLETATO'&&x.dueAt<nowIso()).length,enriched=neighSignals().filter(x=>Array.isArray(x.public_entities)&&x.public_entities.length).length,t=today();return `<div class="card hero"><div class="split"><div><h3>LA MIA MATTINA</h3><div style="font-size:24px;font-weight:800">L'acquisizione è il motore dell'attività.</div><p class="note"><b>Seller Radar + Neighborhood sono caricati nella stessa cabina di regia.</b><br>Ultimo dataset: ${esc(dataFreshLabel())}</p></div><div class="actions"><button class="btn primary" data-go="seller">APRI SELLER RADAR</button><button class="btn" data-go="neighborhood">APRI NEIGHBORHOOD</button></div></div></div><div class="grid cards" style="margin-top:14px">${metric(sellerData.length,'Seller Radar')}${metric(enriched,'Neighborhood arricchito')}${metric(state.leads.length,'Contatti CRM')}${metric(state.reminders.length,'Richiami')}</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Priorità operative</h3><div class="kpiList">${kpiAction('Seller Radar da lavorare',sellerData.length,'seller')}${kpiAction('Neighborhood arricchito',enriched,'neighborhood')}${kpiAction('Richiami scaduti',overdue,'reminders')}${kpiAction('Contatti da chiamare',state.leads.filter(x=>x.status==='DA_CONTATTARE').length,'crm')}${kpiAction('Giro di oggi',state.routes.filter(x=>x.date===t&&x.status!=='FATTO').length,'routes')}</div></div><div class="card"><h3>Ultime attività</h3>${state.timeline.length?state.timeline.slice(0,8).map(x=>`<div class="kpiItem"><span>${esc(x.text)}</span><span class="small">${new Date(x.at).toLocaleString('it-IT')}</span></div>`).join(''):'<div class="empty">Nessuna attività registrata.</div>'}</div></div>`}
function sellerFiltered(){let q=norm(sellerView.q);return sellerData.filter(r=>(!sellerView.town||r.COMUNE===sellerView.town)&&(!sellerView.priority||r.PRIORITA===sellerView.priority)&&(!q||norm([r.COMUNE,r.DOVE_ANDRE,r.COSA_CERCO,r.FONTE,r.SELLER_SIGNAL,r.STATO_MERCATO].join(' ')).includes(q)))}
function renderSeller(){const missing=!sellerData.length?`<div class="card" style="border-color:#7d3030;margin-bottom:14px"><b style="color:#ffb0b0">DATI SELLER NON CARICATI</b><p class="note">Premi AGGIORNA DA GITHUB. Se non riesce, controlla la connessione Internet.</p></div>`:'';const rows=sellerFiltered(),pagesN=Math.max(1,Math.ceil(rows.length/sellerView.pageSize));sellerView.page=Math.min(sellerView.page,pagesN);const start=(sellerView.page-1)*sellerView.pageSize,shown=rows.slice(start,start+sellerView.pageSize);const towns=uniq(sellerData.map(r=>r.COMUNE));return `${missing}<div class="card"><div class="sectionTitle"><div><h2>Seller Radar — dati reali</h2><div class="note">Caricati <b>${sellerData.length}</b> record. Ultimo aggiornamento: ${esc(dataFreshLabel())}</div></div><button class="btn primary" id="refreshData">AGGIORNA DA GITHUB</button></div><div class="form"><div class="field wide"><label>Cerca indirizzo, immobile, fonte, seller signal</label><input id="sellerSearch" value="${esc(sellerView.q)}" placeholder="es. Bussoleno, ribasso, privato..."></div><div class="field"><label>Comune</label><select id="sellerTown"><option value="">TUTTI</option>${towns.map(t=>`<option ${sellerView.town===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Priorità</label><select id="sellerPriority"><option value="">TUTTE</option>${['ALTA','MEDIA','BASSA'].map(x=>`<option ${sellerView.priority===x?'selected':''}>${x}</option>`).join('')}</select></div></div></div><div class="card" style="margin-top:14px"><div class="sectionTitle"><h2>${rows.length} risultati</h2><div class="actions"><button class="btn" id="sellerPrev" ${sellerView.page<=1?'disabled':''}>◀</button><span class="tag">Pagina ${sellerView.page}/${pagesN}</span><button class="btn" id="sellerNext" ${sellerView.page>=pagesN?'disabled':''}>▶</button></div></div>${shown.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Priorità</th><th>Comune / dove andare</th><th>Cosa cercare</th><th>Mercato / Seller signal</th><th>Prezzo</th><th>Fonte</th><th>Azioni</th></tr></thead><tbody>${shown.map(r=>`<tr><td><span class="tag ${r.PRIORITA==='ALTA'?'gold':''}">${esc(r.PRIORITA||'—')}</span><br><b>Score ${esc(r.SCORE||'—')}</b></td><td><b>${esc(r.COMUNE)}</b><br>${esc(r.DOVE_ANDRE)}</td><td>${esc(r.COSA_CERCO)}<br><span class="small">${esc(r.AZIONE||'')}</span></td><td>${esc(r.STATO_MERCATO||'—')}<br><span class="tag">${esc(r.SELLER_SIGNAL||'—')}</span></td><td>${esc(r.PREZZO||'—')}</td><td>${esc(r.FONTE||'—')}</td><td><div class="rowActions"><button class="btn primary" data-seller-action="neigh" data-idx="${r._idx}">NEIGHBORHOOD</button><button class="btn" data-seller-action="route" data-idx="${r._idx}">GIRO</button><button class="btn" data-seller-action="local" data-idx="${r._idx}">SALVA</button>${r.URL?`<button class="btn" data-seller-action="open" data-idx="${r._idx}">ANNUNCIO</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessun Seller Radar corrisponde ai filtri.</div>'}</div>`}
function sellerAction(idx,action){const r=sellerData.find(x=>x._idx===idx);if(!r)return;if(action==='open'&&r.URL){window.open(r.URL,'_blank');return}if(action==='neigh'){neighView.q=[r.COMUNE,r.DOVE_ANDRE].filter(Boolean).join(' ');neighView.town=r.COMUNE||'';neighView.page=1;current='neighborhood';renderCurrent();return}if(action==='route'){state.routes.unshift({id:uid('route'),date:today(),comune:r.COMUNE,address:r.DOVE_ANDRE,reason:r.COSA_CERCO,source:r.FONTE,order:state.routes.length+1,notes:'Seller '+(r.SELLER_SIGNAL||'')+' · '+(r.STATO_MERCATO||''),status:'DA_FARE'});addTimeline('route','seller-'+idx,'Aggiunto Seller Radar al giro: '+r.COMUNE+' '+r.DOVE_ANDRE);save();toast('Aggiunto al giro');return}if(action==='local'){const exists=state.signals.some(s=>s.sourceUrl&&s.sourceUrl===r.URL);if(!exists){state.signals.unshift({id:uid('sig'),date:today(),comune:r.COMUNE,address:r.DOVE_ANDRE,source:r.FONTE,type:r.STATO_MERCATO||'SELLER',name:'',phone:'',email:'',property:r.COSA_CERCO,price:r.PREZZO,sellerType:(r.SELLER_SIGNAL||'').includes('PRIVATO')?'PRIVATO':'DA_VERIFICARE',priority:r.PRIORITA||'MEDIA',notes:'Seller signal: '+(r.SELLER_SIGNAL||'')+' · Azione: '+(r.AZIONE||''),sourceUrl:r.URL,status:'NUOVO',createdAt:nowIso()});addTimeline('signal','seller-'+idx,'Seller Radar salvato nelle segnalazioni');save();toast('Salvato nelle segnalazioni')}else toast('Seller già salvato')}}
function neighFiltered(){let q=norm(neighView.q);return neighSignals().filter(n=>(!neighView.town||n.comune===neighView.town)&&(!neighView.phonesOnly||(Array.isArray(n.public_entities)&&n.public_entities.some(e=>e.phone_public)))&&(!q||norm([n.comune,n.indirizzo,n.immobile,n.fonte,n.seller_signal,...(n.public_entities||[]).flatMap(e=>[e.name,e.address,e.phone_public,e.email_public,e.website,e.category])].join(' ')).includes(q)))}
function renderNeighborhood(){const missing=!neighSignals().length?`<div class="card" style="border-color:#7d3030;margin-bottom:14px"><b style="color:#ffb0b0">DATI NEIGHBORHOOD NON CARICATI</b><p class="note">Premi AGGIORNA DATI. Se non riesce, controlla la connessione Internet.</p></div>`:'';const rows=neighFiltered(),pagesN=Math.max(1,Math.ceil(rows.length/neighView.pageSize));neighView.page=Math.min(neighView.page,pagesN);const start=(neighView.page-1)*neighView.pageSize,shown=rows.slice(start,start+neighView.pageSize),all=neighSignals(),entities=all.reduce((a,s)=>a+(Array.isArray(s.public_entities)?s.public_entities.length:0),0),phones=all.reduce((a,s)=>a+(Array.isArray(s.public_entities)?s.public_entities.filter(e=>e.phone_public).length:0),0),towns=uniq(all.map(x=>x.comune));return `${missing}<div class="grid cards">${metric(all.length,'Seller signal Neighborhood')}${metric(all.filter(x=>Array.isArray(x.public_entities)&&x.public_entities.length).length,'segnali arricchiti')}${metric(entities,'entità pubbliche')}${metric(phones,'telefoni pubblici')}</div><div class="card" style="margin-top:14px"><div class="sectionTitle"><div><h2>Neighborhood Intelligence</h2><div class="note">Dataset generato: ${esc(dataFreshLabel())}. ${esc(neighborhoodData?.privacy||'')}</div></div><button class="btn primary" id="refreshNeighborhood">AGGIORNA DATI</button></div><div class="form"><div class="field wide"><label>Cerca Seller, indirizzo, attività, telefono, email</label><input id="neighSearch" value="${esc(neighView.q)}" placeholder="es. Via Torino, farmacia, 0122..."></div><div class="field"><label>Comune</label><select id="neighTown"><option value="">TUTTI</option>${towns.map(t=>`<option ${neighView.town===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Filtro</label><select id="neighPhones"><option value="0" ${!neighView.phonesOnly?'selected':''}>TUTTI</option><option value="1" ${neighView.phonesOnly?'selected':''}>SOLO CON TELEFONI</option></select></div></div></div><div class="card" style="margin-top:14px"><div class="sectionTitle"><h2>${rows.length} segnali</h2><div class="actions"><button class="btn" id="neighPrev" ${neighView.page<=1?'disabled':''}>◀</button><span class="tag">Pagina ${neighView.page}/${pagesN}</span><button class="btn" id="neighNext" ${neighView.page>=pagesN?'disabled':''}>▶</button></div></div>${shown.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Comune / indirizzo</th><th>Seller</th><th>Priorità</th><th>Neighborhood</th><th>Recapiti</th><th>Azioni</th></tr></thead><tbody>${shown.map((n,i)=>{const es=Array.isArray(n.public_entities)?n.public_entities:[],ph=es.filter(e=>e.phone_public).length,em=es.filter(e=>e.email_public).length;return `<tr><td><b>${esc(n.comune)}</b><br>${esc(n.indirizzo)}</td><td>${esc(n.immobile||'—')}<br><span class="small">${esc(n.fonte||'')}</span></td><td><span class="tag ${n.priorita==='ALTA'?'gold':''}">${esc(n.priorita||'—')}</span><br>Score ${esc(n.score||'—')}</td><td><b>${es.length}</b> entità<br><span class="small">${esc(n.enrichment_status||'')}</span></td><td>${ph} tel · ${em} email</td><td><button class="btn primary" data-neigh-detail="${start+i}">DETTAGLIO COMPLETO</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nessun record Neighborhood corrisponde ai filtri.</div>'}</div>`}
function renderNeighDetail(n){const es=Array.isArray(n.public_entities)?n.public_entities:[];return `<div class="card"><h3>${esc(n.comune)} — ${esc(n.indirizzo)}</h3><p>${esc(n.immobile||'')}</p><div class="note">Fonte: ${esc(n.fonte||'')} · Seller signal: ${esc(n.seller_signal||'')} · Priorità: ${esc(n.priorita||'')} · Score: ${esc(n.score||'')}</div></div><div class="card" style="margin-top:12px"><h3>Entità pubbliche vicine (${es.length})</h3>${es.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Categoria</th><th>Indirizzo</th><th>Telefono</th><th>Email</th><th>Sito</th></tr></thead><tbody>${es.map(e=>`<tr><td><b>${esc(e.name||'')}</b><br><span class="small">${esc(e.source||'')}</span></td><td>${esc(e.category||'')}</td><td>${esc(e.address||'')}</td><td>${e.phone_public?`<a href="tel:${esc(e.phone_public)}" style="color:#f0d47d">${esc(e.phone_public)}</a>`:'—'}</td><td>${e.email_public?`<a href="mailto:${esc(e.email_public)}" style="color:#f0d47d">${esc(e.email_public)}</a>`:'—'}</td><td>${e.website?`<a href="${esc(e.website)}" target="_blank" style="color:#f0d47d">APRI</a>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessuna entità pubblica disponibile per questo segnale.</div>'}</div>`}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function renderSignals(){return `<div class="card"><h2>Segnalazioni salvate</h2>${state.signals.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Comune</th><th>Indirizzo</th><th>Fonte</th><th>Priorità</th><th>Stato</th></tr></thead><tbody>${state.signals.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.comune)}</td><td>${esc(x.address)}</td><td>${esc(x.source)}</td><td>${esc(x.priority)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Salva un record dal Seller Radar per inserirlo qui.</div>'}</div>`}
function renderCRM(){return `<div class="card"><div class="sectionTitle"><h2>CRM unico</h2><button class="btn primary" id="newLead">NUOVO CONTATTO</button></div>${state.leads.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Telefono</th><th>Comune</th><th>Stato</th><th>Prossima azione</th></tr></thead><tbody>${state.leads.map(l=>`<tr><td>${esc(l.name||'')}</td><td>${esc(l.phone||'')}</td><td>${esc(l.comune||'')}</td><td>${esc(l.status||'')}</td><td>${esc(l.nextAction||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessun contatto CRM.</div>'}</div>`}
function renderReminders(){return `<div class="card"><h2>Richiami</h2>${state.reminders.length?state.reminders.map(r=>`<div class="kpiItem"><span><b>${esc(r.title)}</b><br><span class="small">${new Date(r.dueAt).toLocaleString('it-IT')}</span></span><span class="tag">${esc(r.status)}</span></div>`).join(''):'<div class="empty">Nessun richiamo.</div>'}</div>`}
function renderRoutes(){return `<div class="card"><h2>Giro di acquisizione</h2>${state.routes.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Comune</th><th>Indirizzo</th><th>Motivo</th><th>Fonte</th><th>Stato</th></tr></thead><tbody>${state.routes.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.comune)}</td><td>${esc(r.address)}</td><td>${esc(r.reason)}</td><td>${esc(r.source)}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Dal Seller Radar premi GIRO per costruire la lista.</div>'}</div>`}
function renderValuations(){return `<div class="card"><h2>Valutazioni</h2><div class="empty">Modulo disponibile nella versione locale completa. Su mobile resta consultabile come cabina operativa.</div></div>`}function renderAssignments(){return `<div class="card"><h2>Incarichi</h2><div class="empty">Modulo disponibile nella versione locale completa. Su mobile resta consultabile come cabina operativa.</div></div>`}function renderMarketing(){return `<div class="card"><h2>Marketing immobili</h2><div class="empty">Checklist marketing disponibile nella versione locale completa.</div></div>`}function renderCommunications(){return `<div class="card"><h2>Comunicazioni</h2><div class="actions"><a class="btn primary" href="https://wa.me/393713708294" target="_blank">WHATSAPP F1</a><a class="btn" href="mailto:f1immobiliaresusa@outlook.it">EMAIL F1</a></div></div>`}function renderMagazine(){return `<div class="card"><h2>Rivista</h2><div class="empty">Archivio edizioni mensili nella versione locale completa.</div></div>`}function renderSettings(){return `<div class="card"><h2>Impostazioni</h2><p class="note">Telefono: ${esc(state.settings.phone1)}<br>Email: ${esc(state.settings.email)}<br>Sito: ${esc(state.settings.site)}<br>Follow-up standard: ${esc(state.settings.followupDays)} giorni</p><button class="btn primary" id="refreshSettings">AGGIORNA SELLER + NEIGHBORHOOD</button></div>`}
function bindCurrent(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=b.dataset.go;renderCurrent()});if(current==='seller')bindSeller();if(current==='neighborhood')bindNeighborhood();if(current==='crm'){const b=document.getElementById('newLead');if(b)b.onclick=()=>{const name=prompt('Nome contatto');if(!name)return;const phone=prompt('Telefono')||'';state.leads.unshift({id:uid('lead'),name,phone,comune:'',status:'DA_CONTATTARE',nextAction:'',createdAt:nowIso()});addTimeline('lead','',`Nuovo contatto CRM: ${name}`);save()}}if(current==='settings'){const b=document.getElementById('refreshSettings');if(b)b.onclick=()=>liveSync(true)}}
function bindSeller(){const qs=document.getElementById('sellerSearch'),town=document.getElementById('sellerTown'),pr=document.getElementById('sellerPriority');const rr=()=>{sellerView.page=1;renderCurrent()};if(qs)qs.oninput=()=>{sellerView.q=qs.value;clearTimeout(qs._t);qs._t=setTimeout(rr,250)};if(town)town.onchange=()=>{sellerView.town=town.value;rr()};if(pr)pr.onchange=()=>{sellerView.priority=pr.value;rr()};const prev=document.getElementById('sellerPrev'),next=document.getElementById('sellerNext');if(prev)prev.onclick=()=>{sellerView.page=Math.max(1,sellerView.page-1);renderCurrent()};if(next)next.onclick=()=>{sellerView.page++;renderCurrent()};const ref=document.getElementById('refreshData');if(ref)ref.onclick=()=>liveSync(true);document.querySelectorAll('[data-seller-action]').forEach(b=>b.onclick=()=>sellerAction(Number(b.dataset.idx),b.dataset.sellerAction))}
function bindNeighborhood(){const qs=document.getElementById('neighSearch'),town=document.getElementById('neighTown'),ph=document.getElementById('neighPhones');const rr=()=>{neighView.page=1;renderCurrent()};if(qs)qs.oninput=()=>{neighView.q=qs.value;clearTimeout(qs._t);qs._t=setTimeout(rr,250)};if(town)town.onchange=()=>{neighView.town=town.value;rr()};if(ph)ph.onchange=()=>{neighView.phonesOnly=ph.value==='1';rr()};const prev=document.getElementById('neighPrev'),next=document.getElementById('neighNext');if(prev)prev.onclick=()=>{neighView.page=Math.max(1,neighView.page-1);renderCurrent()};if(next)next.onclick=()=>{neighView.page++;renderCurrent()};const ref=document.getElementById('refreshNeighborhood');if(ref)ref.onclick=()=>liveSync(true);const filtered=neighFiltered();document.querySelectorAll('[data-neigh-detail]').forEach(b=>b.onclick=()=>{const n=filtered[Number(b.dataset.neighDetail)];if(n)openModal(renderNeighDetail(n))})}
window.addEventListener('DOMContentLoaded',()=>{layout();renderAll();liveSync(false)})
</script>
