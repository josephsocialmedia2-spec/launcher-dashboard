<script>

function parse(s){var z=[],r=[],c='',q=false;for(var i=0;i<s.length;i++){var h=s[i],nx=s[i+1];if(h==='"'){if(q&&nx==='"'){c+='"';i++}else q=!q}else if(h===','&&!q){r.push(c);c=''}else if((h==='\n'||h==='\r')&&!q){if(h==='\r'&&nx==='\n')i++;r.push(c);c='';if(r.some(Boolean))z.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);z.push(r)}if(z.length<2)return[];var hd=z.shift();return z.map(function(a){var o={};hd.forEach(function(k,j){o[k]=a[j]||''});return o})}
